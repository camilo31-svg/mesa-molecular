  async function members() {
    const data = await api('admin/members');
    show('Personas y permisos', '<p class="muted">Los permisos se aplican al espacio «' + esc(space.name) + '».</p>' +
      (data.members.length ? tableView(['Usuario', 'Permiso'], data.members.map(item => [esc(item.name), esc(roles[item.role])])) : '<p>Sin miembros invitados.</p>') +
      '<p>Invitaciones vigentes: ' + data.invitations.length + '</p>' +
      choices([['Crear invitación', 'team-invite'], ['Cambiar permiso', 'team-role']]), null, '', 'Equipo');
  }

  function invite() {
    show('Invitar a una persona', field('Permiso', select('role', roleOptions, 'write')), async data => {
      const result = await api('admin/invite', { role: textOf(data, 'role') });
      show('Invitación lista', '<p>Comparte la dirección del servidor y este código. El código admite un uso y caduca en 24 horas.</p>' +

      return false;

  }

      field('Permiso', select('role', [...roleOptions, ['none', 'Retirar acceso']], 'read')), async data => {
      await api('admin/member', { name: textOf(data, 'name'), role: textOf(data, 'role') });

  async function audit() {

  }

  function chooseSpace() {
    show('Cambiar espacio', choices(spaces.map(item => [item.name + ' · ' + roles[item.role], 'team-open-space', item.id])), null, '', 'Equipo');

  function createSpace() {
    show('Crear espacio', field('Nombre', input('name', '', 'required maxlength="100"')), async data => {
      const result = await api('admin/spaces', { name: textOf(data, 'name') });
      await go(result.id);
    }, 'Crear', 'Equipo');
  }

  async function go(id) {
    await flush();
    if (conflict) throw Error('Guarda tu borrador y resuelve el conflicto antes de cambiar de espacio.');
    source?.close();
    location.assign('/app?space=' + encodeURIComponent(id));
  }

  async function logout() {
    await flush();
    if (conflict) throw Error('Guarda tu borrador antes de cerrar la sesión.');
    await api('logout', {});
    source?.close();
    location.assign('/');
  }

  function reset() {
    show('Recargar versión del equipo', '<p>El borrador de esta pestaña será sustituido por la revisión del servidor.</p>' +
      '<label class="check-row"><input type="checkbox" required> Ya guardé lo que quiero conservar.</label>', () => {
      conflict = null;
      base = null;
      source?.close();
      location.reload();

  }

  function importLink() {
    show('Importar archivo externo', field('Enlace directo HTTPS', input('url', '', 'type="url" required')) +
      '<p class="muted">Admite enlaces descargables de Dropbox, Box y OneDrive. El servidor contactará al proveedor para traer el archivo a este espacio.</p>', async data => {
      const result = await api('files/import', { url: textOf(data, 'url') });
      const bytes = Uint8Array.from(atob(result.data), character => character.charCodeAt(0));
      const asset = await makeAsset(new File([bytes], result.name, { type: result.type }));
      db.assets.push(asset);
      save();
      render();

  }

  function share(doc) {
    const url = new URL('/app', location.origin);
    url.searchParams.set('space', space.id);
    url.searchParams.set('file', doc.id);
    return field('Enlace para miembros del espacio', input('share', url.href, 'readonly'));
  }

  async function submitBlast() {
    const sequence = byId('form').elements.output.value;
    const result = await api('blast', { sequence, type: active().type });
    const url = 'https://blast.ncbi.nlm.nih.gov/Blast.cgi?CMD=Get&FORMAT_TYPE=HTML&RID=' + encodeURIComponent(result.rid);
    show('BLAST enviado a NCBI', '<p>Identificador: <strong class="mono">' + esc(result.rid) + '</strong>.</p>' +
      (result.estimate ? '<p>Tiempo estimado por NCBI: ' + result.estimate + ' s.</p>' : '') +
      '<a class="as-button" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Abrir resultados en NCBI</a>', null, '', '');
  }

  const actions = {
    'team-menu': openMenu, 'team-spaces': chooseSpace, 'team-open-space': go, 'team-create-space': createSpace,
    'team-members': members, 'team-invite': invite, 'team-role': changeRole, 'team-audit': audit,
    'team-logout': logout, 'team-reset': reset, 'team-import-link': importLink,
    'team-model-run': runModel, 'import-model-server': importResult,
    'team-blast-submit': submitBlast,

  return { enabled, start, status, schedule, flush, writable, creatable, readableOnly, actionAllowed, actions, share,
    scope: () => space?.id || 'local', models: () => enabled && modelAvailable, blast: () => enabled && blastAvailable, modelInfo };
})();

    cds: '<path d="M-19-10H7L21 0 7 10H-19Z" fill="' + color + '" stroke="' + color + '" stroke-width="1.5"/>',
    terminator: '<path d="M0 0V-17m-13 0h26" ' + common + '/>',

    origin: '<circle cx="0" cy="0" r="13" fill="white" stroke="' + color + '" stroke-width="2"/>',

  };

function circuitNetworkSVG(circuit, interactive = true) {
  const state = interactive ? circuitSession(circuit) : {};
  const width = Math.max(900, ...circuit.nodes.map(item => item.x + 230));
  const height = Math.max(430, ...circuit.nodes.map(item => item.y + 125));
  const edges = circuit.edges.map(edge => {
    const from = circuit.nodes.find(item => item.id === edge.source);
    const to = circuit.nodes.find(item => item.id === edge.target);
    const x = from.x + 184, y = from.y + 36, tx = to.x, ty = to.y + 36;
    const backward = tx <= x;
    const curve = backward ? 'M' + x + ' ' + y + 'C' + (x + 95) + ' ' + (y - 115) + ' ' + (tx - 95) + ' ' + (ty - 115) + ' ' + tx + ' ' + ty :
      'M' + x + ' ' + y + 'C' + (x + tx) / 2 + ' ' + y + ' ' + (x + tx) / 2 + ' ' + ty + ' ' + tx + ' ' + ty;
    const inhibition = edge.kind === 'inhibition' || edge.kind === 'signal' && ['NOT', 'NOR'].includes(to.gate);
    const color = inhibition ? '#a74c64' : '#548579';
    const cap = inhibition ? '<path d="M' + (tx - 2) + ' ' + (ty - 7) + 'v14" stroke="' + color + '" stroke-width="2.5"/>' :
      '<path d="M' + (tx - 8) + ' ' + (ty - 5) + 'l8 5-8 5" fill="none" stroke="' + color + '" stroke-width="2"/>';
    return '<g' + (interactive ? ' data-action="circuit-edge" data-value="' + edge.id + '" class="circuit-edge" role="button" tabindex="0" aria-label="Conexión ' +
      esc(from.name + ' a ' + to.name) + '"' : '') + '><path d="' + curve + '" stroke="transparent" stroke-width="14" fill="none"/>' +
      '<path d="' + curve + '" stroke="' + color + '" stroke-width="1.8" fill="none"/>' + cap + '</g>';
  }).join('');
  const nodes = circuit.nodes.map(item => {
    const selected = state.selected === item.id;
    const attrs = interactive ? ' data-circuit-node="' + item.id + '" data-action="circuit-node" data-value="' + item.id +
      '" class="circuit-node" role="button" tabindex="0" aria-label="Especie ' + esc(item.name) + '"' : '';
    const parts = circuit.parts.flatMap(part=>[...(part.node===item.id?[part]:[]),...Object.entries(part.childNodes||{}).flatMap(([index,node])=>node===item.id&&part.annotations?.[Number(index)]?[{...part.annotations[Number(index)],role:part.annotations[Number(index)].biopart?.role||'tu',strand:part.annotations[Number(index)].strand,color:colorOf(part.annotations[Number(index)].color),modelChild:part.id+'|'+index}]:[])]).slice(0,4);
    const display = parts.length ? parts : [{ role: 'cds', color: item.color, strand: 1 }];
    const glyph = item.kind === 'input' ? '<circle cx="30" cy="35" r="16" fill="' + item.color + '" opacity=".18"/><circle cx="30" cy="35" r="11" fill="none" stroke="' +
      item.color + '" stroke-width="2"/>' : display.map((part, i) =>
      '<g'+(interactive&&part.modelChild?' data-model-child="'+part.modelChild+'"':interactive&&part.id?' data-model-part="'+part.id+'"':'')+' transform="translate(' + (25 + i * 43) + ' 38) scale(' + .66 * part.strand + ' .66)">' + circuitGlyph(part.role, part.color) + '</g>').join('') +
      '<path d="M10 38H174" stroke="' + item.color + '" stroke-width="1"/>';
    return '<g transform="translate(' + item.x + ' ' + item.y + ')"' + attrs + '><rect width="184" height="78" rx="8" fill="white" stroke="' +
      (selected ? '#2d48ba' : '#d4dce8') + '" stroke-width="' + (selected ? 2.5 : 1.2) + '"/>' + glyph +
      '<text x="10" y="16" fill="#1e2c45" font-size="11" font-weight="600">' + esc(item.name.length > 24 ? item.name.slice(0, 23) + '…' : item.name) +
      '</text><text x="174" y="66" text-anchor="end" fill="#67748a" font-size="10">' + (item.kind === 'input' ? 'Entrada · ' + item.low + ' / ' + item.high : esc(item.gate)) + '</text></g>';
  }).join('');
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '" viewBox="0 0 ' + width + ' ' + height +
    '" class="circuit-network" role="group" aria-label="Red de regulación" font-family="Arial,sans-serif"><rect width="100%" height="100%" fill="#f7f9fc"/>' + edges + nodes + '</svg>';
}

function circuitPartsSVG(circuit, interactive = true) {
  const columns = 7;

  const width = 950;

  const content = circuit.parts.map((part, i) => {
    const row = Math.floor(i / columns);
    const x = 80 + i % columns * 130;
    const y = 75 + row * stride;
    const children=(part.annotations||[]).flatMap((f,index)=>f.biopart?.role==='tu'?[{f,index}]:[]);
    return '<g' + (interactive ? ' data-action="circuit-part" data-value="' + part.id + '" role="button" tabindex="0" class="circuit-part" aria-label="Parte ' + esc(part.name) + '"' : '') +
      '><rect x="' + (x - 60) + '" y="' + (y - 30) + '" width="120" height="85" fill="transparent" rx="6"/>' +
      '<path d="M' + (x - 64) + ' ' + y + 'h130" stroke="#6b7788" stroke-width="1.2"/>' +
      '<g transform="translate(' + x + ' ' + y + ') scale(' + part.strand + ' 1)">' + circuitGlyph(part.role, part.color) + '</g>' +
      '<text x="' + x + '" y="' + (y + 31) + '" text-anchor="middle" font-size="11" fill="#1e2c45">' +
      esc(part.name.length > 18 ? part.name.slice(0, 17) + '…' : part.name) + '</text><text x="' + x + '" y="' + (y + 46) +
      '" text-anchor="middle" font-size="9" fill="#788396">' + esc(circuitRoleNames[part.role]) +
      (part.bases ? ' · ' + part.bases.length + ' bp' : '') + '</text>'+children.slice(0,3).map(({f,index},i)=>'<text x="'+x+'" y="'+(y+63+i*14)+'" font-size="10" fill="#2865a6" text-anchor="middle"'+(interactive?' data-model-child="'+part.id+'|'+index+'" data-action="part-model-info" data-value="'+part.id+'|'+index+'" role="button" tabindex="0" aria-label="TU '+esc(f.name)+' en '+esc(part.name)+'"':'')+'>'+esc(f.name.length>18?f.name.slice(0,17)+'…':f.name)+'</text>').join('')+(children.length>3?'<text x="'+x+'" y="'+(y+105)+'" font-size="9" text-anchor="middle">+'+(children.length-3)+' TUs · clic derecho</text>':'')+'</g>';

    '" role="group" aria-label="Constructo genético" font-family="Arial,sans-serif"><rect width="100%" height="100%" fill="white"/>' +
    '<text x="20" y="25" font-size="14" fill="#263651">' + esc(circuit.name || 'Constructo') + '</text>' + content + '</svg>';
}

function circuitChart(points, nodes, { xKey = 'time', xLabel = 'Tiempo (min)', title = 'Evolución temporal', yLabel = 'Moléculas / célula' } = {}) {
  if (!points?.length || !nodes.length) return '<p class="muted">Ejecuta el modelo para ver las curvas.</p>';
  const width = 850, height = 360, left = 70, top = 32, track = 742, vertical = 260;
  const xmax = Math.max(1e-9, ...points.map(point => point[xKey]));
  const ymin = 0;
  const ymax = Math.max(1, ...points.flatMap(point => nodes.map(item => point.values[item.id] || 0)));
  const x = value => left + value / xmax * track;
  const y = value => top + vertical * (1 - (value - ymin) / (ymax - ymin));
  const axes = Array.from({ length: 6 }, (_, i) => {
    const tick = ymax * i / 5;
    return '<path d="M' + left + ' ' + y(tick) + 'h' + track + '" stroke="#e5eaf1"/>' +
      '<text x="' + (left - 10) + '" y="' + (y(tick) + 4) + '" text-anchor="end">' + Number(tick.toPrecision(3)) + '</text>' +
      '<text x="' + x(xmax * i / 5) + '" y="' + (top + vertical + 23) + '" text-anchor="middle">' + Number((xmax * i / 5).toPrecision(3)) + '</text>';
  }).join('');
  const curves = nodes.map(item => '<polyline points="' + points.map(point => x(point[xKey]).toFixed(2) + ',' + y(point.values[item.id] || 0).toFixed(2)).join(' ') +
    '" fill="none" stroke="' + item.color + '" stroke-width="2"' + (item.kind === 'input' ? ' stroke-dasharray="5 4"' : '') +
    '><title>' + esc(item.name) + '</title></polyline>').join('');
  return '<div class="circuit-chart"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="' +
    esc(title) + '" font-family="Arial,sans-serif" font-size="11" fill="#66748a"><rect width="100%" height="100%" fill="white"/>' +
    axes + '<path d="M' + left + ' ' + top + 'v' + vertical + 'h' + track + '" fill="none" stroke="#94a2b6"/>' + curves +
    '<text x="440" y="345" text-anchor="middle">' + esc(xLabel) + '</text><text x="12" y="18">' + esc(yLabel) + '</text></svg>' +
    '<div class="circuit-legend">' + nodes.map(item => '<span><i style="background:' + item.color + '"></i>' + esc(item.name) + '</span>').join('') + '</div></div>';
}

const circuitSessions = new Map();
const currentCircuit = () => db.circuits.find(item => item.id === ui.circuit);
const circuitWritable = () => Team.writable();

function circuitImportName(value) {
  const base = typeof value === 'string' ? value.trim().slice(0, 160) || 'Circuito importado' : 'Circuito importado';
  let name = base, index = 2;
  while (db.circuits.some(item => item.name === name)) name = base.slice(0, 150) + ' (' + index++ + ')';
  return name;
}

function circuitCapacity(candidate, replace = '') {
  const list = db.circuits.filter(item => item.id !== replace).concat(candidate);
  if (list.length > 100) throw Error('Se admiten hasta 100 circuitos por espacio.');
  const size = list.reduce((total, item) => total + (item.ucf?.length || 0) + item.parts.reduce((sum, part) => sum + (part.bases?.length || 0), 0), 0);
  if (size > 30_000_000) throw Error('Las bibliotecas y secuencias de los circuitos superan 30 MB en este espacio.');
}

function circuitSession(circuit) {
  const key = Team.scope() + ':' + circuit.id;
  if (!circuitSessions.has(key)) circuitSessions.set(key, { tab: 'design', selected: '', view: 'network', zoom: 1, undo: [], redo: [], updated: circuit.updated, assignment: circuit.assignment });
  const state = circuitSessions.get(key);
  if (state.updated !== circuit.updated) {
    for (const name of ['simulation', 'sweep', 'assignment', 'connect']) delete state[name];
    state.undo = []; state.redo = []; state.updated = circuit.updated;
    state.assignment = circuit.assignment;
  }
  return state;
}

function circuitSnapshot(circuit) {
  const { ucf, ...fields } = circuit;
  return structuredClone(fields);
}

function circuitRemember(circuit) {
  const state = circuitSession(circuit);
  state.undo.push(circuitSnapshot(circuit));
  if (state.undo.length > 20) state.undo.shift();
  state.redo = [];
}

function saveCircuit(circuit, refresh = true, preserveResults = false) {
  if (!preserveResults) delete circuit.assignment;
  Circuit.validate(circuit);
  const state = circuitSession(circuit);
  circuit.updated = Date.now();
  state.updated = circuit.updated;
  if (!preserveResults) {
    delete state.simulation;
    delete state.sweep;
    delete state.assignment;
  }
  save();
  if (refresh) renderEditor();
}

function circuitOpen(id) {

    field('Proyecto', select('project', db.projects.map(item => [item.id, item.name]), ui.project)), data => {

    const project = textOf(data, 'project');

function circuitAssignments(circuit, state) {
  if (!circuit.ucf) return {};
  if (state.ucfText !== circuit.ucf) {
    state.ucf = Circuit.readUCF(circuit.ucf);
    state.ucfText = circuit.ucf;
  }
  const map = new Map(state.ucf.library.map(gate => [gate.name, gate]));
  return Object.fromEntries(Object.entries(state.assignment?.assignments || {}).flatMap(([id, name]) => map.has(name) ? [[id, map.get(name)]] : []));
}

function circuitPartDialog(value = '') {
  const circuit = currentCircuit();
  const existing = circuit.parts.find(part => part.id === value);
  const item = existing || { id: uuid(), name: circuitRoleNames[value] || 'Parte', role: Object.hasOwn(circuitRoleNames, value) ? value : 'cds',

  const records = db.docs.filter(doc => doc.kind === 'sequence' && doc.type === 'DNA');
  show(existing ? 'Editar parte' : 'Añadir parte', field('Nombre', input('name', item.name, 'maxlength="160" required')) + '<div class="dialog-grid">' +
    field('Símbolo', select('role', Object.entries(circuitRoleNames), item.role)) + field('Orientación', select('strand', [['1', '5′ → 3′'], ['-1', '3′ ← 5′']], String(item.strand))) +
    field('Especie asociada', select('node', [['', 'Sin asociación'], ...circuit.nodes.map(n => [n.id, n.name])], item.node || '')) +
    field('Color', '<input type="color" name="color" value="' + item.color + '">') + '</div>' +
    field('Copiar bases de una secuencia', '<select id="circuit-part-sequence">' + [['', 'Elegir secuencia'], ...records.map(doc => [doc.id, doc.name])].map(([id, name]) => option(id, name, '')).join('') + '</select>') +
    field('Bases de la parte (opcional)', area('bases', item.bases || '', 'rows="3" class="mono" spellcheck="false" maxlength="250000"')) +
    modelBiopartMarkup(item) +
    (existing ? '<div class="toolbar">' + btn('← Mover', 'circuit-part-shift', attr(item.id + ':-1')) + btn('Mover →', 'circuit-part-shift', attr(item.id + ':1')) +
      btn('Eliminar parte', 'circuit-part-delete', attr(item.id)) + '</div>' : ''), async data => {

      const info = Circuit.readUCF(text);

      circuitCapacity({ ...circuit, ucf: text }, circuit.id);
      circuit.ucf = text;
      saveCircuit(circuit);
      toast(info.library.length + ' puertas importadas de ' + info.name);

      const model = JSON.parse(text);
      Circuit.validate(model);
      const circuit = { ...model, id: uuid(), name: circuitImportName(model.name),
        project: projectOf(model.project) ? model.project : projectOf(ui.project) ? ui.project : db.projects[0].id, updated: Date.now() };
      circuitCapacity(circuit);
      db.circuits.push(circuit);
      save();
      circuitOpen(circuit.id);
    }
  }, 'Importar', 'Modelado');
}

async function circuitExport(type) {
  const circuit = currentCircuit();
  const state = circuitSession(circuit);
  const asRows = (rows, xKey) => Notebook.csv([[xKey, ...circuit.nodes.map(n => n.name)], ...rows.map(point => [point[xKey], ...circuit.nodes.map(n => point.values[n.id])])]);
  const exporters = {
    json: () => [circuit.name + '.circuit.json', JSON.stringify(circuit, null, 2), 'application/json'],
    sbml: () => [circuit.name + '.sbml', CircuitExchange.sbml(circuit), 'application/xml'],
    antimony: () => [circuit.name + '.ant', CircuitExchange.antimony(circuit)],
    verilog: () => [circuit.name + '.v', CircuitExchange.verilog(circuit)],
    sbol: () => [circuit.name + '.sbol.jsonld', CircuitExchange.sbol(circuit), 'application/ld+json'],
    'parts-svg': () => [circuit.name + '-parts.svg', circuitPartsSVG(circuit, false), 'image/svg+xml'],
    'network-svg': () => [circuit.name + '-network.svg', circuitNetworkSVG(circuit, false), 'image/svg+xml'],
    csv: () => [circuit.name + '-simulation.csv', asRows(state.simulation.points, 'time'), 'text/csv'],
    sweep: () => [circuit.name + '-sweep.csv', asRows(state.sweep.rows, 'value'), 'text/csv'],
  };
  if (type === 'cello') {
    const entries = [['design.v', CircuitExchange.verilog(circuit)], ['project.circuit.json', JSON.stringify(circuit, null, 2)],
      ['LEEME.txt', 'Especificación Verilog y UCF para Cello v2.\nAñade los archivos inputSensorFile y outputDeviceFile compatibles con tu UCF.\nDocumentación: https://github.com/CIDARLAB/Cello-v2\nLa asignación local de Mesa Molecular no ejecuta Cello.\n']];
    if (circuit.ucf) entries.push(['library.UCF.json', circuit.ucf]);
    download(circuit.name + '-cello.zip', zipStored(entries), 'application/zip');
    return;
  }
  if (exporters[type]) download(...exporters[type]());
}

function circuitUndo(redo = false) {
  const circuit = currentCircuit();
  const state = circuitSession(circuit);
  const source = redo ? state.redo : state.undo;
  const target = redo ? state.undo : state.redo;
  if (!source.length) return;
  const old = source.pop();
  target.push(circuitSnapshot(circuit));
  const ucf = circuit.ucf, updated = circuit.updated;
  for (const key of Object.keys(circuit)) delete circuit[key];
  Object.assign(circuit, old, { updated }, ucf ? { ucf } : {});
  saveCircuit(circuit);
}

let circuitDrag;
document.addEventListener('pointerdown', event => {
  const group = event.target.closest?.('[data-circuit-node]');
  if (!group || ui.dashboard !== 'circuits' || !circuitWritable() || event.button !== 0) return;
  const circuit = currentCircuit();
  if (circuitSession(circuit).connect) return;
  const svg = group.closest('svg');
  const start = relativePoint(svg, event.clientX, event.clientY);
  const item = circuit.nodes.find(n => n.id === group.dataset.circuitNode);
  circuitDrag = { circuit, item, group, svg, start, x: item.x, y: item.y, pointer: event.pointerId, moved: false };
  svg.setPointerCapture(event.pointerId);
  event.preventDefault();
});
document.addEventListener('pointermove', event => {
  if (!circuitDrag || circuitDrag.pointer !== event.pointerId) return;
  const d = circuitDrag;
  const point = relativePoint(d.svg, event.clientX, event.clientY);
  d.nextX = Math.max(0, Math.min(2500, Math.round((d.x + point.x - d.start.x) / 8) * 8));
  d.nextY = Math.max(0, Math.min(2000, Math.round((d.y + point.y - d.start.y) / 8) * 8));
  if (Math.hypot(point.x - d.start.x, point.y - d.start.y) > 3) d.moved = true;
  d.group.setAttribute('transform', 'translate(' + d.nextX + ' ' + d.nextY + ')');
});
function circuitDragEnd(event) {
  if (!circuitDrag || circuitDrag.pointer !== event.pointerId) return;
  const d = circuitDrag;
  circuitDrag = null;
  if (event.type === 'pointerup' && d.moved) {
    circuitRemember(d.circuit);
    Object.assign(d.item, { x: d.nextX, y: d.nextY });
    circuitSession(d.circuit).selected = d.item.id;
    saveCircuit(d.circuit, true, true);
  } else {
    d.group.setAttribute('transform', 'translate(' + d.x + ' ' + d.y + ')');
    if (event.type === 'pointerup') {
      circuitSession(d.circuit).selected = d.item.id;
      renderEditor();
    }
  }
  if (event.type === 'pointerup') document.querySelector('[data-circuit-node="' + d.item.id + '"]')?.focus();
}
document.addEventListener('pointerup', circuitDragEnd);
document.addEventListener('pointercancel', circuitDragEnd);
document.addEventListener('keydown', event => {
  const control = event.target.closest?.('.circuit-edge, .circuit-part');
  if (control && ['Enter', ' '].includes(event.key)) {
    event.preventDefault(); runAction(control.dataset.action, control.dataset.value, event); return;
  }
  const node = event.target.closest?.('[data-circuit-node]');
  if (!node || !['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' '].includes(event.key)) return;
  event.preventDefault();
  if (event.key === 'Enter' || event.key === ' ') { runAction('circuit-node', node.dataset.circuitNode, event); return; }
  if (!circuitWritable()) return;
  const circuit = currentCircuit();
  const item = circuit.nodes.find(n => n.id === node.dataset.circuitNode);
  circuitRemember(circuit);
  item.x = Math.max(0, Math.min(2500, item.x + ({ ArrowLeft: -8, ArrowRight: 8 }[event.key] || 0)));
  item.y = Math.max(0, Math.min(2000, item.y + ({ ArrowUp: -8, ArrowDown: 8 }[event.key] || 0)));
  saveCircuit(circuit, true, true);
  document.querySelector('[data-circuit-node="' + item.id + '"]')?.focus();
});

const partGrammars=()=>{
  const known=[PartData.builtin(),...(db.grammars||[])],foreign=new Map();

async function readBiopartForm(data,doc,feature,previous){

  const part={schema:1,id:reference&&!variant?reference.id:uuid(),version:reference&&!variant?reference.version:1,role,fingerprint,parameters:{},members:[],context:textOf(data,'bio-context'),reference:textOf(data,'bio-reference')};
  if(reference&&variant)part.derivedFrom=reference.id;
  const g=partGrammars().find(g=>g.id===textOf(data,'bio-grammar')),category=g?.types.find(t=>t.id===textOf(data,'bio-category'));
  if(g&&!category)throw Error('Selecciona el tipo dentro de la gramática.');
  if(g)part.grammar={id:g.id,name:g.name,version:g.version,category:category.id,typeName:category.name,prefix:textOf(data,'bio-prefix').toUpperCase(),suffix:textOf(data,'bio-suffix').toUpperCase(),level:textOf(data,'bio-level'),position:textOf(data,'bio-position')};
  for(const key of Object.keys(PartData.parameters))if(textOf(data,bioParamName(key))!=='')part.parameters[key]={value:Number(data.get(bioParamName(key))),unit:textOf(data,'bio-u-'+key)};
  if(['tu','module'].includes(role)){

    const candidates=doc.features.filter(f=>f!==feature&&f.biopart&&f.biopart.id!==part.id&&contained(f,feature));
    const members=candidates.filter(f=>!candidates.some(parent=>parent!==f&&Regions.fromRanges(parent.ranges).length>Regions.fromRanges(f.ranges).length&&contained(f,parent)));

function proteinChargeChart(analysis,pH){
  if(analysis.pI===null)return '';
  const samples=Array.from({length:71},(_,i)=>[i/5,analysis.charge(i/5)]);
  const low=Math.floor(Math.min(-1,...samples.map(p=>p[1]))),high=Math.ceil(Math.max(1,...samples.map(p=>p[1])));
  const x=p=>38+p/14*310,y=q=>18+(high-q)/(high-low)*112;
  const d=samples.map(([p,q],i)=>(i?'L':'M')+x(p).toFixed(2)+' '+y(q).toFixed(2)).join('');
  return '<svg class="protein-charge-chart" role="img" aria-label="Carga neta frente a pH" viewBox="0 0 370 162"><title>Carga teórica; pI '+analysis.pI.toFixed(2)+'</title>'+
    '<path d="M38 18V130H348M38 '+y(0)+'H348" fill="none" stroke="var(--line)"/>'+
    [0,2,4,6,8,10,12,14].map(p=>'<text x="'+x(p)+'" y="146" text-anchor="middle">'+p+'</text>').join('')+
    [low,0,high].map(q=>'<text x="32" y="'+(y(q)+3)+'" text-anchor="end">'+q+'</text>').join('')+
    '<path d="'+d+'" fill="none" stroke="var(--blue)" stroke-width="2"/>'+
    '<path d="M'+x(analysis.pI)+' 18V130" stroke="var(--muted)" stroke-dasharray="3 3"/><circle cx="'+x(pH)+'" cy="'+y(analysis.charge(pH))+'" r="3" fill="var(--blue)"/>'+
    '<text x="353" y="159" text-anchor="end">pH</text></svg>';
}

const NotebookDictation=(()=>{
  let recognition=null,entryId='',finals=new Set(),pending='';
  const listening=()=>Boolean(recognition);
  function paint(){for(const button of document.querySelectorAll('[data-action="note-dictation"]')){button.setAttribute('aria-pressed',String(listening()));button.textContent=listening()?'■ Detener dictado':'🎙 Dictado';}const status=byId('dictation-status');if(status)status.textContent=listening()?'Escuchando… '+pending:'';}
  function stop(){recognition?.stop();}
  function start(language){
    if(!Team.writable()||!['note','protocol','template'].includes(active()?.kind))return;
    const Engine=globalThis.SpeechRecognition||globalThis.webkitSpeechRecognition;if(!Engine)return;
    entryId=active().id;finals=new Set();pending='';recognition=new Engine();recognition.lang=language;recognition.continuous=true;recognition.interimResults=true;
    recognition.onresult=event=>{if(active()?.id!==entryId){stop();return;}pending='';for(let i=event.resultIndex;i<event.results.length;i++){const result=event.results[i];if(result.isFinal&&!finals.has(i)){finals.add(i);const text=result[0].transcript.trim();if(text)insertNotebookText(text+' ');}else if(!result.isFinal)pending+=result[0].transcript;}paint();};
    recognition.onerror=e=>{toast(({ 'not-allowed':'No se concedió acceso al micrófono.','audio-capture':'No hay un micrófono disponible.','network':'El servicio de dictado del navegador no está disponible.','no-speech':'No se detectó voz.'})[e.error]||'No se pudo completar el dictado.');};
    recognition.onend=()=>{recognition=null;pending='';paint();if(Team.enabled)Team.flush().catch(e=>toast(e.message));if(GitHubSync.connected())GitHubSync.flush().catch(e=>toast(e.message));};
    try{recognition.start();paint();}catch(e){recognition=null;paint();toast(e.message);}
  }
  function open(){
    if(listening()){stop();return;}
    if(!['note','protocol','template'].includes(active()?.kind)){toast('Abre una entrada de cuaderno para dictar.');return;}
    if(!Team.writable()){toast('Se necesita permiso de edición.');return;}
    const supported=Boolean(globalThis.SpeechRecognition||globalThis.webkitSpeechRecognition);
    show('Dictado del cuaderno',supported?'<p>El texto reconocido se insertará en la posición del cursor y se guardará como el resto de la entrada.</p>'+field('Idioma',select('language',[['es-ES','Español'],['en-US','English'],['ca-ES','Català']]))+'<p class="muted small">El navegador pedirá acceso al micrófono y puede procesar el audio mediante su servicio de reconocimiento. Pulsa Detener dictado para terminar.</p>':'<p>Este navegador no ofrece reconocimiento de voz para páginas web. Puedes usar el micrófono del teclado del dispositivo dentro del cuaderno.</p>',supported?data=>{dialog.close();start(data.get('language'));}:null,supported?'Iniciar dictado':'','Cuaderno');
  }
  addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
  return{open,stop,listening,paint};
})();

const GitHubMerge={
  combine(base,local,remote){
    const localChanges=Sync.diff(base,local),remoteChanges=Sync.diff(base,remote),conflicts=[];
    for(const [collection,rows]of Object.entries(localChanges)){const changed=new Map(remoteChanges[collection]||[]);for(const[id,value]of rows)if(changed.has(id)&&JSON.stringify(value)!==JSON.stringify(changed.get(id)))conflicts.push({collection,id,name:value?.name||changed.get(id)?.name||id});}
    return{workspace:Sync.apply(remote,localChanges),conflicts};
  }
};

  async function backup(){const saved=await cache.get('backup:'+key());if(!saved){toast('No hay un respaldo anterior para este repositorio.');return;}download('Mesa-respaldo-dispositivo.json',JSON.stringify(saved.workspace,null,2),'application/json');}
  async function disconnect(){clearTimeout(timer);clearInterval(polling);if(busy)await busy.catch(()=>{});token='';ready=false;config=null;base=null;sha=null;conflict=null;issue='';dialog.close();renderStatus();}

function download(name, data, type = 'text/plain') {
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type }));
  const link = document.createElement('a');
  link.href = url;
  link.download = name.replace(/[<>:"/\\|?*\x00-\x1f]/g, '_');
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

    (doc?.features.length ? '<label class="check-row"><input type="checkbox" name="drop"> Quitar las anotaciones que solapen una inserción o deleción</label>' : ''),
    async data => {
      const name = nameOf(data);

        await classifyNewSequence(created,data);commitDoc(created);

      }
      resetSequenceView();
      save();
      render();
    }, doc ? 'Guardar' : 'Crear', 'Biología molecular');
}

function updateCoordinates(doc, bases, drop) {
  const shift = bases.length - doc.bases.length;
  if (!shift || !doc.features.length) return doc.features;
  let commonLeft = 0;
  let commonRight = 0;
  const shorter = Math.min(bases.length, doc.bases.length);
  while (commonLeft < shorter && bases[commonLeft] === doc.bases[commonLeft]) commonLeft += 1;
  while (commonRight < shorter - commonLeft &&
      bases[bases.length - commonRight - 1] === doc.bases[doc.bases.length - commonRight - 1]) commonRight += 1;
  const oldEnd = doc.bases.length - commonRight;
  const result = [];
  for (const feature of doc.features) {
    if (feature.ranges.some(([a, b]) => b > commonLeft && a <= oldEnd)) {
      if (!drop) throw Error('La edición afecta a «' + feature.name + '». Revisa el cambio o marca la casilla para retirar las anotaciones afectadas.');
      continue;
    }
    if (feature.ranges.every(([, b]) => b <= commonLeft)) { result.push(feature); continue; }
    const ranges = feature.ranges.map(([a, b]) => a > oldEnd ? [a + shift, b + shift] : [a, b]);
    result.push({ ...feature, ranges, location: undefined });
  }
  return result;
}

function importDialog() {
  show('Importar secuencias', field('Archivo', '<input name="file" type="file" accept=".fa,.fas,.fasta,.fna,.faa,.gb,.gbk,.gbff,.genbank,.txt">') +
    field('O pega FASTA, GenBank o bases', area('raw', '', 'rows="7" class="mono" spellcheck="false"')) +
    '<div class="dialog-grid">' + field('Nombre para texto sin encabezado', input('name', '', '')) +
    field('Alfabeto para FASTA o texto', select('type', [['', 'Detectar'], ['DNA', 'ADN'], ['RNA', 'ARN'], ['AA', 'Proteína']])) + '</div>' +
    '<p class="muted small">Para evitar ambigüedad, selecciona el alfabeto si el FASTA es de proteína o ARN.</p>'+biopartFields(),
    async data => {
      const file = data.get('file');
      if (file.size > 6_000_000) throw Error('El tamaño máximo por archivo es de 6 MB.');
      const raw = file.size ? await file.text() : textOf(data, 'raw');
      const records = Lab.readSequences(raw, textOf(data, 'name') || file.name.replace(/\.[^.]+$/, ''), textOf(data, 'type'));
      if (records.length > 200) throw Error('Importa hasta 200 registros por operación.');
      const omitted = records.reduce((total, record) => total + record.omitted, 0);
      const docs = records.map(({ omitted: _, ...record }) => newDoc('sequence', record));
      for(const doc of docs)await classifyNewSequence(doc,data);
      db.docs.push(...docs);
      save();
      openDoc(docs[0].id);
      if (!storageIssue) toast(records.length + ' secuencia(s) importada(s).' + (omitted ? ' ' + omitted + ' anotación(es) con ubicaciones no compatibles se omitieron.' : ''));
    }, 'Importar', 'Biología molecular');
}

function featureDialog(index) {
  const doc = active();
  const feature = doc.features[index];
  const initial = (feature ? feature.ranges : selectedRegion().ranges).map(([a, b]) =>
    displayBase(doc, a) + '..' + displayBase(doc, b)).join(', ');
  show(feature ? 'Editar anotación' : 'Nueva anotación',
    field('Nombre', input('name', feature?.name)) +
    field('Intervalos (' + displayBase(doc, 1) + ' a ' + displayBase(doc, doc.bases.length) + ')', input('ranges', initial)) +
    '<p class="muted small">Separa los intervalos con comas. Por ejemplo, 15..42, 65..100.</p>' +
    '<div class="dialog-grid">' + field('Tipo de anotación', input('kind', feature?.kind || 'misc_feature', 'required maxlength="15"')) +
    field('Hebra', select('strand', [['1', 'Directa (+)'], ['-1', 'Inversa (−)']], String(feature?.strand || 1))) + '</div>' +
    field('Color', '<input type="color" name="color" value="' + colorOf(feature?.color || Lab.colors[doc.features.length % Lab.colors.length]) + '">') +
    field('Notas', area('notes', feature ? annotationNotes(feature) : '', 'rows="3" maxlength="10000"')) + (doc.type!=='AA'?translationFields(feature):'') + biopartFields(feature?.biopart) +
    (feature ? btn('Quitar anotación…', 'remove-feature', 'data-value="' + index + '"') : ''),
    async data => {
      const ranges = textOf(data, 'ranges').split(',').map(part => {
        const match = /^\s*(\d+)\s*(?:\.\.\s*(\d+)\s*)?$/.exec(part);
        if (!match) throw Error('Usa intervalos como 15..42 o una sola posición.');
        const offset = (doc.startIndex || 1) - 1;
        const a = Number(match[1]) - offset;
        const b = Number(match[2] || match[1]) - offset;
        if (a < 1 || a > b || b > doc.bases.length) throw Error('Revisa el orden y los límites de los intervalos.');
        return [a, b];
      });
      const kind = textOf(data, 'kind');
      if (!/^[A-Za-z0-9_'-]{1,15}$/.test(kind)) throw Error('Usa hasta 15 letras, números, apóstrofos, guiones o guiones bajos en el tipo.');
      const annotation = { name: nameOf(data), kind, ranges, strand: Number(data.get('strand')), color: colorOf(data.get('color')) };
      annotation.qualifiers = ['/label="' + annotation.name.replaceAll('"', '""').replace(/\s+/g, ' ') + '"',
        ...annotationQualifierBlocks(feature || {}).filter(block => !/^\/label=/i.test(block[0])).flat()];
      annotation.qualifiers = withAnnotationNotes(annotation, textOf(data, 'notes'));
      if(kind==='CDS'&&doc.type!=='AA')annotation.qualifiers=translationQualifiers(annotation,data);
      const biopart=await readBiopartForm(data,doc,annotation,feature?.biopart);if(biopart)annotation.biopart=biopart;
      remember(doc, 'Antes de modificar anotación');
      if (feature) doc.features[index] = annotation;
      else doc.features.push(annotation);
      doc.updated = Date.now();
      if (!['map', 'linear'].includes(ui.pane)) ui.pane = doc.topology === 'circular' ? 'map' : 'linear';
      Object.assign(ui, { annotationOpen: true, annotationTab: annotation.kind === 'CDS' ? 'translations' : 'annotations', enzymeOpen: false, primerOpen: false });
      save();
      renderEditor();
    }, 'Guardar', 'Anotaciones');
}

    }, 'Crear', 'Registros');
}

function selectSchema() {
  if (!db.schemas.length) { schemaDialog(); return; }
  show('Registrar entidad', choices(db.schemas.map(schema => [schema.name, 'register-schema', schema.id])), null, '', 'Registros');
}

function entityDialog(schema, doc = null) {
  show(doc ? 'Editar entidad' : 'Registrar ' + schema.name,
    field('Nombre', input('name', doc?.name)) + field('Identificador de registro', input('registryId', doc?.registryId || '', 'required maxlength="80"')) +
    schema.fields.map((item, i) => field(item.name, input('field' + i, doc?.values[i],
      'type="' + item.type + '"' + (item.type === 'number' ? ' step="any"' : '')))).join(''),
    data => {
      const name = nameOf(data);
      const registryId = textOf(data, 'registryId');
      if (!registryId || db.docs.some(item => item.kind === 'entity' && item !== doc && item.registryId.toLowerCase() === registryId.toLowerCase())) {
        throw Error('Introduce un identificador único.');
      }
      const values = schema.fields.map((_, i) => textOf(data, 'field' + i));
      const properties = { name, registryId, schema: schema.id, values };
      if (doc) {
        Object.assign(doc, properties, { updated: Date.now() });
        save();
        render();
      } else {
        Object.assign(ui, { module: 'registry', filter: '', query: '' });
        commitDoc(newDoc('entity', properties));
      }
    }, 'Guardar', 'Registros');
}

function manageDoc() {
  const actions = [['Renombrar o mover', 'move-doc'], ['Duplicar', 'duplicate-doc'], ['Mover a la papelera…', 'delete-doc']];
  if (['note', 'protocol', 'template'].includes(active().kind)) actions.splice(2, 0, ['Descargar texto', 'download-note']);
  show('Gestionar archivo', choices(actions));
}

function folderTrail(folder) {
  const names = [folder.name];
  let parent = folderOf(folder.parent);
  while (parent && names.length < 30) {
    names.unshift(parent.name);
    parent = folderOf(parent.parent);
  }
  return names.join(' / ');
}

function moveDoc() {
  const doc = active();
  const projectOptions = db.projects.map(project => [project.id + '|', project.name]);
  const folderOptions = db.folders.map(folder => [
    folder.project + '|' + folder.id, projectOf(folder.project).name + ' / ' + folderTrail(folder),
  ]);
  show('Renombrar o mover', field('Nombre', input('name', doc.name)) +
    field('Destino', select('destination', projectOptions.concat(doc.kind === 'template' ? [] : folderOptions), doc.project + '|' + doc.folder)),
    data => {
      const [project, folder] = textOf(data, 'destination').split('|');
      Object.assign(doc, { name: nameOf(data), project, folder, updated: Date.now() });
      save();
      render();
    });
}

function linkDoc() {
  const doc = active();
  const available = db.docs.filter(other => other !== doc && !doc.links?.includes(other.id));
  if (!available.length) { show('Vincular archivo', '<p>No hay archivos adicionales para vincular.</p>'); return; }
  show('Vincular archivo', field('Archivo', select('linked', available.map(other => [other.id, other.name + ' · ' + labelOf(other)]))), data => {
    doc.links = [...(doc.links || []), textOf(data, 'linked')];
    doc.updated = Date.now();
    save();
    renderEditor();
  }, 'Vincular', 'Cuaderno');
}

function closeTab(id) {
  ui.tabs = ui.tabs.filter(value => value !== id);
  if (ui.active === id) {
    ui.active = '';
    if (ui.tabs.length) { openDoc(ui.tabs.at(-1)); return; }
  }
  render();
}

function removeDoc() {
  const doc = active();
  show('Mover a la papelera', '<p>Se retirará «' + esc(doc.name) + '» del proyecto. Podrás recuperarlo desde la papelera.</p>',
    () => {
      db.docs = db.docs.filter(item => item !== doc);
      db.trash.push({ ...doc, deleted: Date.now() });
      save();
      closeTab(doc.id);
    }, 'Mover a la papelera');
}

function settings() {
  show('Ajustes y copias de seguridad',
    Theme.settings() + '<p class="callout">Tus cambios se guardan en el almacenamiento de este navegador. Usa una copia JSON para mover el espacio a otro navegador o conservarlo al cambiar de archivo.</p>' +
    choices([['Descargar copia JSON', 'backup'], ['Restaurar una copia JSON', 'restore']]) +
    '<h3 class="block-gap">Mesa Molecular</h3><p class="muted">Versión 6.5 · ' + (Team.enabled ? 'edición compartida' : 'edición local') +
    '. La copia incluye proyectos, adjuntos, inventario, historial y modelos. El proyecto de ejemplo contiene datos sintéticos.</p>' +
    '<p class="muted small">Atajos: Ctrl+K para buscar en el espacio. Ctrl+S para crear una versión del documento abierto.</p>');
}

function validateBackup(data) {
  const fail = () => { throw Error('La copia no tiene el formato de un espacio Mesa Molecular compatible.'); };
  const validId = id => typeof id === 'string' && /^[a-zA-Z0-9_-]{1,100}$/.test(id);
  const isString = value => typeof value === 'string';
  const textList = list => Array.isArray(list) && list.every(isString);
  const validList = list => Array.isArray(list) && list.every(item => item && validId(item.id) && isString(item.name)) &&
    new Set(list.map(item => item.id)).size === list.length;
  if (data?.version !== 1 || ![data.projects, data.folders, data.schemas, data.docs, data.trash ?? []].every(validList) || !data.projects.length) fail();
  const projects = new Set(data.projects.map(item => item.id));
  const allDocs = [...data.docs, ...(data.trash || [])];
  const documents = new Set(allDocs.map(item => item.id));
  if (documents.size !== allDocs.length) fail();
  const folders = new Map(data.folders.map(item => [item.id, item]));
  const schemas = new Map(data.schemas.map(item => [item.id, item]));
  for (const folder of data.folders) {
    if (!projects.has(folder.project) || (folder.parent !== '' && folders.get(folder.parent)?.project !== folder.project)) fail();
    const seen = new Set([folder.id]);
    for (let parent = folders.get(folder.parent); parent; parent = folders.get(parent.parent)) {
      if (seen.has(parent.id)) fail();
      seen.add(parent.id);
    }
  }
  for (const schema of data.schemas) {
    if (!Array.isArray(schema.fields) || !schema.fields.every(field => field && isString(field.name) &&
      ['text', 'number', 'date'].includes(field.type))) fail();
  }
  const validateDocument = (doc, checkVersion = true) => {
    if (!projects.has(doc.project) || (doc.folder !== '' && folders.get(doc.folder)?.project !== doc.project) ||
      !Object.hasOwn(kindNames, doc.kind)) fail();
    if (doc.kind === 'sequence') {
      if (!isString(doc.bases) || !isString(doc.description) || !['DNA', 'RNA', 'AA'].includes(doc.type) ||
        !['linear', 'circular'].includes(doc.topology) || Lab.basesOf(doc.bases, doc.type) !== doc.bases || !Array.isArray(doc.features)) fail();
      for (const f of doc.features) {
        if(f.biopart!==undefined){try{PartData.validate(f.biopart);}catch{fail();}}
        if (!f || !isString(f.name) || !isString(f.kind) || ![1, -1].includes(f.strand) ||
          !Array.isArray(f.ranges) || !f.ranges.length || !f.ranges.every(r => Array.isArray(r) && r.length === 2 &&
            r.every(Number.isInteger) && r[0] >= 1 && r[1] >= r[0] && r[1] <= doc.bases.length) ||
          (f.qualifiers !== undefined && !textList(f.qualifiers)) || (f.location !== undefined && !isString(f.location))) fail();
        if (f.primer !== undefined) {
          const p = f.primer;
          if (f.kind !== 'primer_bind' || doc.type !== 'DNA' || !p || !validId(p.id) || !validId(p.oligo) ||
            !['DNA', 'RNA'].includes(p.type) || !storedPrimerBases(p.bases, p.type) || !Number.isInteger(p.overhang) ||
            p.overhang < 0 || p.overhang > p.bases.length - 6) fail();
        }
      }
    } else if (doc.kind === 'alignment') {
      const result = doc.result;
      if (!textList(doc.names) || (doc.multi ? doc.names.length < 2 || doc.names.length > 10 : doc.names.length !== 2) ||
        !result || ![result.first, result.second, result.marks].every(isString) ||
        !Number.isFinite(result.identity) || !Number.isFinite(result.score) ||
        result.first.length !== result.second.length || result.first.length !== result.marks.length) fail();
    } else if (doc.kind === 'entity') {
      if (!isString(doc.registryId) || !textList(doc.values) || schemas.get(doc.schema)?.fields.length !== doc.values.length) fail();
    } else if (!isString(doc.content) || !textList(doc.links) || !doc.links.every(id => documents.has(id))) fail();
    validateDocumentExtensions(doc, data, documents, fail);
    if (checkVersion && doc.history !== undefined) {
      if (!Array.isArray(doc.history) || doc.history.length > 20) fail();
      for (const version of doc.history) {
        if (!version || !validDate(version.at) || !isString(version.label) || !version.data ||
            Object.keys(version.data).some(key => !versionKeys.has(key)) || version.data.kind !== doc.kind) fail();
        validateDocument({ ...version.data, id: doc.id, project: doc.project, folder: doc.folder }, false);
      }
    }
  };
  for (const doc of allDocs) validateDocument(doc);
  validateWorkspaceExtensions(data, projects, documents, validList, fail);
}

function restoreDialog() {
  show('Restaurar copia', field('Copia JSON', '<input type="file" name="backup" accept=".json" required>') +
    '<label class="check-row"><input type="checkbox" name="replace" required> Sustituir los proyectos y archivos de este espacio local</label>',
    async data => {
      const file = data.get('backup');
      if (file.size > 100_000_000) throw Error('El tamaño máximo de la copia es de 100 MB.');
      let imported;
      try { imported = JSON.parse(await file.text()); }
      catch { throw Error('El archivo no contiene JSON válido.'); }
      validateBackup(imported);
      db = Workspace.normalize(imported);
      Object.assign(ui, { module: 'projects', project: db.projects[0].id, folder: '', group: 'docs',
        tabs: [], active: '', filter: '', query: '', find: '' });
      resetSequenceView();
      save();
      render();
      if (!storageIssue) toast('Copia restaurada.');
    }, 'Restaurar');
}

function findNext() {
  const query = ui.find.replace(/\s/g, '').toUpperCase();
  if (!query) return;
  const doc = active();
  if (query.length > doc.bases.length) { toast('No se encontró ese motivo.'); return; }
  const search = doc.topology === 'circular' ? doc.bases + doc.bases.slice(0, query.length - 1) : doc.bases;
  const start = search.indexOf(query, ui.selection ? range()[0] : ui.caret ?? ((ui.scrollBase || 1) - 1));
  const index = start >= 0 && start < doc.bases.length ? start : search.indexOf(query);
  if (index < 0) { toast('No se encontró ese motivo.'); return; }
  selectRange(index + 1, Regions.modulo(index + query.length - 1, doc.bases.length) + 1);
}

const actions = {
  ...biopartActions,
  ...biochemicalActions,
  ...notebookGridActions,
  ...deviceActions,
  ...dictationActions,
  ...githubSyncActions,
  close: () => dialog.close(),
  module: value => {
    const same = ui.module === value;
    const shell = byId('shell');
    const collapse = same && !ui.dashboard && !shell.classList.contains('hide-side') && innerWidth > 500;
    Object.assign(ui, { module: value, dashboard: Object.hasOwn(moduleNames, value) && value !== 'home' ? value : '', query: '', filter: '' });
    byId('shell').classList.toggle('show-side', !same || !byId('shell').classList.contains('show-side'));
    shell.classList.toggle('hide-side', collapse);
    shell.classList.toggle('expanded-workspace', ['models', 'circuits'].includes(value));
    renderRail();
    renderSidebar();
    renderTabs();
    renderEditor();
  },
  group: value => {
    Object.assign(ui, { group: value, query: '', filter: '' });
    renderSidebar();
  },
  open: openDoc,
  'tab-close': closeTab,
  'folder-open': value => {
    Object.assign(ui, { folder: value, query: '', filter: '' });
    render();
  },
  'folder-back': () => {
    ui.folder = folderOf(ui.folder)?.parent || '';
    render();
  },
  'folder-rename': value => folderDialog(folderOf(value)),
  create: createMenu,
  'project-menu': () => show('Proyectos y plantillas', choices([
    ['Nuevo proyecto', 'new-project'], ['Renombrar proyecto', 'rename-project'], ['Nueva carpeta', 'new-folder'], ['Nueva plantilla', 'new-template'],
  ])),
  'registry-menu': () => show('Registros', choices([['Nuevo esquema', 'new-schema'], ['Gestionar esquemas', 'schema-list'],
    ['Registrar entidad', 'new-entity'], ['Exportar registros CSV', 'registry-export']])),
  'new-project': () => projectDialog(),
  'rename-project': () => projectDialog(projectOf(ui.project)),
  'new-folder': () => folderDialog(),
  'new-note': () => noteDialog('note'),
  'new-protocol': () => noteDialog('protocol'),
  'new-template': () => noteDialog('template'),
  'use-template': () => noteDialog('note', active()),
  'link-doc': linkDoc,
  'unlink-doc': value => {
    const doc = active();
    remember(doc, 'Antes de desvincular archivo');
    doc.links = doc.links.filter(id => id !== value);
    doc.updated = Date.now();
    save();
    renderEditor();
  },
  preview: () => { ui.preview = !ui.preview; renderEditor(); },
  'new-sequence': value => sequenceDialog(null, value),
  'edit-sequence': () => sequenceDialog(active()),
  import: importDialog,
  'export-sequence': exportDialog,
  'download-sequence': value => {
    const doc = active();
    download(doc.name + '.' + value, value === 'fasta' ? Lab.toFasta({ ...doc, bases: Regions.withCase(doc.bases, doc.lowercase) }) : Lab.toGenBank(doc));
    dialog.close();
  },
  goto: rangeDialog,
  feature: value => featureDialog(value === '' ? -1 : Number(value)),
  'remove-feature': value => show('Quitar anotación', '<p>Se retirará «' + esc(active().features[Number(value)].name) + '» de la secuencia.</p>',
    () => {
      remember(active(), 'Antes de quitar anotación');
      active().features.splice(Number(value), 1);
      active().updated = Date.now();
      save();
      renderEditor();
    }, 'Quitar'),
  'select-feature': (value, event) => active()?.features[Number(value)]?.primer ? pickPrimer(value, event) : selectAnnotation(value),
  pane: value => { if (value !== 'sequence') { ui.pane = value; renderMap(); } },
  split: () => { ui.split = !ui.split; renderEditor(); },
  'find-next': findNext,
  analysis: analysisMenu,
  'copy-range': () => sequenceOutput('Bases de la región', selectedBases(), active().name + '-region.txt'),
  reverse: () => sequenceOutput('Complementaria inversa', Lab.reverseComplement(selectedBases(), active().type), active().name + '-revcomp.txt'),
  translation: translationDialog,
  digest: digestDialog,
  crispr: crisprDialog,
  'download-crispr': () => {
    const doc = active();
    const rows = Lab.crispr(doc.bases, doc.topology === 'circular')
      .map(hit => [hit.guide, hit.pam, hit.strand > 0 ? '+' : '-', hit.start, hit.end].join('\t'));
    download(doc.name + '-SpCas9.tsv', ['espaciador\tPAM\thebra\tinicio\tfin', ...rows].join('\n'));
  },
  'download-output': value => download(value, byId('form').elements.output.value),
  align: alignmentDialog,
  'export-alignment': () => {
    const doc = active();
    const rows = doc.multi?.rows || [doc.result.first, doc.result.second];
    const records = rows.map((bases, i) => Lab.toFasta({ name: doc.names[i], bases }));
    if (doc.multi) records.push(Lab.toFasta({ name: 'Consenso', bases: doc.multi.consensus }));
    download(doc.name + '.fasta', records.join(''));
  },
  assembly: advancedAssembly,
  'new-schema': schemaDialog,
  'new-entity': selectSchema,
  'register-schema': value => entityDialog(schemaOf(value)),
  'edit-entity': () => entityDialog(schemaOf(active().schema), active()),
  'manage-doc': manageDoc,
  'move-doc': moveDoc,
  'duplicate-doc': () => {
    const copy = structuredClone(active());
    delete copy.history;
    if (copy.kind === 'entity') {
      entityDialog(schemaOf(copy.schema));
      return;
    }
    commitDoc(newDoc(copy.kind, { ...copy, id: uuid(), name: copy.name + ' · copia', updated: Date.now() }));
    dialog.close();
  },
  'delete-doc': removeDoc,
  'download-note': () => { download(active().name + '.txt', active().content); dialog.close(); },
  settings,
  backup: () => download('mesa-molecular-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(db, null, 2), 'application/json'),
  restore: restoreDialog,
};

let submitting = false;
document.addEventListener('click', event => {
  const target = event.target.closest('[data-action]');
  if (!target || submitting) return;
  runAction(target.dataset.action, target.dataset.value || '', event);
});
dialog.addEventListener('cancel', event => { if (submitting) event.preventDefault(); });
byId('form').addEventListener('submit', async event => {
  event.preventDefault();
  if (!onSubmit || submitting) return;
  submitting = true;
  const button = event.submitter;
  if (button) button.disabled = true;
  byId('form-error').textContent = '';
  try {
    if (await onSubmit(new FormData(event.currentTarget)) !== false) dialog.close();
  } catch (error) {
    byId('form-error').textContent = error.message || 'No se pudo completar la operación.';
  } finally {
    submitting = false;
    if (button) button.disabled = false;
  }
});

document.addEventListener('input', event => {
  const { id, value } = event.target;
  if (id === 'side-query' || id === 'expanded-query') { ui.query = value; renderItems(); }
  if (id === 'type-filter') { ui.filter = value; renderItems(); }
  if (id === 'project-filter') {
    Object.assign(ui, { project: value, folder: '', query: '', filter: '' });
    renderSidebar();
  }
  if (id === 'zoom') setSequenceZoom(Number(value));
  if (id === 'map-zoom') setMapZoom(Number(value));
  if (id === 'map-rotation') setMapRotation(Number(value));
  if (id === 'seq-find') { ui.find = value; renderBases(); }
  if (id === 'rich-entry') storeRichText(event.target);
  if (id === 'inventory-query') {
    ui.inventoryQuery = value;
    renderEditor();
    const query = byId('inventory-query');
    query.focus();
    query.setSelectionRange(value.length, value.length);
  }
  if (id === 'inventory-place') { ui.place = value; renderEditor(); }
  if (id === 'structure-x' || id === 'structure-y') drawStructure();
  if (id === 'note-content' || id === 'sequence-description') {
    const doc = active();
    doc[id === 'note-content' ? 'content' : 'description'] = value;
    doc.updated = Date.now();
    save();
  }
});
document.addEventListener('keydown', event => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k' && !dialog.open) {
    event.preventDefault();
    actions.module('search');
    byId('side-query')?.focus();
  }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's' && !dialog.open && active() && !ui.dashboard) {
    event.preventDefault();
    runAction('save-version', '');
  }
  if (event.key === 'Enter' && event.target.id === 'seq-find') {
    event.preventDefault();
    findNext();
  }
  if (Team.writable() && event.target.id === 'rich-entry' && event.key === '@' && !dialog.open) {
    event.preventDefault();
    mentionItem();
  }
});
document.addEventListener('focusin', event => {
  if (!['note-content', 'sequence-description'].includes(event.target.id)) return;
  const doc = active();
  if (Date.now() - (doc.history?.[0]?.at || 0) > 300000) remember(doc, 'Antes de editar texto');
});
Object.assign(actions, advancedActions, referenceActions, featureActions, sequenceActions, mapToolActions, mapExportActions,
  molecularSettingActions, digestActions, primerEditorActions, primerPanelActions, circuitActions, themeActions, annotationActions, annotationGridActions,
  { appearance: () => show('Apariencia', Theme.settings(), null, '', 'Mesa Molecular') }, Team.actions);
window.addEventListener('resize', () => { if (byId('bases')) renderBases(); });
Workspace.start();

</script>
