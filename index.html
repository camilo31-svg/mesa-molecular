<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="mesa-version" content="6.5">
  <meta name="description" content="Cuaderno local y editor de secuencias para tu laboratorio.">
  <meta name="mesa-github-owner" content="camilo31-svg"><meta name="mesa-github-repo" content="mesa-molecular-datos"><title>Mesa Molecular</title>
  <style>
:root {
  color-scheme: light;
  --navy: #14126a;
  --navy-deep: #100e58;
  --blue: #414fc5;
  --blue-dark: #3341ac;
  --ink: #202638;
  --muted: #616b7f;
  --line: #e0e4ed;
  --soft: #f5f6fa;
  --tint: #eef0fe;
  --mono: "Cascadia Mono", "Consolas", monospace;
  font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: white; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
button:focus-visible, a:focus-visible { outline: 2px solid #6674f7; outline-offset: 2px; }
input:focus, textarea:focus, select:focus { outline: 2px solid #8e98f2; outline-offset: 1px; }
[hidden] { display: none !important; }
button, input, textarea, select { min-width: 0; }
input, select, textarea {
  background: #fff; border: 1px solid #cdd3e2; padding: 7px 9px;
  border-radius: 5px; max-width: 100%;
}
textarea { resize: vertical; }
input[type=range] { padding: 0; accent-color: var(--blue); }
input[type=checkbox] { accent-color: var(--blue); }
button {
  border: 1px solid var(--line); background: #fff; border-radius: 5px;
  padding: 5px 10px; white-space: nowrap;
}
button:hover:not(:disabled) { background: var(--soft); }
.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.primary:hover:not(:disabled) { background: var(--blue-dark); }
.icon-button {
  display: inline-grid; place-items: center; padding: 0; width: 30px; height: 29px;
  flex: 0 0 auto; font-size: 17px;
}
.icon { width: 16px; height: 16px; vertical-align: middle; flex: 0 0 auto; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); }
.eyebrow {
  font-size: 10px; text-transform: uppercase; font-weight: 700; letter-spacing: .1em;
  color: var(--muted); margin: 0 0 5px;
}
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 6px; font-size: 27px; letter-spacing: -.025em; line-height: 1.18; }
h2 { font-size: 19px; line-height: 1.2; margin-bottom: 8px; }
h3 { font-size: 15px; margin-bottom: 7px; }
#shell { height: 100dvh; display: grid; grid-template-columns: 52px 296px minmax(0,1fr); }
#rail {
  min-height: 0; display: flex; flex-direction: column; align-items: stretch;
  background: var(--navy); color: #fff; overflow-y: auto;
}
.rail-button {
  color: inherit; height: 47px; flex-shrink: 0; border: 0; border-radius: 0;
  display: grid; place-items: center; background: transparent; position: relative; padding: 0;
}
.rail-button .icon { width: 18px; height: 18px; }
.rail-button.brand { height: 53px; color: #f3f4ff; background: var(--navy-deep); }
.rail-button.brand .icon { width: 22px; height: 22px; }
.rail-button:hover:not(:disabled), .rail-button.active { background: #302d95; }
.rail-button.active::before { content: ""; position: absolute; left: 0; height: 100%; width: 3px; background: #aab1ff; }
.rail-spacer { flex: 1; }
.avatar { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 50%; background: #5453ae; font-size: 10px; font-weight: 700; }
#sidebar {
  min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line);
  box-shadow: 2px 0 8px #1720400a; z-index: 1;
}
#side-title { padding: 15px 13px 0; }
.side-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 14px; }
.side-heading h2 { margin: 0; font-size: 17px; overflow: hidden; text-overflow: ellipsis; }
.side-heading .icon-button { color: var(--blue); border-color: #b7bdf0; }
.side-actions { display: flex; align-items: center; gap: 6px; }
.side-tabs { display: flex; gap: 15px; border-bottom: 1px solid var(--line); margin: 0 -13px; padding: 0 13px; }
.side-tabs button, .view-tabs button {
  border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted);
  background: transparent; padding: 9px 0 8px; font-size: 10px; font-weight: 700;
  letter-spacing: .035em; text-transform: uppercase;
}
.side-tabs button[aria-selected=true], .view-tabs button[aria-selected=true] { color: var(--blue); border-color: #727dea; }
#side-content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.filters { padding: 12px 13px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 7px; }
.filters input { width: 100%; }
.filters select { font-size: 12px; padding: 3px 7px; background: var(--soft); border-color: var(--line); }
.item-list { overflow: auto; min-height: 0; padding: 7px 6px; }
.side-caption { margin: 11px 8px 3px; }
.list-item {
  width: 100%; display: flex; align-items: center; text-align: left; gap: 8px; border: 0;
  background: transparent; min-height: 33px; padding: 6px 8px; color: #3c4356;
}
.list-item[aria-current=true] { background: var(--tint); color: var(--blue-dark); }
.list-item .icon { color: var(--blue); }
.list-item .item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.folder-row { display: flex; align-items: center; }
.folder-row > .icon-button { border: 0; background: transparent; }
.empty-side { margin: 12px 8px; color: var(--muted); font-size: 12px; }
#side-foot { border-top: 1px solid var(--line); padding: 10px 11px; color: var(--muted); font-size: 10px; }
.local-dot { display: inline-block; width: 7px; height: 7px; background: #3a9878; border-radius: 50%; margin-right: 4px; }
#workspace { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
#tabstrip {
  display: flex; align-items: end; overflow-x: auto; gap: 3px; flex: 0 0 auto;
  min-height: 42px; padding: 5px 6px 0; background: var(--soft); border-bottom: 1px solid var(--line);
}
.work-tab { display: flex; align-items: center; border: 1px solid transparent; border-bottom: 0; border-radius: 5px 5px 0 0; }
.work-tab.active { border-color: var(--line); background: white; color: var(--blue-dark); }
.work-tab button { background: transparent; border: 0; border-radius: 0; }
.work-tab button:first-child { display: flex; align-items: center; gap: 6px; max-width: 218px; }
.work-tab button span { overflow: hidden; text-overflow: ellipsis; }
.work-tab button:last-child { padding: 5px 7px; color: var(--muted); }
#editor { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#statusbar {
  flex: 0 0 auto; padding: 4px 11px; border-top: 1px solid var(--line); background: var(--soft);
  display: flex; justify-content: space-between; gap: 12px; color: #4a5468; font-size: 10px;
}
.editor-heading {
  display: flex; align-items: center; justify-content: space-between; padding: 12px 17px;
  border-bottom: 1px solid var(--line); gap: 9px; flex: 0 0 auto;
}
.editor-heading h1 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
.editor-heading p { margin: 0 0 2px; }
.toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.editor-heading .toolbar { justify-content: flex-end; }
.editor-heading button, .pane-tools button { font-size: 12px; }
.sequence-layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.02fr); }
.sequence-layout.single { grid-template-columns: minmax(0,1fr); }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.pane + .pane { border-left: 1px solid var(--line); }
.view-tabs { display: flex; align-items: stretch; gap: 13px; padding: 0 12px; overflow-x: auto; min-height: 36px; border-bottom: 1px solid var(--line); }
.pane-tools { padding: 6px 9px; border-bottom: 1px solid var(--line); background: #fcfcfe; }
.pane-tools input[type=search] { flex: 1; width: 110px; min-width: 75px; padding: 4px 7px; }
.pane-tools input[type=range] { width: 58px; }
.pane-body { overflow: auto; min-height: 0; flex: 1; }
.sequence-scroller { padding: 15px 10px; font-family: var(--mono); }
.sequence-row { margin-bottom: 17px; min-width: max-content; }
.base-line, .sequence-track { display: flex; align-items: center; }
.base-line { height: 20px; }
.base { flex-shrink: 0; display: inline-grid; place-items: center; width: 1ch; height: 19px; color: #292c3a; }
button.base { border: 0; padding: 0; border-radius: 0; font: inherit; background: transparent; }
button.base:hover:not(:disabled) { background: #e6e8f2; }
.base.match { background: #fff1a6; }
button.base.selected, button.base.selected:hover:not(:disabled) { background: #565dc5; color: white; }
.complement { color: #526174; }
.sequence-ticks { display: flex; border-top: 1px solid #a7afbc; width: max-content; margin-top: 1px; height: 17px; }
.tick { display: inline-block; height: 5px; color: #667085; width: 1ch; font-size: inherit; position: relative; }
.tick span { font: 9px var(--mono); position: absolute; top: 4px; right: 0; }
.tick.mark { border-right: 1px solid #a7afbc; }
.sequence-track { gap: 3px; margin-bottom: 5px; min-height: 14px; font: 10px "Segoe UI", sans-serif; }
.mini-label { padding: 1px 5px; border-radius: 3px; font-size: 10px; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
.map-body { display: grid; place-items: center; min-height: 325px; padding: 15px; }
.plasmid { width: min(100%, 600px); height: auto; max-height: 590px; }
.plasmid text { font-family: "Segoe UI", sans-serif; }
.plasmid .map-feature { cursor: pointer; }
.plasmid .map-feature:hover { filter: brightness(.87); }
.map-caption { text-align: center; padding: 0 16px 14px; color: var(--muted); font-size: 12px; }
.info-pane, .document { padding: 23px clamp(15px, 4vw, 45px); }
.document { overflow: auto; min-height: 0; flex: 1; }
.document > * { max-width: 980px; margin-left: auto; margin-right: auto; }
.document-text { min-height: 280px; font-size: 14px; line-height: 1.65; width: 100%; }
.document-preview { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; min-height: 120px; line-height: 1.65; }
.placeholder { display: grid; place-items: center; min-height: 100%; padding: 24px; }
.welcome { width: min(720px,100%); }
.welcome-mark {
  display: grid; place-items: center; width: 52px; height: 52px; border-radius: 12px;
  background: var(--tint); color: var(--blue); margin-bottom: 15px;
}
.welcome-mark .icon { width: 26px; height: 26px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit,minmax(185px,1fr)); gap: 9px; margin-top: 22px; }
.cards button { text-align: left; white-space: normal; min-height: 90px; padding: 12px; }
.cards button b { display: block; margin: 5px 0; }
.map-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 0 13px 10px; }
.map-legend button { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; }
.swatch { width: 9px; height: 9px; display: inline-block; border-radius: 2px; }
.table-wrap { overflow: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th { text-align: left; font-weight: 600; background: var(--soft); }
td, th { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td .icon-button { height: 23px; width: 24px; font-size: 13px; }
.callout { padding: 10px 13px; border: 1px solid #dfe3fa; background: #f4f5ff; border-radius: 5px; color: #424976; }
.readout { padding: 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--soft); overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.alignment { white-space: pre; overflow-wrap: normal; font: 12px/1.4 var(--mono); }
.block-gap { margin-top: 15px; }
.field, .dialog-grid { display: grid; gap: 5px; }
.field { margin-bottom: 11px; }
.field > span { font-weight: 600; }
.dialog-grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 0 12px; }
.choice-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 7px; }
.choice-grid button { text-align: left; padding: 8px; white-space: normal; }
.check-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; margin: 8px 0; }
.check-row label { display: inline-flex; align-items: center; gap: 4px; }
.items-check { max-height: 240px; overflow: auto; display: grid; gap: 4px; padding: 5px; }
.items-check label { overflow-wrap: anywhere; }
dialog { width: min(610px,calc(100vw - 24px)); padding: 0; border: 1px solid #d4d9e8; border-radius: 9px; color: var(--ink); box-shadow: 0 14px 65px #171b5150; }
dialog::backdrop { background: #17173369; }
.dialog-header, .dialog-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 13px 17px; }
.dialog-header { border-bottom: 1px solid var(--line); }
.dialog-header h2 { margin: 0; }
.dialog-footer { justify-content: flex-end; border-top: 1px solid var(--line); background: #fafaff; }
#dialog-body { padding: 15px 17px; max-height: min(64vh,640px); overflow: auto; }
#dialog-body > :last-child { margin-bottom: 0; }
#form-error { color: #9d2934; padding: 0 17px; margin: 0 0 6px; }
#form-error:empty { display: none; }
#toast {
  position: fixed; right: 18px; bottom: 38px; z-index: 4; max-width: min(450px,calc(100% - 30px));
  padding: 10px 14px; background: #252755; color: white; border-radius: 6px; box-shadow: 0 6px 20px #151a4842;
}
@media (max-width: 1030px) { #shell { grid-template-columns: 46px 235px minmax(0,1fr); } .view-tabs { gap: 8px; } }
@media (max-width: 760px) {
  #shell { grid-template-columns: 42px 155px minmax(0,1fr); }
  #side-title { padding-inline: 8px; }
  .side-tabs { margin-inline: -8px; padding-inline: 8px; gap: 6px; }
  .side-tabs button { font-size: 9px; }
  .sequence-layout:not(.single) { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(160px,1fr) minmax(160px,1fr); }
  .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
  .editor-heading { padding: 7px; }
  .editor-heading .toolbar { gap: 3px; }
  .editor-heading .toolbar button { padding-inline: 5px; }
}
@media (max-width: 500px) {
  #shell { grid-template-columns: 40px minmax(0,1fr); }
  #sidebar { display: none; }
  #shell.show-side #sidebar { display: flex; position: fixed; z-index: 2; inset: 0 auto 0 40px; width: min(230px,calc(100% - 40px)); background: white; box-shadow: 5px 0 20px #14124d34; }
  .dialog-grid { grid-template-columns: minmax(0,1fr); }
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
.molecular-editor { display: flex; flex: 1; min-height: 0; }
.molecular-editor .sequence-layout { min-width: 0; }
.molecular-rail {
  flex: 0 0 37px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding-top: 7px;
  overflow: auto;
  border-left: 1px solid var(--line);
  background: #fbfcff;
}
.molecular-rail .icon-button { border-color: transparent; color: #566075; }
.molecular-rail .icon-button.active { background: var(--tint); color: var(--blue-dark); }
.save-state { white-space: nowrap; }
.section-heading { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.section-heading h2, .section-heading h3 { flex: 1; margin: 0; }
.section-heading > div { flex: 1; }
.section-heading > div h2 { margin-top: 8px; }
.rich-tools { padding: 7px; background: var(--soft); border: 1px solid var(--line); border-bottom: 0; border-radius: 7px 7px 0 0; }
.rich-tools button { min-height: 26px; padding: 3px 8px; }
.rich-tools + .field { margin-bottom: 3px; }
.rich-tools + .field textarea { border-radius: 0 0 7px 7px; }
.note-paper {
  overflow-wrap: anywhere; min-height: 160px; padding: 16px 20px; margin-bottom: 15px;
  border: 1px solid var(--line); border-radius: 7px; line-height: 1.6; font-size: 14px;
}
.note-paper p { margin-bottom: 4px; }
.note-paper h2, .note-paper h3, .note-paper h4 { margin: 12px 0 6px; }
.note-paper > :first-child { margin-top: 0; }
.note-paper ul, .note-paper ol { margin: 4px 0; padding-left: 22px; }
.note-paper code { padding: 2px 4px; border-radius: 3px; background: var(--soft); }
.note-paper blockquote { margin: 4px 0; padding-left: 10px; border-left: 3px solid #c8cdf9; color: #4f587a; }
.note-gap { height: 10px; }
.check-indicator { color: var(--blue-dark); }
.notebook-table, .notebook-insert { margin-top: 16px; }
.notebook-table .table-wrap { border: 1px solid var(--line); border-radius: 6px; }
.notebook-table td, .notebook-table th { min-width: 78px; max-width: 270px; overflow-wrap: anywhere; }
.notebook-table td { white-space: pre-wrap; }
.asset-row {
  display: flex; align-items: center; gap: 8px; padding: 9px; margin: 0 0 6px;
  border: 1px solid var(--line); border-radius: 6px; background: #fff;
}
.asset-title { min-width: 0; flex: 1; }
.asset-title b { display: block; overflow-wrap: anywhere; }
.asset-title small { color: var(--muted); }
.asset-glyph { color: var(--blue); }
.as-button { color: var(--blue-dark); text-decoration: none; border: 1px solid var(--line); padding: 5px 9px; border-radius: 5px; }
.as-button:hover { background: var(--soft); }
.attachment-image { display: block; max-width: 100%; max-height: 400px; margin: 0 auto 14px; }
.module-page { min-height: 0; overflow: auto; flex: 1; background: #f7f8fc; }
.module-heading {
  display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: space-between;
  padding: clamp(18px, 4vw, 35px) clamp(15px, 4vw, 38px) 22px;
  background: #fff; border-bottom: 1px solid var(--line);
}
.module-heading p:last-child { margin-bottom: 0; }
.module-content { max-width: 1240px; padding: 22px clamp(14px, 4vw, 38px) 30px; margin: 0 auto; }
.module-content .callout { margin-top: 16px; }
.module-content .callout p { margin: 6px 0; }
.module-content .callout code { overflow-wrap: anywhere; }
.metrics { display: grid; gap: 9px; grid-template-columns: repeat(auto-fit, minmax(min(132px,100%), 1fr)); margin-bottom: 14px; }
.metric { display: flex; align-items: center; gap: 10px; min-height: 70px; border: 1px solid var(--line); border-radius: 7px; background: #fff; padding: 11px; }
.metric > span { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 7px; color: var(--blue); background: var(--tint); }
.metric strong { display: block; font-size: 19px; line-height: 1.08; }
.metric small { color: var(--muted); }
.module-empty { padding: 22px; border: 1px dashed #cbd3e8; border-radius: 8px; background: #fff; }
.module-empty .welcome-mark { width: 39px; height: 39px; margin-bottom: 10px; }
.module-empty .welcome-mark .icon { width: 20px; height: 20px; }
.module-empty p { margin-bottom: 0; }
.module-table { border: 1px solid var(--line); border-radius: 7px; background: #fff; }
.module-table tbody tr:last-child td { border-bottom: 0; }
.module-table tbody tr:hover { background: #fafbff; }
.module-table td { overflow-wrap: anywhere; }
.dashboard-tools { margin: 13px 0 9px; }
.dashboard-tools input { flex: 1 1 170px; }
.dashboard-tools select { max-width: min(100%, 205px); }
.status-pill { display: inline-block; padding: 3px 7px; border-radius: 9px; color: #44469c; background: #ecedfe; white-space: nowrap; font-size: 11px; }
.plain-fieldset, .assembly-slot { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 12px; min-width: 0; }
.plain-fieldset legend, .assembly-slot legend { font-weight: 650; color: #4a5470; }
.assembly-slot .field { margin-bottom: 6px; }
#structure-frame, #trace-frame { border: 1px solid var(--line); border-radius: 7px; margin: 10px 0; background: #f8f9fd; overflow: hidden; }
#structure-frame svg, #trace-frame svg { display: block; width: 100%; height: auto; }
.structure-controls label { display: inline-flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.structure-controls input { width: 75px; }
.trace-controls { justify-content: space-between; }
.home-cards { margin-top: 10px; }
@media (max-width: 760px) {
  .molecular-rail { flex-basis: 31px; }
  .molecular-rail .icon-button { width: 26px; }
  .asset-row { flex-wrap: wrap; }
}
@media (min-width: 501px) {
  #shell.hide-side { grid-template-columns: 52px 0 minmax(0,1fr); }
  #shell.hide-side #sidebar { visibility: hidden; overflow: hidden; }
}
@media print {
  #rail, #sidebar, #tabstrip, #statusbar, .toolbar, .molecular-rail, .view-tabs { display: none !important; }
  #shell { display: block; height: auto; }
  .module-page, .document, .pane-body { overflow: visible; }
  .editor-heading, .module-heading { padding: 0 0 12px; }
  .document { display: block; padding: 10px 0; }
  .note-paper { border: 0; padding: 0; }
}

:root {
  --navy: #090caf;
  --navy-deep: #060985;
  --blue: #3d5ddc;
  --blue-dark: #1015ac;
  --ink: #262629;
  --muted: #626268;
  --line: #dedee1;
  --soft: #f5f5f7;
  --tint: #eeeeff;
  font: 13px/1.38 "Segoe UI", Arial, sans-serif;
}
#shell { grid-template-columns: 54px 320px minmax(0,1fr); }
#rail { grid-column: 1; }
#sidebar { grid-column: 2; }
#workspace { grid-column: 3; }
#shell.expanded-workspace { grid-template-columns: 54px 0 minmax(0,1fr); }
#shell.expanded-workspace #sidebar, #shell.expanded-workspace #tabstrip, #shell.expanded-workspace #statusbar { display: none; }
.rail-button, .rail-button.brand { height: 54px; }

.flyout { position: fixed; z-index: 5; width: 228px; max-height: calc(100dvh - 12px); overflow: auto; border: 1px solid #dedee2; border-radius: 5px; box-shadow: 0 3px 8px #0004; background: #fff; }
.flyout-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 31px; padding: 6px 12px; border: 0; border-radius: 0; text-align: left; white-space: normal; }
.flyout-item span { flex: 1; }
.flyout-global .flyout-item { min-height: 43px; border-bottom: 1px solid #eeeef0; }
.flyout-item:focus { outline-offset: -2px; background: #f3f3ff; }
.flyout-search { background: #e4e5fa; padding: 9px 12px; }
.flyout-search input { width: 100%; height: 28px; }
dialog { margin: 30px auto auto; border-radius: 15px; width: min(580px,calc(100vw - 24px)); }
dialog::backdrop { background: #0005; }
.dialog-header, .dialog-footer { background: #fff; }
.dialog-header h2 { font-size: 15px; }
#dialog-kicker:empty { display: none; }
.dialog-header .icon-button { border: 0; color: #8c8c96; }
.dialog-footer .primary { background: #090caf; border-color: #090caf; padding: 8px 14px; }
.entry-create-grid { grid-template-columns: minmax(0,3fr) minmax(0,2fr); }
.notebook-layout { display: flex; flex: 1; min-height: 0; }
.notebook-page { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.notebook-toolrow { display: flex; justify-content: space-between; gap: 5px; border-bottom: 1px solid var(--line); padding: 4px 9px; }
.notebook-tools { gap: 3px; }
.notebook-tools button, .notebook-actions button { border: 0; padding: 3px 7px; }
.notebook-scroll { flex: 1; min-height: 0; overflow: auto; background: #f7f7f9; padding: 18px; }
.notebook-sheet { max-width: 960px; min-height: calc(100% - 10px); padding: 25px clamp(15px,5vw,57px); margin: 0 auto; border: 1px solid #e7e7e9; border-radius: 4px; background: white; }
.note-location { font-size: 12px; color: #5d5d64; margin-bottom: 9px; }
.notebook-sheet h1 { font-size: 29px; margin-bottom: 19px; }
#rich-entry { min-height: 180px; padding: 3px 0; font-size: 14px; line-height: 1.58; outline: none; overflow-wrap: anywhere; }
#rich-entry:empty::before { content: attr(data-placeholder); color: #8a8a91; pointer-events: none; }
#rich-entry p, #rich-entry div { margin: 0 0 4px; }
#rich-entry h2, #rich-entry h3, #rich-entry h4 { margin: 13px 0 5px; }
.mention-chip { background: #edf0ff; color: #253fb0; padding: 0 4px; border: 0; border-radius: 3px; }
.notebook-outline { display: grid; gap: 4px; justify-items: start; margin: 15px 0; color: #5d5d66; }
.notebook-split { width: min(42%,400px); padding: 12px; overflow: auto; border-left: 1px solid var(--line); }
.calendar-grid { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
.calendar-grid.day { grid-template-columns: 1fr; }
.calendar-cell { min-height: 75px; padding: 5px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
.calendar-cell.off-month { background: #f5f5f7; color: #696971; }
.calendar-item { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; color: var(--blue-dark); background: var(--tint); border: 0; padding: 3px; margin-top: 4px; }
.model-tabs { margin-bottom: 16px; }
.model-catalog { display: grid; grid-template-columns: repeat(auto-fit,minmax(235px,350px)); gap: 10px; }
.model-card { padding: 15px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
@media (max-width: 1050px) {
  #shell { grid-template-columns: 48px 256px minmax(0,1fr); }
  .rail-button, .rail-button.brand { height: 48px; }
}
@media (max-width: 760px) {
  #shell { grid-template-columns: 42px 172px minmax(0,1fr); }
  .rail-button, .rail-button.brand { height: 42px; }
  .molecular-editor .sequence-layout:not(.single) { grid-template-columns: minmax(0,1fr); }
  #sequence-divider { display: none; }
  .molecular-rail { flex-basis: 30px; gap: 5px; }
  .browser-heading { flex-wrap: wrap; }
  .view-tabs { gap: 10px; }
}
@media (max-width: 500px) {
  #shell { grid-template-columns: 40px minmax(0,1fr); }
  #shell.expanded-workspace { grid-template-columns: 40px minmax(0,1fr); }
  #workspace { grid-column: 2; }
  .notebook-scroll { padding: 7px; }
  .workspace-stat { white-space: nowrap; }
}
@media print {
  .notebook-toolrow, .notebook-split { display: none; }
  .notebook-scroll { overflow: visible; background: white; padding: 0; }
  .notebook-sheet { border: 0; padding: 0; }
}

:root {
  --surface: #fff; --surface-alt: #f5f6fa; --surface-raised: #fff; --canvas: #f7f9fc;
  --line-strong: #b9c2d1; --action: #3f5be1; --on-action: #fff;
  --map-text: #252525; --selection: #454f71; --feature-ink: #252a32;
  --selection-handle: #1b1b1d;
  --nt-a: #8a7a08; --nt-c: #2869b3; --nt-g: #ba6529; --nt-t: #29876b;
  --gel-background: #fff; --gel-bed: #ededed; --gel-ink: #202020; --gel-band: #202020; --gel-ladder: #636363; --gel-selected: #b8750f; --gel-guide: #aaa; --gel-highlight: #b8750f;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --surface: #171e2a; --surface-alt: #111722; --surface-raised: #202938; --canvas: #131b28;
  --ink: #e5ebf5; --muted: #a1aec2; --line: #323d50; --line-strong: #53627c;
  --navy: #0b1040; --navy-deep: #192252; --blue: #9ab0ff; --blue-dark: #bac7ff;
  --soft: #222c3d; --tint: #293657; --action: #5269dc; --on-action: #fff;
  --map-text: #dce5f1; --selection: #404e72;
  --selection-handle: #e4ebfa;
  --nt-a: #ddca65; --nt-c: #84b7f4; --nt-g: #eda16a; --nt-t: #71d0ab;
  --gel-background: #111722; --gel-bed: #080d15; --gel-ink: #fff; --gel-band: #fff; --gel-ladder: #fff; --gel-selected: #fff; --gel-guide: #8894a7; --gel-highlight: #e6bf69;
}
body { background: var(--surface); }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) var(--surface); }
::-webkit-scrollbar { width: 9px; height: 8px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { border: 2px solid var(--surface); background: var(--line-strong); border-radius: 7px; }
.view-tabs > button { flex: 0 0 auto; }
.base, .tick, .codon-strip > span { width: var(--base-width,1ch); flex: 0 0 var(--base-width,1ch); }
.feature-strips { position: relative; padding: 0; }
.feature-strip { position: absolute; margin: 0; min-width: var(--base-width,1ch); background: transparent; padding: 0; }
.feature-shape { position: absolute; inset: 0; width: 100%; height: 13px; overflow: visible; pointer-events: none; }
.feature-content { position: absolute; left: 0; top: 0; width: 100%; display: block; height: 13px; line-height: 13px; padding: 0 6px 0 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; z-index: 1; }
.feature-strip,.primer-map-track { isolation: isolate; }
.feature-shape { z-index: 0; }
.feature-amino,.primer-map-label,.primer-map-bases,.primer-map-tail { z-index: 1; }
.reverse .feature-content { padding: 0 2px 0 6px; }
.aligned-letters .feature-content { padding: 0; }
.feature-strip.translated-track { height: 29px; }
.translated-track .feature-shape { top: 15px; }
.translated-track .feature-content { top: 15px; padding: 0 7px 0 2px; }
.translated-track.reverse .feature-content { padding: 0 2px 0 7px; }
.feature-amino { position: absolute; top: 0; left: 0; height: 13px; font: 10px/13px Consolas,monospace; }
.feature-strip:hover:not(:disabled) { background: transparent; filter: brightness(.94); }
.feature-strip:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.orf-sequence-track .feature-content { color: var(--track-color); font-size: 9px; text-align: center; opacity: 0; }
.orf-sequence-track:hover .feature-content, .orf-sequence-track:focus-visible .feature-content { opacity: 1; background: var(--surface); }
.primer-sequence-tracks { position: relative; }
.primer-map-track { position: absolute; display: block; padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--ink); text-align: left; min-width: 0; }
.primer-map-track .feature-shape { top: 1px; }
.primer-map-track:hover:not(:disabled) { background: transparent; }
.primer-map-label { position: absolute; left: 4px; right: 6px; top: 0; font: 9px/14px Arial,sans-serif; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.primer-map-bases { position: absolute; top: 14px; left: 0; display: flex; font: inherit; line-height: 19px; }
.primer-map-bases>span { display: inline-block; width: var(--base-width); flex: 0 0 var(--base-width); text-align: center; }
.primer-map-mismatch { background: #f9b4b4; color: #8e1726; border-bottom: 2px solid #bf293e; }
.primer-map-tail { position: absolute; top: 0; max-width: 80%; font: 9px/13px Arial,sans-serif; padding: 0 2px; color: var(--muted); background: var(--soft); border-bottom: 1px dashed var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.primer-map-tail.tail-left { right: 0; }
.primer-map-tail.tail-right { left: 0; }
html[data-theme="dark"] .primer-map-track { background: transparent; }
.feature-strip.aligned-letters { padding: 0; }
.base-line { height: var(--base-line-height,19px); line-height: var(--base-line-height,19px); }
.cut-track .sequence-cut { overflow: hidden; text-overflow: ellipsis; }
.primer-map-bases { font-family: var(--mono); font-size: var(--sequence-font-size); line-height: var(--base-line-height); }
.primer-map-tail { top: var(--primer-tail-top); }
.annotation-overflow { position: absolute; left: 0; padding: 0 3px; height: 15px; font-size: 10px; border: 0; color: var(--blue); background: var(--tint); }
.virtual-gel-svg .gel-background { fill: var(--gel-background); }
.virtual-gel-svg .gel-bed { fill: var(--gel-bed); }
.virtual-gel-svg text { fill: var(--gel-ink); }
.virtual-gel-svg .gel-sample-band { stroke: var(--gel-band); }
.virtual-gel-svg .gel-ladder-band { stroke: var(--gel-ladder); }
.virtual-gel-svg .gel-selected-band { stroke: var(--gel-selected); }
.virtual-gel-svg .gel-guide { stroke: var(--gel-guide); }
.virtual-gel-svg .gel-band-outline { stroke: var(--gel-highlight); }
.virtual-gel-svg .gel-band:hover line, .virtual-gel-svg .gel-band:focus-visible line { stroke: var(--gel-selected); }
a { color: var(--blue); }
.appearance-settings { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 18px; }
.theme-choices { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; margin: 12px 0; }
.theme-choice { display: grid; gap: 9px; padding: 7px 7px 10px; text-align: left; }
.theme-choice > span:last-child { display: flex; align-items: center; gap: 5px; padding: 0 3px; }
.theme-choice[aria-pressed="true"] { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
.theme-preview { position: relative; display: flex; gap: 5px; align-items: flex-start; height: 60px; padding: 9px 7px 7px 22px; border: 1px solid #d1d7e2; border-radius: 4px; background: #f8f9fc; overflow: hidden; }
.theme-preview::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 14px; background: #161b70; }
.theme-preview i { height: 28px; width: 23%; border: 1px solid #d4dbe8; background: white; border-radius: 3px; }
.theme-preview i:last-child { width: 46%; }
.theme-preview-dark { background: #111722; border-color: #354258; }
.theme-preview-dark i { border-color: #3b4963; background: #26334b; }
.theme-preview-system { background: linear-gradient(115deg,#f8f9fc 50%,#111722 50%); }
.theme-preview-system i:last-child { background: #26334b; border-color: #3b4963; }
.flyout-radio::before { content: ""; width: 11px; height: 11px; border: 1px solid var(--line-strong); border-radius: 50%; }
.flyout-radio[aria-checked="true"]::before { border: 3px solid var(--blue); }
.map-fit-button { min-width: 36px; font-variant-numeric: tabular-nums; }
.reference-plasmid .plasmid-base { font-family: var(--mono); }
.reference-plasmid .nt-A { fill: var(--nt-a); }
.reference-plasmid .nt-C { fill: var(--nt-c); }
.reference-plasmid .nt-G { fill: var(--nt-g); }
.reference-plasmid .nt-T, .reference-plasmid .nt-U { fill: var(--nt-t); }
.map-body .reference-plasmid { overflow: hidden; }
html[data-theme="dark"] :is(#sidebar,#workspace,#editor,dialog,.work-tab.active,.molecular-rail,.info-pane,.enzyme-inspector,.primer-inspector,.expanded-browser,.module-heading,.metric,.module-empty,.module-table,.model-card,.asset-row,.notebook-sheet,.circuit-card,.circuit-palette,.circuit-inspector,.circuit-design-grid,.dialog-header,.dialog-footer,.reference-toolbar,.pane-tools,.sequence-pages,.flyout) { background: var(--surface); }
html[data-theme="dark"] :is(button,input,textarea,select) { background-color: var(--surface); border-color: var(--line); color: var(--ink); }
html[data-theme="dark"] :is(input,textarea,select)::placeholder { color: #8d9bb0; }
html[data-theme="dark"] :is(button:hover:not(:disabled),.flyout-item:focus,.module-table tbody tr:hover) { background: var(--soft); }

html[data-theme="dark"] .rail-button.brand { background: #070b30; }
html[data-theme="dark"] :is(.work-tab.active,.notebook-sheet,.circuit-card,.circuit-design-grid,.circuit-projects button,.circuit-palette,.circuit-inspector,.circuit-tabs,.circuit-inspector hr,.search-box,.module-empty) { border-color: var(--line); }
html[data-theme="dark"] :is(.work-tab,.work-tab button,.list-item,.path-label,.note-location,.notebook-outline,.plain-fieldset legend,.assembly-slot legend,.molecular-rail .icon-button,.base,.complement) { color: var(--ink); }
html[data-theme="dark"] :is(.list-item[aria-current="true"],.molecular-rail .active,.primer-attachment.chosen,.enzyme-results [aria-pressed="true"],.mention-chip) { background: var(--tint); color: var(--blue-dark); }
html[data-theme="dark"] :is(.reference-toolbar button,.filter-pills button,.browser-title-line button,.circuit-card textarea,.flyout-search,.digest-tabs) { background: var(--soft); }
html[data-theme="dark"] :is(.module-page,.notebook-scroll,.circuit-workspace,.circuit-canvas,#structure-frame,#trace-frame,.map-pdf-preview) { background: var(--canvas); }
html[data-theme="dark"] :is(#statusbar) { background: linear-gradient(#283246,#20293a); color: var(--muted); }
html[data-theme="dark"] #statusbar button { background: transparent; border-left-color: var(--line); }
html[data-theme="dark"] :is(.plain-icon,.work-tab button:last-child,.dialog-header .icon-button,.empty-side,#rich-entry:empty::before) { color: var(--muted); }

html[data-theme="dark"] :is(.status-pill,.circuit-hint,.circuit-start-icon) { background: var(--tint); color: var(--blue-dark); border-color: var(--line); }
html[data-theme="dark"] .circuit-score { background: #173a35; color: #9fd7c7; }
html[data-theme="dark"] :is(.circuit-projects button[aria-pressed="true"],.circuit-design-tools [aria-pressed="true"]) { background: var(--tint); border-color: #7288c8; color: var(--blue-dark); }
html[data-theme="dark"] .circuit-start p { color: var(--muted); }
html[data-theme="dark"] #form-error { color: #ffabb3; }

html[data-theme="dark"] :is(.base.match,.digest-product:hover td) { background: #594c2b; }
html[data-theme="dark"] .digest-product.highlighted td { background: #6c5426; }

html[data-theme="dark"] .primer-bases-preview .primer-mismatch { background: #613e45; }
html[data-theme="dark"] .calendar-cell.off-month { background: var(--surface-alt); color: var(--muted); }
html[data-theme="dark"] .reference-plasmid text:not(.map-cut), html[data-theme="dark"] .linear-map-svg text:not(.map-cut) { fill: var(--map-text); }
html[data-theme="dark"] :is(.reference-plasmid,.linear-map-svg) .inline-label { fill: var(--feature-ink); }
html[data-theme="dark"] .reference-plasmid .nt-A { fill: var(--nt-a); }
html[data-theme="dark"] .reference-plasmid .nt-C { fill: var(--nt-c); }
html[data-theme="dark"] .reference-plasmid .nt-G { fill: var(--nt-g); }

html[data-theme="dark"] #map-selection rect { fill: var(--selection); }

html[data-theme="dark"] #trace-frame [stroke="#13764b"] { stroke: #74d19e; }

html[data-theme="dark"] #trace-frame [stroke="#2466b5"] { stroke: #84b7f4; }
html[data-theme="dark"] #trace-frame [fill="#2466b5"] { fill: #84b7f4; }
html[data-theme="dark"] #trace-frame [stroke="#384051"] { stroke: #d1dae8; }
html[data-theme="dark"] #trace-frame [fill="#384051"] { fill: #d1dae8; }
html[data-theme="dark"] #trace-frame [stroke="#bd3751"] { stroke: #f28ca1; }
html[data-theme="dark"] #trace-frame [fill="#bd3751"] { fill: #f28ca1; }
html[data-theme="dark"] :is(.circuit-canvas,.circuit-chart) svg > rect { fill: var(--canvas); }

html[data-theme="dark"] .circuit-node text:last-child { fill: var(--muted); }
html[data-theme="dark"] .circuit-chart svg [stroke="#e5eaf1"] { stroke: var(--line); }
html[data-theme="dark"] .circuit-chart svg text { fill: var(--muted); }

.annotation-inspector { background: var(--surface); border-left: 1px solid var(--line); flex: 0 0 min(280px,32%); min-width: 0; display: flex; flex-direction: column; overflow: hidden; font-size: 12px; }
.biochemical-panel { overflow: auto; flex: 1; min-height: 0; padding: 16px; background: var(--canvas); font-size: 12px; }
.biochemical-panel h3 { font-size: 13px; margin: 20px 0 9px; }
.biochemical-controls { border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.biochemical-controls select { width: 100%; }
.biochemical-properties { width: 100%; border-collapse: collapse; }
.biochemical-properties th, .biochemical-properties td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.biochemical-properties th { font-weight: 500; width: 59%; }
.biochemical-properties td { font-variant-numeric: tabular-nums; }
.biochemical-sequence { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto; }
.biochemical-notice { background: var(--surface-raised); border-left: 3px solid #b89136; padding: 8px; font-size: 11px; }
.protein-charge-chart { display: block; width: 100%; max-height: 220px; }
.protein-charge-chart text { fill: var(--muted); font-size: 10px; }
.biochemical-methods { margin-top: 20px; color: var(--muted); font-size: 11px; }
.translation-metadata { border: 1px solid var(--line); padding: 10px; margin: 10px 0; border-radius: 5px; }
.note-grid-block { border: 1px solid var(--line); border-radius: 5px; margin: 16px 0 !important; background: var(--surface); font: 12px/1.4 Arial,sans-serif; overflow: hidden; }
.note-grid-tools,.note-formula-bar { display:flex; align-items:center; gap:6px; padding:6px; border-bottom:1px solid var(--line); margin:0 !important; }

  <script>
const Lab = (() => {
  const alphabet = {
    DNA: /^[ACGTRYSWKMBDHVN]+$/,
    RNA: /^[ACGURYSWKMBDHVN]+$/,
    AA: /^[ACDEFGHIKLMNPQRSTVWYBJOUXZ*]+$/,
  };
  const complementBases = Object.fromEntries(
    [...'ACGTURYSWKMBDHVN'].map((base, i) => [base, 'TGCAAYRSWMKVHDBN'[i]])
  );
  const enzymes = {
    BamHI: ['GGATCC', 1], EcoRI: ['GAATTC', 1], HindIII: ['AAGCTT', 1],
    NotI: ['GCGGCCGC', 2], PstI: ['CTGCAG', 5], XbaI: ['TCTAGA', 1],
    SalI: ['GTCGAC', 1], XhoI: ['CTCGAG', 1], SmaI: ['CCCGGG', 3],
    EcoRV: ['GATATC', 3], KpnI: ['GGTACC', 5], NheI: ['GCTAGC', 1],
    AatII: ['GACGTC', 5], AccI: ['GTMKAC', 2], AclI: ['AACGTT', 2],
    AfeI: ['AGCGCT', 3], AflIII: ['ACRYGT', 1], AgeI: ['ACCGGT', 1],
    ApaI: ['GGGCCC', 5], ApaLI: ['GTGCAC', 1], AscI: ['GGCGCGCC', 2],
    AseI: ['ATTAAT', 2], BclI: ['TGATCA', 1], BglII: ['AGATCT', 1],
    BmtI: ['GCTAGC', 5], BspEI: ['TCCGGA', 1], BspHI: ['TCATGA', 1],
    BsrGI: ['TGTACA', 1], ClaI: ['ATCGAT', 2], DraI: ['TTTAAA', 3],
    HaeIII: ['GGCC', 2], HincII: ['GTYRAC', 3], HpaI: ['GTTAAC', 3],
    KasI: ['GGCGCC', 1], MluI: ['ACGCGT', 1], MscI: ['TGGCCA', 3],
    NarI: ['GGCGCC', 2], NcoI: ['CCATGG', 1], NdeI: ['CATATG', 2],
    NruI: ['TCGCGA', 3], NsiI: ['ATGCAT', 5], PacI: ['TTAATTAA', 5],
    PciI: ['ACATGT', 1], PmeI: ['GTTTAAAC', 4], PvuII: ['CAGCTG', 3],
    SacI: ['GAGCTC', 5], SacII: ['CCGCGG', 4], ScaI: ['AGTACT', 3],
    SfiI: ['GGCCNNNNNGGCC', 8], SfoI: ['GGCGCC', 3], SnaBI: ['TACGTA', 3],
    SpeI: ['ACTAGT', 1], SphI: ['GCATGC', 5], SspI: ['AATATT', 3],
    XmaI: ['CCCGGG', 1], XmnI: ['GAANNNNTTC', 5], ZraI: ['GACGTC', 3],
    BbsI: ['GAAGAC', 8, 12], BsaI: ['GGTCTC', 7, 11], BsmBI: ['CGTCTC', 7, 11],
    BspQI: ['GCTCTTC', 8, 11], SapI: ['GCTCTTC', 8, 11],
  };
  const recognitionCodes = { R: '[AG]', Y: '[CT]', S: '[GC]', W: '[AT]', K: '[GT]', M: '[AC]',
    B: '[CGT]', D: '[AGT]', H: '[ACT]', V: '[ACG]', N: '[ACGT]' };
  const colors = ['#93d84c', '#ffd654', '#75b6ef', '#ee8cc2', '#faa06c', '#a59aed'];

  function infer(bases) {
    if (alphabet.DNA.test(bases)) return 'DNA';
    if (alphabet.RNA.test(bases)) return 'RNA';
    return 'AA';
  }

  function basesOf(value, type) {
    const bases = value.replace(/\s+/g, '').toUpperCase();
    if (!alphabet[type]?.test(bases)) {
      throw Error('Revisa la secuencia. Contiene símbolos que no pertenecen al alfabeto ' + type + ' o está vacía.');
    }
    if (bases.length > 250000) throw Error('El límite por secuencia es de 250 000 posiciones.');
    return bases;
  }

  function complement(bases, type = 'DNA') {
    const paired = [...bases].map(base => complementBases[base] || 'N').join('');
    return type === 'RNA' ? paired.replaceAll('T', 'U') : paired;
  }

  function reverseComplement(bases, type = 'DNA') {
    return complement([...bases].reverse().join(''), type);
  }

  function translate(bases, frame) {
    const table = 'FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
    const order = 'TCAG';
    const strand = (frame < 0 ? reverseComplement(bases) : bases).replaceAll('U', 'T');
    let protein = '';
    for (let i = Math.abs(frame) - 1; i + 2 < strand.length; i += 3) {
      const digits = [...strand.slice(i, i + 3)].map(base => order.indexOf(base));
      protein += digits.includes(-1) ? 'X' : table[digits[0] * 16 + digits[1] * 4 + digits[2]];
    }
    return protein;
  }

  function gc(bases) {
    return (100 * (bases.match(/[GC]/g) || []).length / bases.length).toFixed(1);
  }

  function parseLocation(expression, length) {
    let inner = expression.replace(/\s/g, '');
    const strand = inner.startsWith('complement(') && inner.endsWith(')') ? -1 : 1;
    if (strand < 0) inner = inner.slice(11, -1);
    if (/^(join|order)\(.*\)$/.test(inner)) inner = inner.slice(inner.indexOf('(') + 1, -1);
    const ranges = inner.split(',').map(part => {
      const matched = /^[<>]?(\d+)(?:\.\.[<>]?(\d+))?$/.exec(part);
      if (!matched) return null;
      const start = Number(matched[1]);
      const end = Number(matched[2] || matched[1]);
      return start >= 1 && start <= end && end <= length ? [start, end] : null;
    });
    return ranges.includes(null) ? null : { ranges, strand };
  }

  function readGenBank(text) {
    return text.split(/^\/\/\s*$/m).filter(record => record.trim()).map(record => {
      const header = /^LOCUS\s+(\S+)\s+(\d+)\s+(bp|aa)\b([^\n]*)/im.exec(record);
      const origin = /^ORIGIN[^\n]*\n([\s\S]*)/im.exec(record);
      if (!header || !origin) throw Error('Hay un registro GenBank sin LOCUS u ORIGIN.');
      const type = header[3].toLowerCase() === 'aa' ? 'AA' : /RNA/i.test(header[4]) ? 'RNA' : 'DNA';
      const bases = basesOf(origin[1].replace(/\d/g, ''), type);
      if (bases.length !== Number(header[2])) throw Error('La longitud declarada en LOCUS no coincide con ORIGIN.');
      const definition = /^DEFINITION\s+([^\n]*(?:\n {12}[^\n]*)*)/m.exec(record)?.[1];
      const featureText = /^FEATURES[^\n]*\n([\s\S]*?)(?=^ORIGIN)/m.exec(record)?.[1] || '';
      const features = [];
      let omitted = 0;
      for (const match of featureText.matchAll(/^ {5}(\S+)\s+([^\n]+)\n?((?:^ {21}[^\n]*\n?)*)/gm)) {
        const detail = match[3].split('\n').map(line => line.trim());
        const qualifiersAt = detail.findIndex(line => line.startsWith('/'));
        const continuedLocation = qualifiersAt < 0 ? detail : detail.slice(0, qualifiersAt);
        const location = [match[2].trim(), ...continuedLocation].join('');
        if (match[1] === 'source') continue;
        const parsed = parseLocation(location, bases.length);
        if (!parsed) { omitted += 1; continue; }
        const qualifiers = qualifiersAt < 0 ? [] : detail.slice(qualifiersAt).filter(Boolean);
        const field = qualifiers.join(' ').match(/\/(?:label|gene|product|note)=(?:"([^"]*)"|(\S+))/i);
        features.push({
          name: field?.[1] || field?.[2] || match[1],
          kind: match[1], ...parsed, location, qualifiers, color: colors[features.length % colors.length],
        });
        const encoded=qualifiers.join(' ').match(/\/mesa_part="([^"]*)"/);
        if(encoded){let meta;try{meta=JSON.parse(decodeURIComponent(encoded[1].replace(/\s/g,'')));if(typeof PartData!=='undefined')PartData.validate(meta);}catch{throw Error('Metadatos de pieza inválidos en GenBank.');}features.at(-1).biopart=meta;}
      }
      return {
        name: header[1], type, bases, topology: /\bcircular\b/i.test(header[4]) ? 'circular' : 'linear',
        description: definition?.replace(/\s+/g, ' ').trim() || '', features, omitted,
      };
    });
  }

  function readSequences(raw, fallbackName, declaredType = '') {
    const text = raw.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').trim();
    if (!text) throw Error('Selecciona un archivo de secuencia o pega el contenido.');
    if (/^LOCUS\s/.test(text)) return readGenBank(text);
    const fasta = text.startsWith('>');
    return (fasta ? text.slice(1).split(/\n>/) : [text]).map(record => {
      const newline = record.indexOf('\n');
      if (fasta && newline < 0) throw Error('Falta la secuencia después de un encabezado FASTA.');
      const name = fasta ? record.slice(0, newline).trim() : fallbackName;
      const rawBases = fasta ? record.slice(newline + 1) : record;
      const type = declaredType || infer(rawBases.replace(/\s+/g, '').toUpperCase());
      return { name: name || 'Sin título', type, bases: basesOf(rawBases, type),
        topology: 'linear', description: '', features: [], omitted: 0 };
    });
  }

  function toFasta(record) {
    return '>' + record.name.replace(/[\r\n]/g, ' ') + '\n' + record.bases.match(/.{1,70}/g).join('\n') + '\n';
  }

  function toGenBank(record) {
    const name = record.name.replace(/[^\w.-]/g, '_').slice(0, 16) || 'sequence';
    const date = new Date().toLocaleDateString('en-GB', {
      timeZone: 'UTC', day: '2-digit', month: 'short', year: 'numeric',
    }).replaceAll(' ', '-').toUpperCase();
    const units = record.type === 'AA' ? 'aa' : 'bp';
    const molecule = record.type === 'AA' ? '' : record.type;
    const lines = [
      'LOCUS       ' + name.padEnd(16) + String(record.bases.length).padStart(12) +
        ' ' + units + ' ' + molecule.padEnd(8) + record.topology.padEnd(9) + ' SYN ' + date,
      'DEFINITION  ' + (record.description || record.name).replace(/\s+/g, ' '),

      const span = intervals.length > 1 ? 'join(' + intervals.join(',') + ')' : intervals[0];
      const location = feature.location || (feature.strand < 0 ? 'complement(' + span + ')' : span);

      for (const qualifier of feature.qualifiers || ['/label="' + label + '"']) {

  function restrictionSites(record, names) {

      const reverse = reverseComplement(motif);

          const i = match.index;
          const a = i + orientation.top;

    const cuts = [...cutSites.keys()];

    const products = edges.slice(1).map((edge, i) => {
      const boundary = edges[i];

      const left = cutSites.get(boundary) || [];
      const right = cutSites.get(circular ? edge % length : edge) || [];

    const fragments = products.map(product => product.length).sort((a, b) => b - a);

          start: position(strand > 0 ? offset : length - 1 - offset),

  function align(a, b) {
    const width = b.length + 1;
    const cells = (a.length + 1) * width;

    const scores = new Int32Array(cells);
    const trace = new Uint8Array(cells);
    for (let j = 1; j <= b.length; j++) { scores[j] = -2 * j; trace[j] = 2; }
    for (let i = 1; i <= a.length; i++) {
      scores[i * width] = -2 * i;
      trace[i * width] = 1;
      for (let j = 1; j <= b.length; j++) {
        const index = i * width + j;
        const diagonal = scores[index - width - 1] + (a[i - 1] === b[j - 1] ? 2 : -1);
        const up = scores[index - width] - 2;
        const left = scores[index - 1] - 2;
        scores[index] = Math.max(diagonal, up, left);
        trace[index] = diagonal === scores[index] ? 0 : up === scores[index] ? 1 : 2;
      }
    }
    let i = a.length;
    let j = b.length;
    const first = [];
    const second = [];
    const marks = [];
    let equal = 0;
    while (i || j) {
      const dir = trace[i * width + j];
      const x = dir === 2 ? '-' : a[--i];
      const y = dir === 1 ? '-' : b[--j];
      first.push(x);
      second.push(y);
      marks.push(x === y ? '|' : ' ');
      if (x === y) equal += 1;
    }
    return {
      first: first.reverse().join(''), second: second.reverse().join(''), marks: marks.reverse().join(''),
      identity: 100 * equal / marks.length, score: scores[cells - 1],

  const colors = ['#2563a6', '#a13d78', '#22846d', '#b97816', '#7353b7', '#d15e48'];
  const identifier = value => typeof value === 'string' && /^[A-Za-z_][A-Za-z_0-9]*$/.test(value);
  const id = value => typeof value === 'string' && /^[\w-]{1,100}$/.test(value);
  const finite = (n, min, max) => typeof n === 'number' && Number.isFinite(n) && n >= min && n <= max;
  const label = name => typeof name === 'string' && name.trim().length > 0 && name.length <= 160;

  function node(nodeId, name, kind = 'gene', gate = 'REGULATED', x = 80, y = 100) {
    return { id: nodeId, name, kind, gate, x, y, color: colors[0], basal: .05, max: 8, K: 10, n: 2,
      decay: .1, initial: 0, low: 0, high: 30, start: 0, stop: 240 };
  }

  function validate(circuit) {
    if (!circuit || circuit.schema !== 1 || !Array.isArray(circuit.nodes) || circuit.nodes.length > 40 ||
      !Array.isArray(circuit.edges) || circuit.edges.length > 160 || !Array.isArray(circuit.parts) || circuit.parts.length > 200) {
      throw Error('Circuito incompatible o demasiado grande.');
    }
    const ids = new Set();
    for (const item of circuit.nodes) {
      if (!id(item.id) || ids.has(item.id) || !label(item.name) || !['input', 'gene', 'reporter'].includes(item.kind) ||
        !gates.includes(item.gate) || !/^#[\da-f]{6}$/i.test(item.color) || !finite(item.x, 0, 2500) || !finite(item.y, 0, 2000) ||
        !finite(item.basal, 0, 10000) || !finite(item.max, item.basal, 10000) || !finite(item.K, .001, 1e6) ||
        !finite(item.n, .1, 8) || !finite(item.decay, .0001, 10) || !finite(item.initial, 0, 1e6) ||
        !finite(item.low, 0, 1e6) || !finite(item.high, item.low, 1e6) || !finite(item.start, 0, 10000) || !finite(item.stop, item.start, 10000)) {
        throw Error('Revisa los parámetros y los identificadores de las especies.');
      }
      ids.add(item.id);
    }
    if (circuit.nodes.filter(item => item.kind === 'input').length > 6) throw Error('Se admiten hasta seis entradas.');
    const edgeIds = new Set();
    for (const edge of circuit.edges) {
      if (!id(edge.id) || edgeIds.has(edge.id) || !ids.has(edge.source) || !ids.has(edge.target) ||
        !['activation', 'inhibition', 'signal'].includes(edge.kind) || circuit.nodes.find(item => item.id === edge.target).kind === 'input') {
        throw Error('Hay una conexión inválida.');
      }
      edgeIds.add(edge.id);
    }
    const parts = new Set();
    for (const part of circuit.parts) {
      if(part.biopart!==undefined)PartData.validate(part.biopart);
      if(part.childNodes!==undefined&&(!part.childNodes||typeof part.childNodes!=='object'||Array.isArray(part.childNodes)||Object.entries(part.childNodes).some(([index,node])=>!/^\d+$/.test(index)||!ids.has(node)||!part.annotations?.[Number(index)]?.biopart)))throw Error('Asociación de TU hija inválida.');
      if(part.annotations!==undefined){
        if(!Array.isArray(part.annotations)||part.annotations.length>1000||!part.bases)throw Error('Anotaciones hijas incompatibles.');
        for(const f of part.annotations){if(!label(f.name)||typeof f.kind!=='string'||!/[A-Za-z0-9_'-]{1,15}/.test(f.kind)||![1,-1].includes(f.strand)||!Array.isArray(f.ranges)||!f.ranges.length||f.ranges.some(r=>!Array.isArray(r)||r.length!==2||!Number.isInteger(r[0])||!Number.isInteger(r[1])||r[0]<1||r[1]<r[0]||r[1]>part.bases.length))throw Error('Intervalos hijos inválidos.');if(f.biopart)PartData.validate(f.biopart);}
      }
      if (!id(part.id) || parts.has(part.id) || !label(part.name) || !Object.hasOwn(roles, part.role) ||
        ![1, -1].includes(part.strand) || !/^#[\da-f]{6}$/i.test(part.color) ||
        part.node && !ids.has(part.node) || part.bases !== undefined && (typeof part.bases !== 'string' || !/^[ACGTN]{1,250000}$/.test(part.bases))) {
        throw Error('Revisa las partes del constructo.');
      }
      parts.add(part.id);
    }
    if (circuit.parts.reduce((sum, part) => sum + (part.bases?.length || 0), 0) > 250000) throw Error('El constructo supera 250 000 bases.');
    if(JSON.stringify(circuit.parts).length>10000000)throw Error('Los metadatos del constructo superan 10 MB.');
    for (const [key, limit] of [['description', 10000], ['verilog', 30000]]) {
      if (circuit[key] !== undefined && (typeof circuit[key] !== 'string' || circuit[key].length > limit)) throw Error('Texto de circuito demasiado largo.');
    }
    const s = circuit.settings;
    if (!s || !finite(s.duration, .1, 10000) || !finite(s.step, .001, s.duration) || s.duration / s.step > 5000 ||
      !['rk4', 'ssa'].includes(s.solver) || !Number.isInteger(s.seed) || s.seed < 1 || s.seed > 4294967295) throw Error('Revisa la duración, el paso y la semilla.');
    if (circuit.ucf !== undefined && (typeof circuit.ucf !== 'string' || circuit.ucf.length > 10_000_000)) throw Error('La UCF supera 10 MB.');
    if (circuit.assignment !== undefined) {
      const a = circuit.assignment;
      if (!a || !a.assignments || Array.isArray(a.assignments) || typeof a.assignments !== 'object' ||
        Object.keys(a.assignments).length > 40 || Object.entries(a.assignments).some(([key, name]) => !ids.has(key) || !label(name)) ||
        !finite(a.score, 0, Number.MAX_VALUE) || !Number.isInteger(a.attempts) || a.attempts < 1 || a.attempts > 5000 || typeof a.bounded !== 'boolean') throw Error('Asignación incompatible.');
    }
    return circuit;
  }

  function sample(kind = 'not') {
    const base = { schema: 1, description: 'Modelo ilustrativo con parámetros sin calibración experimental.', nodes: [], edges: [], parts: [],
      settings: { duration: 240, step: 1, solver: 'rk4', seed: 42 } };
    if (kind === 'repressilator' || kind === 'toggle') {
      const count = kind === 'toggle' ? 2 : 3;
      base.nodes = Array.from({ length: count }, (_, i) => ({ ...node('g' + i, 'Represor ' + (i + 1), 'gene', 'REGULATED', 80 + i * 270, 100 + (i % 2) * 130),
        initial: i ? 0 : 45, n: count === 2 ? 3 : 4, decay: .06, max: 8, K: 15, color: colors[i] }));
      base.edges = base.nodes.map((item, i) => ({ id: 'e' + i, source: item.id, target: base.nodes[(i + 1) % count].id, kind: 'inhibition' }));
    } else {
      base.nodes = [node('A', 'Entrada A', 'input', 'INPUT', 70, 120), node('Y', 'Reportero Y', 'reporter', 'NOT', 370, 120)];
      base.nodes[0].start = 60;
      base.nodes[0].stop = 180;
      base.nodes[1].color = colors[2];
      base.edges = [{ id: 'e0', source: 'A', target: 'Y', kind: 'signal' }];
    }
    base.parts = defaultParts(base.nodes);
    return base;
  }

  function defaultParts(nodes) {
    return nodes.filter(item => item.kind !== 'input').flatMap(item => ['promoter', 'rbs', 'cds', 'terminator'].map((role, index) =>
      ({ id: item.id + '_p' + index, node: item.id, role, name: role === 'cds' ? item.name : role, strand: 1, color: item.color })));
  }

  function order(circuit) {
    const incoming = new Map(circuit.nodes.map(item => [item.id, []]));
    for (const edge of circuit.edges) incoming.get(edge.target).push(edge);
    const done = new Set();
    const sorted = [];
    for (let round = 0; round < circuit.nodes.length; round++) {
      const ready = circuit.nodes.filter(item => !done.has(item.id) && incoming.get(item.id).every(edge => done.has(edge.source)));
      if (!ready.length) break;
      for (const item of ready) { done.add(item.id); sorted.push(item); }
    }
    if (sorted.length !== circuit.nodes.length) throw Error('La lógica estática requiere una red sin ciclos. La realimentación se analiza en Simulación.');
    return { sorted, incoming };
  }

  function booleanGate(gate, values) {
    if (gate === 'NOT' || gate === 'NOR') return !values.some(Boolean);
    if (gate === 'AND') return values.every(Boolean);
    if (gate === 'NAND') return !values.every(Boolean);
    if (gate === 'XOR') return values.filter(Boolean).length % 2 === 1;
    if (gate === 'XNOR') return values.filter(Boolean).length % 2 === 0;
    return values.some(Boolean);
  }

  function truth(circuit) {
    validate(circuit);
    const { sorted, incoming } = order(circuit);
    const inputs = circuit.nodes.filter(item => item.kind === 'input');
    const rows = [];
    for (let mask = 0; mask < 2 ** inputs.length; mask++) {
      const values = Object.fromEntries(inputs.map((item, i) => [item.id, Boolean(mask & (1 << (inputs.length - i - 1)))]));
      for (const item of sorted) {
        if (item.kind === 'input') continue;
        const edges = incoming.get(item.id);
        values[item.id] = item.gate === 'CONST' ? item.initial > 0 : item.gate === 'REGULATED' ?
          edges.every(edge => edge.kind === 'inhibition' ? !values[edge.source] : values[edge.source]) :
          booleanGate(item.gate, edges.map(edge => values[edge.source]));
      }
      rows.push(values);
    }
    return { inputs, outputs: circuit.nodes.filter(item => item.kind === 'reporter'), rows, sorted };
  }

  const inputAt = (item, time) => time >= item.start && time < item.stop ? item.high : item.low;
  const hill = (value, K, n) => 1 / (1 + (Math.max(0, value) / K) ** n);

  function production(item, values, incoming) {
    if (item.gate === 'CONST') return item.initial ? item.max : item.basal;
    const edges = incoming.get(item.id);
    const signal = edges.map(edge => Math.max(0, values[edge.source] || 0));
    const activation = signal.map(value => 1 - hill(value, item.K, item.n));
    let activity;
    if (item.gate === 'REGULATED') activity = edges.reduce((value, edge, i) => value *
      (edge.kind === 'inhibition' ? 1 - activation[i] : activation[i]), 1);
    else if (item.gate === 'NOR' || item.gate === 'NOT') activity = hill(signal.reduce((a, b) => a + b, 0), item.K, item.n);
    else if (item.gate === 'AND' || item.gate === 'NAND') {
      activity = activation.reduce((a, b) => a * b, 1);
      if (item.gate === 'NAND') activity = 1 - activity;
    } else if (item.gate === 'XOR' || item.gate === 'XNOR') {
      activity = activation.reduce((a, b) => a * (1 - b) + (1 - a) * b, 0);
      if (item.gate === 'XNOR') activity = 1 - activity;
    } else activity = 1 - activation.reduce((a, b) => a * (1 - b), 1);
    return item.basal + (item.max - item.basal) * activity;
  }

  function setup(circuit) {
    validate(circuit);
    const dynamic = circuit.nodes.filter(item => item.kind !== 'input');
    const inputs = circuit.nodes.filter(item => item.kind === 'input');
    const incoming = new Map(circuit.nodes.map(item => [item.id, []]));
    circuit.edges.forEach(edge => incoming.get(edge.target).push(edge));
    const valuesAt = (state, t) => Object.fromEntries([...inputs.map(item => [item.id, inputAt(item, t)]), ...dynamic.map((item, i) => [item.id, state[i]])]);
    const derivative = (state, time) => {
      const values = valuesAt(state, time);
      return dynamic.map((item, i) => production(item, values, incoming) - item.decay * state[i]);
    };
    const transitions = [...new Set(inputs.flatMap(item => [item.start, item.stop]))].sort((a, b) => a - b);
    return { dynamic, inputs, incoming, valuesAt, derivative, transitions };
  }

  function random(seed) {
    let state = seed >>> 0;
    return () => {
      state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
      return (state + .5) / 4294967296;
    };
  }

  function simulate(circuit, overrides = {}) {
    const config = setup(circuit);
    const { dynamic, incoming, valuesAt, derivative, transitions } = config;
    const settings = { ...circuit.settings, ...overrides };
    const { duration, step, solver } = settings;
    if (!finite(duration, .1, 10000) || !finite(step, .001, duration) || duration / step > 5000) throw Error('Demasiados puntos de simulación.');
    const points = [];
    const rng = random(settings.seed);
    let state = dynamic.map(item => solver === 'ssa' ? Math.round(item.initial) : item.initial);
    let time = 0;
    let iterations = 0;
    const maxStep = Math.min(step, .1, .2 / Math.max(.01, ...dynamic.map(item => item.decay)));
    const samples = Math.ceil(duration / step);
    for (let sample = 0; sample <= samples; sample++) {
      const target = Math.min(duration, sample * step);
      while (time < target - 1e-10) {
        if (++iterations > 500000) throw Error('Se alcanzó el límite de cálculo. Reduce la duración o las tasas.');
        const event = transitions.find(t => t > time + 1e-10) ?? duration;
        const end = Math.min(target, event);
        if (solver === 'ssa') {
          const values = valuesAt(state, time + 1e-10);
          const propensities = dynamic.flatMap((item, i) => [production(item, values, incoming), item.decay * state[i]]);
          const total = propensities.reduce((a, b) => a + b, 0);
          const next = total ? time - Math.log(rng()) / total : Infinity;
          if (next >= end) { time = end; continue; }
          let draw = rng() * total;
          let choice = 0;
          while (choice < propensities.length - 1 && (draw -= propensities[choice]) > 0) choice++;
          const index = Math.floor(choice / 2);
          state[index] += choice % 2 ? -1 : 1;
          time = next;
        } else {
          const dt = Math.min(maxStep, end - time);
          const k1 = derivative(state, time + 1e-10);
          const k2 = derivative(state.map((v, i) => v + dt * k1[i] / 2), time + dt / 2);
          const k3 = derivative(state.map((v, i) => v + dt * k2[i] / 2), time + dt / 2);
          const k4 = derivative(state.map((v, i) => v + dt * k3[i]), time + dt - 1e-10);
          state = state.map((v, i) => Math.max(0, v + dt * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]) / 6));
          time += dt;
        }
        if (state.some(v => !Number.isFinite(v) || v > 1e9)) throw Error('El modelo divergió. Revisa tasas y paso.');
      }
      points.push({ time: target, values: valuesAt(state, target) });
    }
    return { points, iterations, solver, seed: settings.seed, units: 'moléculas por célula', timeUnit: 'min' };
  }

  function sweep(circuit, nodeId, parameter, from, to, count = 12) {
    if (!['max', 'K', 'n', 'decay', 'basal', 'high'].includes(parameter) || !finite(from, .0001, 1e6) ||
      !finite(to, from, 1e6) || !Number.isInteger(count) || count < 2 || count > 30) throw Error('Revisa el barrido.');
    const copy = structuredClone(circuit);
    const item = copy.nodes.find(n => n.id === nodeId);
    if (!item) throw Error('Elige una especie.');
    if ((item.kind === 'input') !== (parameter === 'high')) throw Error('Usa Entrada alta para entradas externas y parámetros cinéticos para genes.');
    item[parameter] = from; validate(copy);
    item[parameter] = to; validate(copy);
    if (copy.settings.duration / .02 * Math.max(1, copy.nodes.length) * count > 8_000_000) throw Error('Reduce la duración o los puntos del barrido.');
    return Array.from({ length: count }, (_, index) => {
      const value = from + (to - from) * index / (count - 1);
      item[parameter] = value;
      const simulation = simulate(copy, { solver: 'rk4', step: Math.max(copy.settings.step, copy.settings.duration / 250) });
      return { value, values: simulation.points.at(-1).values };
    });
  }

  function compileVerilog(source) {
    if (typeof source !== 'string' || source.length > 30000) throw Error('El Verilog supera 30 000 caracteres.');
    const text = source.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/[^\n]*/g, '');
    const module = /^\s*module\s+([A-Za-z_]\w*)\s*\(([\s\S]*?)\)\s*;([\s\S]*?)endmodule\s*$/.exec(text);
    if (!module) throw Error('Usa un módulo Verilog combinacional con declaraciones input/output y assign.');
    const names = { input: [], output: [], wire: [] };
    let direction = null;
    for (const word of module[2].replace(/,/g, ' ').trim().split(/\s+/)) {
      if (word === 'input' || word === 'output') direction = word;
      else if (word === 'wire') continue;
      else if (direction && identifier(word)) names[direction].push(word);
      else if (!identifier(word)) throw Error('Solo se admiten puertos escalares.');
    }
    let body = module[3].replace(/\b(input|output|wire)\s+([^;]+);/g, (_, type, list) => {
      list.split(',').forEach(value => names[type].push(value.trim()));
      return '';
    });
    for (const type of Object.keys(names)) names[type] = [...new Set(names[type])];
    if (!names.input.length || names.input.length > 6 || !names.output.length || names.output.length > 8 ||
      Object.values(names).flat().some(name => !identifier(name))) throw Error('Usa de 1 a 6 entradas y de 1 a 8 salidas escalares.');
    const base = sample();
    base.nodes = [];
    base.edges = [];
    const wires = new Map();
    const memo = new Map();
    let serial = 0;
    for (const [i, name] of names.input.entries()) {
      const item = node('in_' + name, name, 'input', 'INPUT', 40, 50 + i * 120);
      item.color = colors[i % colors.length];
      item.start = 0;
      item.stop = 240;
      base.nodes.push(item);
      wires.set(name, item.id);
    }
    const make = (gate, inputs) => {
      if (gate === 'NOR' && inputs[0] === inputs[1]) { gate = 'NOT'; inputs = [inputs[0]]; }
      const key = gate + ':' + inputs.slice().sort().join(',');
      if (memo.has(key)) return memo.get(key);
      const item = node('g' + serial, gate + ' ' + (serial + 1), 'gene', gate);
      serial++;
      const level = 1 + Math.max(0, ...inputs.map(id => base.nodes.find(n => n.id === id)?.level || 0));
      item.level = level;
      item.x = 40 + level * 230;
      item.y = 50 + base.nodes.filter(n => n.level === level).length * 120;
      item.color = colors[(serial - 1) % colors.length];
      base.nodes.push(item);
      inputs.forEach(source => base.edges.push({ id: 'e' + base.edges.length, source, target: item.id, kind: 'signal' }));
      memo.set(key, item.id);
      if (base.nodes.length > 40) throw Error('La compilación supera 40 especies.');
      return item.id;
    };
    const negate = input => make('NOT', [input]);
    const combine = (op, a, b) => {
      if (op === '|') return negate(make('NOR', [a, b]));
      if (op === '&') return make('NOR', [negate(a), negate(b)]);
      const common = make('NOR', [a, b]);
      return negate(make('NOR', [make('NOR', [a, common]), make('NOR', [b, common])]));
    };
    const parse = expression => {
      const tokens = expression.match(/[A-Za-z_]\w*|1'b[01]|[01]|[~!&|^()]/g) || [];
      if (tokens.join('') !== expression.replace(/\s/g, '')) throw Error('Operador Verilog no admitido.');
      let cursor = 0;
      const atom = () => {
        const token = tokens[cursor++];
        if (token === '~' || token === '!') return negate(atom());
        if (token === '(') { const value = binary(0); if (tokens[cursor++] !== ')') throw Error('Falta un paréntesis.'); return value; }
        if (['0', '1', "1'b0", "1'b1"].includes(token)) {
          const value = token.at(-1) === '1';
          const key = 'const_' + Number(value);
          if (!base.nodes.some(n => n.id === key)) base.nodes.push({ ...node(key, Number(value).toString(), 'gene', 'CONST'), initial: value ? 1 : 0 });
          return key;
        }
        if (!wires.has(token)) throw Error('Señal no definida antes de su uso: ' + token);
        return wires.get(token);
      };
      const precedence = { '|': 1, '^': 2, '&': 3 };
      const binary = min => {
        let left = atom();
        while (precedence[tokens[cursor]] >= min) {
          const op = tokens[cursor++];
          left = combine(op, left, binary(precedence[op] + 1));
        }
        return left;
      };
      const result = binary(0);
      if (cursor !== tokens.length) throw Error('Expresión incompleta.');
      return result;
    };
    body = body.replace(/\bassign\s+([A-Za-z_]\w*)\s*=\s*([^;]+);/g, (_, name, expression) => {
      if (!names.output.includes(name) && !names.wire.includes(name) || wires.has(name)) throw Error('Revisa la declaración o la asignación única de ' + name);
      wires.set(name, parse(expression));
      return '';
    });
    if (body.trim()) throw Error('Este compilador admite Verilog escalar con assign. Convierte case o estructuras a assign.');
    for (const [i, name] of names.output.entries()) {
      if (!wires.has(name)) throw Error('Falta assign para la salida ' + name);
      const sourceId = wires.get(name);
      const sourceNode = base.nodes.find(n => n.id === sourceId);
      const output = node('out_' + name, name, 'reporter', 'BUFFER', sourceNode.x + 230, 50 + i * 140);
      base.nodes.push(output);
      base.edges.push({ id: 'e' + base.edges.length, source: sourceId, target: output.id, kind: 'signal' });
    }
    base.parts = defaultParts(base.nodes);
    base.description = 'Compilado desde Verilog mediante descomposición NOR/NOT. Parámetros ilustrativos.';
    base.verilog = source;
    base.nodes.forEach(item => { delete item.level; item.x = Math.min(2400, item.x); item.y = Math.min(1900, item.y); });
    validate(base);
    return base;
  }

  function readUCF(text) {
    if (typeof text !== 'string' || text.length > 10_000_000) throw Error('La UCF debe ser JSON de hasta 10 MB.');
    const data = JSON.parse(text);
    if (!Array.isArray(data) || data.length > 10000) throw Error('Se esperaba una lista de colecciones Cello UCF v2.');
    const models = new Map(data.filter(item => item?.collection === 'models').map(item => [item.name, item]));
    const functions = new Map(data.filter(item => item?.collection === 'functions').map(item => [item.name, item]));
    const library = data.filter(item => item?.collection === 'gates').flatMap(item => {
      const model = models.get(item.model);
      const fn = functions.get(model?.functions?.response_function);
      const equation = fn?.equation?.replace(/\s/g, '');
      if (!['NOT', 'NOR'].includes(item.gate_type) || !['ymin+(ymax-ymin)/(1.0+(x/K)^n)', 'ymin+(ymax-ymin)/(1+(x/K)^n)'].includes(equation)) return [];
      const p = Object.fromEntries((model.parameters || []).map(pair => [pair.name, pair.value]));
      if (![p.ymin, p.ymax, p.K, p.n].every(Number.isFinite) || p.ymin < 0 || p.ymax <= p.ymin || p.K <= 0 || p.n <= 0) return [];
      return [{ name: item.name, group: item.group || item.name, ymin: p.ymin, ymax: p.ymax, K: p.K, n: p.n,
        color: /^[a-f0-9]{6}$/i.test(item.color || '') ? '#' + item.color : colors[0] }];
    });
    if (!library.length || library.length > 200) throw Error('No hay puertas NOR/NOT con la respuesta Hill canónica admitida.');
    return { name: String(data.find(item => item?.collection === 'header')?.version || 'UCF importada').slice(0, 160), library };
  }

  function analog(circuit, assignments = {}) {
    const table = truth(circuit);
    const incoming = new Map(circuit.nodes.map(item => [item.id, circuit.edges.filter(edge => edge.target === item.id)]));
    const rows = table.rows.map(logic => {
      const values = {};
      for (const item of table.sorted) {
        if (item.kind === 'input') values[item.id] = logic[item.id] ? item.high : item.low;
        else if (item.kind === 'reporter' && item.gate === 'BUFFER') values[item.id] = values[incoming.get(item.id)[0]?.source] || 0;
        else if (assignments[item.id]) {
          const gate = assignments[item.id];
          const x = incoming.get(item.id).reduce((sum, edge) => sum + values[edge.source], 0);
          values[item.id] = gate.ymin + (gate.ymax - gate.ymin) * hill(x, gate.K, gate.n);
        } else values[item.id] = production(item, values, incoming);
      }
      return values;
    });
    const scores = table.outputs.map(output => {
      const on = rows.filter((_, i) => table.rows[i][output.id]).map(row => row[output.id]);
      const off = rows.filter((_, i) => !table.rows[i][output.id]).map(row => row[output.id]);
      return { id: output.id, on: on.length ? Math.min(...on) : null, off: off.length ? Math.max(...off) : null,

    const assignments = {};
    const used = new Set();
    const visit = index => {
      if (attempts >= limit) return;
      if (index === nodes.length) {
        attempts++;

        if (result.score !== null && (!best || result.score > best.score)) best = { score: result.score,
          assignments: Object.fromEntries(Object.entries(assignments).map(([id, gate]) => [id, gate.name])) };

      }
      for (const gate of library) {
        if (used.has(gate.group)) continue;
        used.add(gate.group);
        assignments[nodes[index].id] = gate;
        visit(index + 1);
        used.delete(gate.group);
        if (attempts >= limit) break;
      }
    };
    if (nodes.length > new Set(library.map(item => item.group)).size) throw Error('No hay suficientes familias de represores distintas.');
    visit(0);
    if (!best) throw Error('La red no tiene salidas con estados ON y OFF evaluables.');
    return { ...best, attempts, bounded: attempts >= limit };
  }

    simulate, sweep, compileVerilog, readUCF, analog, assignUCF };

const CircuitExchange = (() => {
  const xml = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' })[char]);
  const symbol = id => 's_' + Array.from(id, char => char.charCodeAt(0).toString(16)).join('_');
  const number = (value, units = 'dimensionless') => '<cn sbml:units="' + units + '">' + Number(value) + '</cn>';
  const variable = value => '<ci>' + xml(value) + '</ci>';
  const apply = (op, ...args) => '<apply><' + op + '/>' + args.join('') + '</apply>';

  function expression(circuit, node, mathML = false) {
    const p = key => mathML ? variable(symbol(node.id) + '_' + key) : symbol(node.id) + '_' + key;
    const constant = n => mathML ? number(n) : String(n);
    const op = (name, args) => {
      if (!args.length) return constant(name === 'times' ? 1 : 0);
      if (args.length === 1) return args[0];
      return mathML ? apply(name, ...args) : '(' + args.join({ plus: '+', times: '*', minus: '-', divide: '/', power: '^' }[name]) + ')';
    };
    const minus = a => op('minus', [constant(1), a]);

    const signals = edges.map(edge => mathML ? variable(symbol(edge.source)) : symbol(edge.source));

      '<unitDefinition id="item_per_minute"><listOfUnits><unit kind="item" exponent="1" scale="0" multiplier="1"/>' +
      '<unit kind="second" exponent="-1" scale="0" multiplier="60"/></listOfUnits></unitDefinition></listOfUnitDefinitions>';
    const species = circuit.nodes.map(item => '<species id="' + symbol(item.id) + '" name="' + xml(item.name) + '" compartment="cell" initialAmount="' +
      (item.kind === 'input' ? Circuit.inputAt(item, 0) : item.initial) + '" substanceUnits="item" hasOnlySubstanceUnits="true" boundaryCondition="' +
      (item.kind === 'input') + '" constant="false"/>').join('');

        '" stoichiometry="1" constant="true"/></listOfProducts>' + (modifiers.length ? '<listOfModifiers>' +
        modifiers.map(id => '<modifierSpeciesReference species="' + symbol(id) + '"/>').join('') + '</listOfModifiers>' : '') +
        '<kineticLaw>' + math(expression(circuit, item, true)) + '</kineticLaw></reaction>' +
        '<reaction id="death_' + sid + '" reversible="false"><listOfReactants><speciesReference species="' + sid +

  function antimony(circuit) {

      lines.push('  ' + sid + ' = ' + (item.kind === 'input' ? Circuit.inputAt(item, 0) : item.initial) + ';');
      if (item.kind === 'input') {

    const inputSet = new Set(inputs.map(item => item.id));
    const outputSet = new Set(outputs.map(item => item.id));
    const lines = ['module mesa_design(output ' + outputs.map(item => names.get(item.id)).join(', ') + ', input ' + inputs.map(item => names.get(item.id)).join(', ') + ');'];
    const internal = sorted.filter(item => !inputSet.has(item.id) && !outputSet.has(item.id));
    if (internal.length) lines.push('  wire ' + internal.map(item => names.get(item.id)).join(', ') + ';');

      else {
