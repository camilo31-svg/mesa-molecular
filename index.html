    minimum: 18, maximum: 23, target: 60, minProduct: 1, maxProduct: doc.bases.length,
    flank: 9, count: 12, hits: null, template: null };
  revealPrimerPane('primer-wizard');
}

function primerWizardMarkup(doc) {
  const wizard = primerWorkspace(doc).wizard;
  if (!wizard) return '';
  if (wizard.template !== doc.bases + ':' + doc.topology) wizard.hits = null;
  const numeric = (label, key, min, max) => field(label, input(key, wizard[key], 'type="number" min="' + min + '" max="' + max + '" required'));
  const lo = displayBase(doc, 1);
  const hi = displayBase(doc, doc.bases.length);
  return '<div class="primer-find"><form id="primer-wizard-form"><div class="toolbar primer-design-toolbar">' +
    btn('Tm parameters', 'melting-options') + btn('Reset', 'primer-design') + '<span class="toolbar-gap"></span>' +
    '<button type="submit" class="primary">Generate Primers</button></div><div class="primer-find-form">' +
    '<p>Task <b>PCR</b></p><h4>Region</h4><div class="dialog-grid">' + numeric('Start', 'first', lo, hi) +
    numeric('End', 'last', lo, hi) + '</div>' + btn('Use selection', 'primer-wizard-selection') +
    '<details class="block-gap"><summary>Show advanced</summary><div class="dialog-grid">' +
    numeric('Minimum primer length', 'minimum', 6, 40) + numeric('Maximum primer length', 'maximum', 6, 40) +
    numeric('Target Tm (°C)', 'target', 0, 100) + numeric('Flank search (bp)', 'flank', 0, 50) +
    numeric('Minimum amplicon (bp)', 'minProduct', 1, doc.bases.length) + numeric('Maximum amplicon (bp)', 'maxProduct', 1, doc.bases.length) +
    numeric('Pairs to return', 'count', 1, 30) + '</div></details>' +
    '<p class="muted small">Local candidate search near the selected boundaries. Ranked by Tm, GC and pair balance.</p></div></form>' +
    '<div id="primer-wizard-results">' + primerWizardResults(wizard) + '</div></div>';
}

function primerWizardResults(wizard) {
  if (!wizard.hits) return '';
  return wizard.hits.length ? tableView(['Forward (5′→3′)', 'Reverse (5′→3′)', 'Product', ''], wizard.hits.map((pair, i) => [
    '<code>' + pair.forward + '</code><br>' + pair.forwardTm.toFixed(1) + ' °C',
    '<code>' + pair.reverse + '</code><br>' + pair.reverseTm.toFixed(1) + ' °C',
    format(pair.length) + ' bp', btn('Use pair', 'primer-wizard-pick', attr(i)),
  ])) : '<p class="muted">No candidates meet these settings.</p>';
}

function runPrimerWizard() {
  const doc = active();
  const wizard = primerWorkspace(doc).wizard;
  const first = wizard.first - displayBase(doc, 1) + 1;
  const last = wizard.last - displayBase(doc, 1) + 1;
  if (first > last && doc.topology !== 'circular' || wizard.minimum > wizard.maximum || wizard.minProduct > wizard.maxProduct) {
    throw Error('Check the coordinates and minimum/maximum settings.');
  }
  wizard.hits = Tools.designPrimers(doc, first, last < first ? last + doc.bases.length : last, wizard.minimum, wizard.maximum, {
    flank: wizard.flank, targetTemperature: wizard.target, minProduct: wizard.minProduct, maxProduct: wizard.maxProduct,
    limit: wizard.count, temperatureOf: bases => Regions.melting(bases, ui.tmSalt, ui.tmConcentration),
  });
  wizard.template = doc.bases + ':' + doc.topology;
  byId('primer-wizard-results').innerHTML = primerWizardResults(wizard);
}

function pickWizardPair(value) {
  const doc = active();
  const state = primerWorkspace(doc);
  const pair = state.wizard.hits?.[Number(value)];
  if (!pair || state.wizard.template !== doc.bases + ':' + doc.topology) throw Error('Generate the candidates again.');
  const forward = Regions.modulo(pair.start + pair.forward.length - 2, doc.bases.length) + 1;
  const reverse = Regions.modulo(pair.end - pair.reverse.length, doc.bases.length) + 1;
  state.draft = { pair: true, strand: 1, type: 'DNA', location: doc.project + '|' + doc.folder, rows: {
    1: { ...blankPrimer(1, forward), bases: pair.forward }, '-1': { ...blankPrimer(-1, reverse), bases: pair.reverse },
  } };
  selectRange(pair.start, pair.end);
  revealPrimerPane('primer-designer');
}

document.addEventListener('input', event => {
  if (event.target.dataset.primerField) readPrimerRow(event.target);
  if (event.target.closest('#primer-wizard-form') && event.target.name) {
    primerWorkspace(active()).wizard[event.target.name] = Number(event.target.value);
  }
});
document.addEventListener('submit', event => {
  if (event.target.id !== 'primer-wizard-form') return;
  event.preventDefault();
  runAction('primer-wizard-run', '', event);
});
document.addEventListener('change', event => {
  const { id, name, value } = event.target;
  if (!['primer-design-mode', 'primer-destination'].includes(id) && !['primer-type', 'primer-strand'].includes(name)) return;
  const draft = primerWorkspace(active()).draft;
  if (id === 'primer-destination') { draft.location = value; return; }
  if (id === 'primer-design-mode') draft.pair = value === 'pair';
  else if (name === 'primer-strand') {
    const strand = Number(value);
    const row = draft.rows[draft.strand];
    const bind = Primer.binding(active(), { ...row, type: draft.type });
    const bases = Primer.normalized(row.bases);
    const tail = bases.slice(0, row.overhang);
    Object.assign(draft.rows[strand], row, { strand, bases: tail + Lab.reverseComplement(bases.slice(row.overhang), draft.type),
      position: bind ? strand > 0 ? bind.end : bind.start : row.position });
    draft.strand = strand;
  } else {
    draft.type = value;
    for (const row of Object.values(draft.rows)) row.bases = Primer.toType(Primer.normalized(row.bases), value);
  }
  renderMap();
  renderBases();
});

const primerEditorActions = {
  'primer-design': openPrimerWizard,
  'primer-wizard-run': runPrimerWizard,
  'primer-wizard-pick': pickWizardPair,
  'primer-wizard-selection': () => {
    if (!ui.selection) throw Error('Select a range first.');
    const doc = active();
    Object.assign(primerWorkspace(doc).wizard, { first: displayBase(doc, ui.selection.start), last: displayBase(doc, ui.selection.end) });
    renderMap();
    renderBases();
  },
  'primer-manual': openPrimerDesigner,
  'primer-selection-menu': (_, event) => fly(event, primerStrands.map(([value, label]) => [label, 'primer-use-selection', value])),
  'primer-use-selection': primerFromSelection,
  'primer-jump-menu': (_, event) => {
    const draft = primerWorkspace(active()).draft;
    if (draft.pair) fly(event, primerStrands.map(([value, label]) => [label, 'primer-jump', value]));
    else jumpToPrimer(draft.strand);
  },
  'primer-jump': jumpToPrimer,
  'primer-structure': primerStructureScreen,
  'primer-store': storeDesignedPrimers,
  'primer-close-tab': pane => {
    const doc = active();
    const state = primerWorkspace(doc);
    if (pane === 'primer-designer') state.draft = null;
    else if (pane === 'primer-binding-sites') state.find = null;
    else if (pane === 'primer-wizard') state.wizard = null;
    if (ui.pane === pane) ui.pane = doc.topology === 'circular' ? 'map' : 'linear';
    renderMap();
  },
};

const attachedPrimers = doc => doc.features.map((feature, index) => ({ feature, index })).filter(({ feature }) => feature.primer);

function primerForFeature(feature) {
  const { primer, ranges, strand, name, color } = feature;
  return { ...primer, name, color, strand, position: strand > 0 ? ranges.at(-1)[1] : ranges[0][0] };
}

function displayedPrimerBases(feature, first, width) {
  const { primer, ranges, strand } = feature;
  const anneal = primer.bases.slice(primer.overhang);
  const aligned = strand > 0 ? anneal : [...anneal].reverse().join('');
  let offset = 0;
  for (const [a, b] of ranges) {
    if (first >= a && first <= b) return aligned.slice(offset + first - a, offset + first - a + width);
    offset += b - a + 1;
  }
  return '';
}

function primerOligos(type) {
  return db.docs.filter(doc => doc.kind === 'sequence' && doc.subtype === 'oligo' && doc.type === type);
}

function primerOligoUsage(doc) {
  if (doc.subtype !== 'oligo') return '';
  const uses = db.docs.filter(template => template.kind === 'sequence' && template.features.some(item => item.primer?.oligo === doc.id));
  return '<div class="primer-oligo-usage"><h3>Used as primers</h3>' + (uses.length ? uses.map(template => fileButton(template)).join('') :
    '<p class="muted">No linked templates.</p>') + '</div>';
}

function primerPanelMarkup(doc, aside = false) {
  const state = primerWorkspace(doc);
  const attached = attachedPrimers(doc);
  const mode = state.panel;
  const chosen = attached.filter(({ feature }) => state.chosen.includes(feature.primer.id));
  const head = '<div class="primer-panel-head"><div class="view-tabs" role="tablist">' +
    viewTab('Primers', 'primer-panel-tab', 'primers', mode) + viewTab('Pairs', 'primer-panel-tab', 'pairs', mode) + '</div>' +
    (aside ? btn('×', 'primer-panel', 'aria-label="Close primers"') : '') + '</div>';
  const actions = canEditSequence() ? '<div class="toolbar primer-panel-actions">' +
    btn('Create primers ⌄', 'primer-create-menu') + btn('Attach existing', 'primer-find') + '</div>' : '';
  const body = mode === 'pairs' ? primerPairsMarkup(doc, chosen) : primerListMarkup(doc, attached);
  return '<section class="primer-inspector' + (aside ? ' primer-aside' : '') + '" aria-label="Primers panel">' + head + actions + body + '</section>';
}

function primerListMarkup(doc, attached) {
  if (!attached.length) return '<p class="muted">No primers attached to sequence</p>';
  const state = primerWorkspace(doc);
  return '<p class="muted small">' + attached.length + ' attached · Ctrl or Shift + click to select a pair</p><div class="primer-attachment-list">' +
    attached.map(({ feature, index }) => {
      const { primer, name, strand, ranges, color } = feature;
      const selected = state.chosen.includes(primer.id);
      const details = (strand > 0 ? 'Forward' : 'Reverse') + ' · ' + ranges.map(([a, b]) => displayBase(doc, a) + '–' + displayBase(doc, b)).join(', ');
      return '<div class="primer-attachment' + (selected ? ' chosen' : '') + '">' + btn('<span class="primer-color" style="background:' + colorOf(color) +
        '"></span><b>' + esc(name) + '</b><small>' + esc(details) + '</small>', 'primer-pick', attr(index, 'aria-pressed="' + selected + '"')) +
        (docOf(primer.oligo) ? btn('↗', 'open', attr(primer.oligo, 'aria-label="Open oligo ' + esc(name) + '"')) : '') +
        (canEditSequence() ? btn('×', 'primer-detach', attr(index, 'aria-label="Detach ' + esc(name) + '"')) : '') + '</div>';
    }).join('') + '</div>';
}

function primerPairsMarkup(doc, chosen) {
  const records = doc.primerPairs || [];
  const canLink = canEditSequence() && chosen.length === 2 && chosen[0].feature.strand !== chosen[1].feature.strand;
  return '<div class="toolbar primer-panel-actions">' + btn('Link Primers', 'primer-link', canLink ? '' : 'disabled') +
    btn('PCR virtual', 'pcr') + '</div>' + (records.length ? records.map((pair, i) => {
      const attached = pair.forwardId ? pairAttachments(doc, pair) : null;
      const product = attached && Primer.pairRegion(doc, ...attached);
      const status = product ? format(product.productLength) + ' bp' : pair.forwardId ? 'No compatible binding pair' : 'Saved PCR recipe';
      const action = pair.forwardId ? btn('Create PCR Product', 'primer-copy-product', attr(i, product ? '' : 'disabled')) :
        btn('Simular PCR', 'pcr-saved', attr(i));
      return '<article class="primer-pair-card"><b>' + esc(pair.name) + '</b><p class="muted small">' + status + '</p>' +
        '<code>' + esc(pair.forward) + '<br>' + esc(pair.reverse) + '</code><div class="toolbar">' + action +
        (canEditSequence() ? btn('Unlink…', 'primer-remove', attr(i)) : '') + '</div></article>';
    }).join('') : '<p class="muted">No linked primer pairs</p>');
}

function repaintPrimerPanel(doc) {
  const aside = document.querySelector('.primer-aside');
  if (aside) aside.outerHTML = primerPanelMarkup(doc, true);
  else if (ui.pane === 'primers') renderMap();
}

function pickPrimer(value, event) {
  const doc = active();
  const feature = doc.features[Number(value)];
  if (!feature?.primer) return;
  const state = primerWorkspace(doc);
  const id = feature.primer.id;
  if (event?.shiftKey || event?.ctrlKey || event?.metaKey) {
    const index = state.chosen.indexOf(id);
    if (index < 0) state.chosen = [...state.chosen.slice(-1), id];
    else state.chosen = state.chosen.filter(value => value !== id);
  } else state.chosen = [id];
  const picked = attachedPrimers(doc).filter(({ feature }) => state.chosen.includes(feature.primer.id)).map(({ feature }) => feature);
  if (picked.length === 2 && picked[0].strand !== picked[1].strand) {
    const pair = picked.sort((a, b) => b.strand - a.strand).map(primerForFeature);
    const product = Primer.pairRegion(doc, ...pair);
    if (product) selectRange(product.region.start, product.region.end);
    else selectAnnotation(Number(value));
  } else selectAnnotation(Number(value));
  repaintPrimerPanel(doc);
}

function pairAttachments(doc, pair) {
  const find = id => doc.features.find(feature => feature.primer?.id === id);
  const f = find(pair.forwardId);
  const r = find(pair.reverseId);
  return f && r ? [primerForFeature(f), primerForFeature(r)] : null;
}

function addPrimerLink(doc, features, name) {
  const [forward, reverse] = features.slice().sort((a, b) => b.strand - a.strand).map(item => item.primer);
  doc.primerPairs ||= [];
  doc.primerPairs.push({ name, forward: forward.bases, reverse: reverse.bases, forwardId: forward.id, reverseId: reverse.id,
    forwardType: forward.type, reverseType: reverse.type });
}

function linkPrimers() {
  const doc = active();
  if (!canEditSequence()) return;
  const state = primerWorkspace(doc);
  const chosen = attachedPrimers(doc).filter(({ feature }) => state.chosen.includes(feature.primer.id)).map(({ feature }) => feature);
  if (chosen.length !== 2 || chosen[0].strand === chosen[1].strand) throw Error('Choose a forward and a reverse primer.');
  const [forward, reverse] = chosen.slice().sort((a, b) => b.strand - a.strand);
  if (doc.primerPairs?.some(pair => pair.forwardId === forward.primer.id && pair.reverseId === reverse.primer.id)) throw Error('These primers are already linked.');
  if ((doc.primerPairs?.length || 0) >= 100) throw Error('This sequence can store up to 100 primer pairs.');
  show('Link Primers', field('Name', input('name', (forward.name + ' / ' + reverse.name).slice(0, 160), 'maxlength="160" required')), data => {
    const name = nameOf(data);
    remember(doc, 'Before linking primers');
    addPrimerLink(doc, chosen, name);
    state.panel = 'pairs';
    touch(doc);
  }, 'Link', '');
}

function detachPrimer(value) {
  const doc = active();
  const index = Number(value);
  const feature = doc.features[index];
  if (!feature?.primer || !canEditSequence()) return;
  show('Detach Primer', '<p>Detach «' + esc(feature.name) + '» and unlink its pairs from this sequence?</p>', () => {
    remember(doc, 'Before detaching primer');
    doc.features.splice(index, 1);
    const id = feature.primer.id;
    if (doc.primerPairs) doc.primerPairs = doc.primerPairs.filter(pair => pair.forwardId !== id && pair.reverseId !== id);
    const state = primerWorkspace(doc);
    state.chosen = state.chosen.filter(value => value !== id);
    touch(doc);
  }, 'Detach', '');
}

function copyPairedProduct(value) {
  const doc = active();
  const pair = doc.primerPairs?.[Number(value)];
  const primers = pair && pairAttachments(doc, pair);
  const product = primers && Primer.pairedProduct(doc, ...primers);
  if (!product) throw Error('This pair has no compatible sites on the current sequence.');
  selectRange(product.region.start, product.region.end);
  show('Create PCR Product', '<p>' + format(product.bases.length) + ' bp including 5′ overhangs</p>' +
    field('Name', input('name', (doc.name + ' · PCR').slice(0, 160), 'maxlength="160" required')) + destinationField() +
    '<label class="check-row"><input name="annotations" type="checkbox" checked> Copy annotations</label>' +
    '<label class="check-row"><input name="primers" type="checkbox" checked> Include primer annotations</label>', data => {
    const result = Primer.pairedProduct(doc, ...primers, { annotations: data.has('annotations'), primers: data.has('primers') });
    if (!result) throw Error('This pair has no compatible sites on the current sequence.');
    const [project, folder] = textOf(data, 'location').split('|');
    const { region, ...record } = result;
    commitDoc(newDoc('sequence', { ...record, name: nameOf(data), project, folder, type: 'DNA', topology: 'linear',
      description: 'Virtual PCR of ' + doc.name + ' · ' + pair.name, sourceIds: [doc.id] }));
  }, 'Copy', '');
}

function primerFindState(doc) {
  const state = primerWorkspace(doc);
  state.find ||= { mode: 'folder', type: 'DNA', location: doc.project + '|' + doc.folder, oligo: '', bases: '', name: '',
    minimum: 14, gap: 1, mismatches: 5, minTm: 48, maxTm: 100, first: displayBase(doc, 1), last: displayBase(doc, doc.bases.length),
    entire: false, unique: false, highlight: true, hits: [], picks: new Set(), searched: false, template: '' };
  return state.find;
}

function primerFindMarkup(doc) {
  const state = primerFindState(doc);
  if (state.searched && state.template !== doc.bases + ':' + doc.topology) {
    state.hits = [];
    state.picks.clear();
    state.searched = false;
  }
  const byFolder = state.mode === 'folder';
  const source = byFolder ? field('Use oligos in', select('location', destinations(), state.location)) : state.mode === 'saved' ?
    field('Saved oligo', select('oligo', [['', 'Choose an oligo'], ...primerOligos(state.type).map(item => [item.id, item.name])], state.oligo)) :
    field('Name', input('name', state.name, 'maxlength="160" placeholder="Oligo name"')) +
    field('Bases', area('bases', state.bases, 'rows="2" maxlength="350" class="mono" spellcheck="false"'));
  const numeric = (label, key, min, max) => field(label, input(key, state[key], 'type="number" min="' + min + '" max="' + max + '" required'));
  const checked = (key, label) => '<label class="check-row"><input type="checkbox" name="' + key + '"' + (state[key] ? ' checked' : '') + '> ' + label + '</label>';
  return '<div class="primer-find"><div class="toolbar primer-design-toolbar">' + checked('highlight', 'Highlight matching bases') +
    '<span class="toolbar-gap"></span>' + btn('Attach Selected Primers', 'primer-attach', 'class="primary" id="primer-attach-picked"' +
      (state.picks.size && canEditSequence() ? '' : ' disabled')) + '</div><form id="primer-find-form" class="primer-find-form">' +
    field('Find binding sites', select('mode', [['folder', 'For all oligos in specified folders'], ['saved', 'For a single saved oligo'],
      ['raw', 'For arbitrary bases you provide']], state.mode)) +
    field('Nucleotide type', select('type', [['DNA', 'DNA'], ['RNA', 'RNA']], state.type)) + source +
    '<div class="dialog-grid">' + numeric('Minimum matching bases', 'minimum', 6, 200) + numeric('Maximum consecutive mismatches', 'gap', 0, 10) +
    numeric('Maximum total mismatches', 'mismatches', 0, 20) + (state.type === 'DNA' ? numeric('Minimum Tm (°C)', 'minTm', -100, 150) +
      numeric('Maximum Tm (°C)', 'maxTm', -100, 150) : '') + '</div>' +
    checked('entire', 'Entire primer matches') + checked('unique', 'Matches exactly once') +
    '<div class="dialog-grid">' + numeric('3′ position from', 'first', displayBase(doc, 1), displayBase(doc, doc.bases.length)) +
    numeric('3′ position to', 'last', displayBase(doc, 1), displayBase(doc, doc.bases.length)) + '</div><div class="toolbar">' +
    btn('Use selection', 'primer-find-selection') + '<button type="submit" class="primary">Find binding sites</button>' +
    btn('Tm parameters', 'melting-options') + '</div><p class="muted small">The 3′ terminal base must match. DNA Tm uses the annealing segment in a perfect-match model.</p>' +
    '</form><div id="primer-find-results">' + primerFindResults(doc, state) + '</div></div>';
}

function primerFindResults(doc, state) {
  if (!state.searched) return '';
  if (!state.hits.length) return '<p class="muted">No binding sites meet these settings.</p>';
  return tableView(['Attach', 'Oligo', 'Strand', '3′ Location', 'Match', 'Tm'], state.hits.map((item, i) => [
    '<input type="checkbox" data-primer-hit="' + i + '" aria-label="Select site ' + (i + 1) + '"' + (state.picks.has(i) ? ' checked' : '') + '>',
    btn(esc(item.name), 'primer-find-preview', attr(i)), item.strand > 0 ? 'Forward' : 'Reverse', displayBase(doc, item.position),
    item.count + ' / ' + item.anneal, item.temperature === null ? '—' : item.temperature.toFixed(1) + ' °C',
  ]));
}

function updateFindDraft(target) {
  const state = primerFindState(active());
  if (target.name === 'highlight') { state.highlight = target.checked; return; }
  if (!Object.hasOwn(state, target.name)) return;
  state[target.name] = target.type === 'number' ? Number(target.value) : target.type === 'checkbox' ? target.checked : target.value;
}

function searchBindingSites() {
  const doc = active();
  const state = primerFindState(doc);
  if (state.first > state.last && doc.topology !== 'circular' || state.minTm > state.maxTm) throw Error('Check the coordinate or Tm range.');
  let sources;
  if (state.mode === 'raw') {
    const bases = Primer.normalized(state.bases);
    if (!Primer.alphabet(state.type).test(bases) || bases.length < 6 || bases.length > 200) throw Error('Enter 6–200 unambiguous primer bases.');
    sources = [{ name: state.name.trim() || 'Primer', type: state.type, bases }];
  } else if (state.mode === 'saved') {
    const item = primerOligos(state.type).find(item => item.id === state.oligo);
    if (!item) throw Error('Choose a saved oligo.');
    sources = [{ name: item.name, type: item.type, bases: item.bases, oligo: item.id }];
  } else {
    const [project, folder] = state.location.split('|');
    const inside = item => {
      if (item.project !== project) return false;
      if (!folder) return true;
      for (let id = item.folder; id; id = folderOf(id)?.parent) if (id === folder) return true;
      return false;
    };
    sources = primerOligos(state.type).filter(inside).map(item => ({ name: item.name, type: item.type, bases: item.bases, oligo: item.id }));
  }
  if (doc.bases.length * sources.length > 5_000_000) throw Error('Choose fewer oligos or a smaller template.');
  const options = { ...state, first: state.first - displayBase(doc, 1) + 1, last: state.last - displayBase(doc, 1) + 1,
    salt: ui.tmSalt, concentration: ui.tmConcentration };
  const hits = [];
  for (const source of sources) {
    hits.push(...Primer.search(doc, source, options));
    if (hits.length > 1000) throw Error('More than 1,000 sites match. Narrow the search.');
  }
  state.hits = hits.sort((a, b) => b.count - a.count || a.position - b.position);
  state.picks.clear();
  state.searched = true;
  state.template = doc.bases + ':' + doc.topology;
  byId('primer-find-results').innerHTML = primerFindResults(doc, state);
  byId('primer-attach-picked').disabled = true;
}

function attachFoundPrimers() {
  const doc = active();
  if (!canEditSequence()) return;
  const state = primerFindState(doc);
  if (state.template !== doc.bases + ':' + doc.topology) throw Error('Run the search again after editing the sequence.');
  const newOligos = new Map();
  const features = [];
  for (const index of state.picks) {
    const hit = state.hits[index];
    const bind = Primer.binding(doc, hit);
    if (!bind) continue;
    const row = { ...hit, color: hit.strand > 0 ? '#a2c8ef' : '#bfade7' };
    const key = hit.type + ':' + hit.bases + ':' + hit.name;
    let oligo = hit.oligo ? docOf(hit.oligo) : newOligos.get(key);
    if (hit.oligo && (!oligo || oligo.bases !== hit.bases || oligo.type !== hit.type)) throw Error('A selected oligo changed. Run the search again.');
    if (oligo && doc.features.some(item => item.primer?.oligo === oligo.id && item.strand === row.strand &&
      JSON.stringify(item.ranges) === JSON.stringify(bind.ranges))) continue;
    if (!oligo) {
      oligo = makePrimerOligo(doc, row, doc.project, doc.folder);
      newOligos.set(key, oligo);
    }
    features.push(makePrimerFeature(row, bind, oligo));
  }
  if (!features.length) throw Error('These binding sites are already attached.');
  if (doc.features.length + features.length > 2000) throw Error('This sequence has too many features.');
  remember(doc, 'Before attaching oligos');
  db.docs.push(...newOligos.values());
  doc.features.push(...features);
  state.picks.clear();
  ui.primerOpen = true;
  primerWorkspace(doc).panel = 'primers';
  ui.pane = doc.topology === 'circular' ? 'map' : 'linear';
  touch(doc, render);
  toast(features.length + ' primer binding site(s) attached.');
}

document.addEventListener('input', event => {
  if (event.target.closest('#primer-find-form')) updateFindDraft(event.target);
});
document.addEventListener('change', event => {
  const target = event.target;
  if (target.closest('#primer-find-form') && ['mode', 'type'].includes(target.name)) {
    updateFindDraft(target);
    renderMap();
  }
  if (target.name === 'highlight' && target.closest('.primer-find')) updateFindDraft(target);
  if (target.dataset.primerHit !== undefined && target.closest('#primer-find-results')) {
    const state = primerFindState(active());
    const id = Number(target.dataset.primerHit);
    if (target.checked) state.picks.add(id);
    else state.picks.delete(id);
    byId('primer-attach-picked').disabled = !state.picks.size || !canEditSequence();
  }
});
document.addEventListener('submit', event => {
  if (event.target.id !== 'primer-find-form') return;
  event.preventDefault();
  runAction('primer-find-run', '', event);
});

const primerPanelActions = {
  'primer-panel': () => { ui.primerOpen = !ui.primerOpen; if (ui.primerOpen) { ui.enzymeOpen = false; ui.annotationOpen = false; } renderEditor(); },
  'primer-panel-tab': value => { primerWorkspace(active()).panel = value; repaintPrimerPanel(active()); },
  'primer-create-menu': (_, event) => fly(event, [['Manual', 'primer-manual'], ['Wizard', 'primer-design']]),
  'primer-pick': pickPrimer,
  'primer-link': linkPrimers,
  'primer-detach': detachPrimer,
  'primer-copy-product': copyPairedProduct,
  'primer-find': () => { primerFindState(active()); revealPrimerPane('primer-binding-sites'); },
  'primer-find-run': searchBindingSites,
  'primer-find-selection': () => {
    if (!ui.selection) throw Error('Select a range first.');
    const doc = active();
    Object.assign(primerFindState(doc), { first: displayBase(doc, ui.selection.start), last: displayBase(doc, ui.selection.end) });
    renderMap();
  },
  'primer-find-preview': value => {
    const doc = active();
    const state = primerFindState(doc);
    const hit = state.hits[Number(value)];
    const region = hit && Primer.binding(doc, hit);
    if (region && state.highlight) selectRange(region.start, region.end);
  },
  'primer-attach': attachFoundPrimers,
};

const SequenceLayout = (() => {
  function compactTracks(tracks, offset, length) {
    const visible = tracks.filter(({feature})=>feature.ranges.some(([a,b])=>b>offset&&a<=offset+length));
    const lanes = [...new Set(visible.map(item=>item.lane))].sort((a,b)=>a-b);
    const positions = new Map(), tops=new Map(); let height=0;
    lanes.forEach((lane,i)=>{positions.set(lane,i);tops.set(lane,height);height+=Math.max(...visible.filter(item=>item.lane===lane).map(item=>item.height||16));});
    return { tracks:visible.map(item=>({...item,lane:positions.get(item.lane),top:tops.get(item.lane)})), depth:lanes.length,height };
  }
  function cutLabels(sites, offset, length, character) {
    const ends=[], width=length*character;
    const labels=sites.map(site=>{
      const x=(site.cut-offset)*character, labelWidth=Math.min(width,site.name.length*6.7+3);
      const label=Math.max(0,Math.min(x+2,width-labelWidth));
      let tier=ends.findIndex(end=>label>=end+5);
      if(tier<0)tier=ends.length;
      ends[tier]=label+labelWidth;
      return {site,x,label,tier,labelWidth};
    });
    return {labels,height:labels.length?ends.length*16+12:12};
  }
  function rows({length,step,groups,cuts,character,lineHeight,primerHeight,complement,indices,enzymes}) {
    const count=Math.ceil(length/step), events=Array.from({length:count+1},()=>[]);
    for(let group=0;group<groups.length;group++) for(const {feature,lane} of groups[group]) for(const [a,b] of feature.ranges) {
      const first=Math.max(0,Math.floor((a-1)/step)), last=Math.min(count,Math.floor((b-1)/step)+1);
      events[first].push([group,lane,1]); events[last].push([group,lane,-1]);
    }
    const active=groups.map(()=>new Map()), result=[], laneHeights=groups.map(group=>{
      const heights=new Map();for(const item of group)heights.set(item.lane,Math.max(heights.get(item.lane)||0,item.height||16));return heights;
    });
    let top=0,cutIndex=0;
    for(let row=0;row<count;row++) {
      for(const [group,lane,delta] of events[row]) {
        const next=(active[group].get(lane)||0)+delta;
        if(next)active[group].set(lane,next);else active[group].delete(lane);
      }
      const offset=row*step, size=Math.min(step,length-offset), sites=[];
      while(cutIndex<cuts.length&&cuts[cutIndex].cut<offset+size) {
        if(cuts[cutIndex].cut>=offset)sites.push(cuts[cutIndex]); cutIndex++;
      }
      const cut=enzymes?cutLabels(sites,offset,size,character):{labels:[],height:7};
      const depths=active.map(group=>group.size);
      const featureHeight=[...active[2].keys()].reduce((sum,lane)=>sum+laneHeights[2].get(lane),0);
      const height=cut.height+lineHeight*(complement?2:1)+(indices?18:0)+depths[0]*primerHeight+depths[1]*primerHeight+
        (depths[0]?3:0)+(depths[1]?3:0)+(depths[2]?featureHeight+4:0)+24;
      result.push({top,height,cut,depths}); top+=height;
    }
    return {rows:result,height:top};
  }
  function at(rows,offset) {
    let low=0,high=rows.length;
    while(low<high){const mid=(low+high)>>>1;if(rows[mid].top+rows[mid].height<=offset)low=mid+1;else high=mid;}
    return Math.max(0,Math.min(rows.length-1,low));
  }
  return {rows,at,compactTracks,cutLabels};
})();

// Coordinates stay 1-based and inclusive; SVG geometry uses boundaries between bases.
function featureEnds(feature, from, to) {
  const first = feature.ranges[0][0], last = feature.ranges.at(-1)[1];
  return { head: feature.strand < 0 ? from === first : to === last,
    continuesLeft: from !== first, continuesRight: to !== last };
}

function featureShape(feature, from, to, width, { primer = false } = {}) {
  const { head, continuesLeft, continuesRight } = featureEnds(feature, from, to);
  const w = Math.max(1, width), tip = Math.min(7, w / 2), notch = Math.min(3, w / 4);
  let left = 'L0 13L0 0', right = 'L' + w + ' 0L' + w + ' 13';
  if (feature.strand < 0 && head) left = 'L' + tip + ' 13L0 6.5L' + tip + ' 0';
  else if (continuesLeft) left = 'L0 13L' + notch + ' 9.5L0 6.5L' + notch + ' 3L0 0';
  if (feature.strand > 0 && head) right = 'L' + (w-tip) + ' 0L' + w + ' 6.5L' + (w-tip) + ' 13';
  else if (continuesRight) right = 'L' + w + ' 0L' + (w-notch) + ' 3L' + w + ' 6.5L' + (w-notch) + ' 9.5L' + w + ' 13';
  const direction = !head && w>14 ? '<path class="feature-continuation" d="' + (feature.strand<0?'M9 3L6 6.5L9 10M5 3L2 6.5L5 10':'M'+(w-9)+' 3L'+(w-6)+' 6.5L'+(w-9)+' 10M'+(w-5)+' 3L'+(w-2)+' 6.5L'+(w-5)+' 10') + '" fill="none" stroke="var(--feature-ink,#252a32)" stroke-width=".8"/>' : '';
  return '<svg class="feature-shape" viewBox="0 0 ' + w + ' 13" preserveAspectRatio="none" aria-hidden="true"><path d="M' + (w/2) + ' 0' + right +
    'L' + (w/2) + ' 13' + left + 'Z" fill="' + colorOf(feature.color) + '"' + (primer ? ' fill-opacity=".22"' : '') +
    ' stroke="' + colorOf(feature.color) + '" stroke-width="1"' + (feature.draft ? ' stroke-dasharray="4 3"' : '') + '/>' + direction + '</svg>';
}

function orfSequenceShape(feature, from, to, width) {
  const w=Math.max(1,width), char=seqView.character, color=colorOf(feature.color), starts=feature.orf?.starts||[];
  const shapes=['<path d="M0 6.5H'+w+'" stroke="'+color+'" stroke-width="1.3"/>'];
  for(const start of starts) {
    const center=start+(feature.strand>0?1:-1);
    const coordinate=Regions.modulo(center-1,active().bases.length)+1;
    if(coordinate<from||coordinate>to)continue;
    const x=(coordinate-from+.5)*char, d=feature.strand>0?1:-1;
    shapes.push('<path d="M'+(x-d*5)+' 2L'+(x+d*3)+' 6.5L'+(x-d*5)+' 11Z" fill="'+color+'"/>');
  }
  const ends=featureEnds(feature,from,to);
  if(ends.head) {
    const x=feature.strand>0?w-1:1;
    shapes.push('<path d="M'+x+' 1V12" stroke="'+color+'" stroke-width="'+(feature.orf?.stopped?2:1)+'"'+(feature.orf?.stopped?'':' stroke-dasharray="2 2"')+'/>');
  }
  return '<svg class="feature-shape orf-line" viewBox="0 0 '+w+' 13" preserveAspectRatio="none" aria-hidden="true">'+shapes.join('')+'</svg>';
}

function draftPrimerFeatures(doc) {
  const draft = primerViews.get(primerWorkspaceKey(doc))?.draft;
  if (!draft || !ui.visibility.primers) return [];
  return primerDraftRows(draft).flatMap(row => {
    const bind = Primer.binding(doc, { ...row, type: draft.type });
    return bind ? [{ index: null, feature: { name: row.name || (row.strand > 0 ? 'Forward' : 'Reverse') + ' · preview',
      kind: 'primer_bind', strand: row.strand, ranges: bind.ranges, color: row.color, draft: true,
      primer: { bases: Primer.normalized(row.bases), overhang: row.overhang, type: draft.type } } }] : [];
  });
}

function sequenceTrackAttrs(item) {
  if (item.index !== null) return attr(item.index);
  if (item.feature.draft) return 'data-value="' + item.feature.strand + '"';
  return 'data-value="' + item.feature.orfIndex + '"';
}
const sequenceTrackAction = item => item.index !== null ? 'select-feature' : item.feature.draft ? 'primer-jump' : 'select-orf';

function primerBaseCells(doc, feature, from, length) {
  const bases = feature.primer ? displayedPrimerBases(feature, from, length) :
    (feature.strand < 0 ? Lab.complement(doc.bases.slice(from-1, from-1+length), doc.type) : doc.bases.slice(from-1, from-1+length));
  return '<span class="primer-map-bases">' + [...bases].map((base, i) => {
    const reference = doc.bases[from+i-1];
    const expected = feature.strand < 0 ? Lab.complement(reference, doc.type) : reference;
    const mismatch = base.replace('U','T') !== expected.replace('U','T');
    return '<span' + (mismatch ? ' class="primer-map-mismatch" title="Mismatch at ' + displayBase(doc, from+i) + '"' : '') + '>' + esc(base) + '</span>';
  }).join('') + '</span>';
}

function primerSequenceTrack(doc, offset, length, strand, layout) {
  const {tracks,depth}=layout;
  if (!depth) return '';
  const height = seqView.primerHeight;
  return '<div class="primer-sequence-tracks" aria-label="' + (strand > 0 ? 'Forward' : 'Reverse') + ' primers" style="height:' + (depth * height + 3) + 'px">' + tracks.flatMap(item =>
    item.feature.ranges.flatMap(([a,b]) => {
      const from = Math.max(a, offset+1), to = Math.min(b, offset+length), f = item.feature;
      if (from > to) return [];
      const { head } = featureEnds(f, from, to), tailAt = strand > 0 ? f.ranges[0][0] : f.ranges.at(-1)[1];
      const tail = f.primer?.bases.slice(0, f.primer.overhang) || '';
      const tailHere = tail && tailAt >= from && tailAt <= to;
      const title = f.name + ' · ' + (strand > 0 ? '5′ → 3′' : '3′ ← 5′') + ' · ' + f.ranges.map(([x,y])=>displayBase(doc,x)+'–'+displayBase(doc,y)).join(', ') +
        (tail ? ' · 5′ overhang: ' + tail : '') + (f.draft ? ' · unsaved' : '');
      return [btn(featureShape(f, from, to, (to-from+1)*seqView.character, { primer: true }) + '<span class="primer-map-label">' + esc(f.name) + '</span>' +
        (ui.visibility.primerBases ? primerBaseCells(doc, f, from, to-from+1) : '') +
        (tailHere ? '<span class="primer-map-tail ' + (strand > 0 ? 'tail-left' : 'tail-right') + '" title="5′ overhang · ' + esc(tail) + '">5′ ' + esc(tail.length <= 12 ? tail : tail.slice(0,9)+'…') + '</span>' : ''),
        sequenceTrackAction(item), sequenceTrackAttrs(item) + ' class="primer-map-track' + (f.draft ? ' primer-map-draft' : '') + '" title="' + esc(title) +
        '" aria-label="' + esc(title) + '" data-feature-start="' + from + '" data-feature-end="' + to + '" data-strand="' + strand + '" data-head="' + head +
        '" style="left:calc(var(--base-width) * ' + (from-offset-1) + ');top:' + (item.lane * height) + 'px;width:calc(var(--base-width) * ' + (to-from+1) + ');height:' + height + 'px"')];
    })).join('') + '</div>';
}

const selectedRegion = () => ui.selection || Regions.positions(1, active().bases.length, active().bases.length, false);
const displayBase = (doc, position) => position + (doc.startIndex || 1) - 1;
const seqView = { body: null, step: 50, pitch: 140, total: 0, first: -1, last: -1, scrollBase: 1 };
let drag = null;
let dragFrame = 0;
let richSequenceClipboard;
const sequenceTabs = new Map();
const sequenceViewKeys = ['pane', 'selection', 'anchor', 'head', 'caret', 'scrollBase', 'selectionSource', 'rotationBases',
  'plasmidZoom', 'linearZoom', 'find', 'showFind', 'enzymeMode', 'enzymeScope', 'enzymeQuery', 'selectedEnzymes', 'focusEnzyme',
  'showCompatible', 'enzymeList', 'digestInspector', 'annotationOpen', 'annotationTab', 'annotationQuery', 'annotationExpanded', 'hiddenAnnotations', 'hiddenAnnotationKinds',
  'annotationGridOpen', 'annotationGridScope', 'annotationGridPicks', 'annotationGridQuery', 'annotationGridRegion', 'annotationGridSort', 'annotationGridDirection','orfLayers','plasmidPan','linearPanY','biochem','biochemOpen','mobileView','mobileDrawer'];

function resetSequenceView() {
  Object.assign(ui, { selection: null, anchor: null, head: null, caret: null, scrollBase: 1, selectionSource: 'sequence' });
}

function saveSequenceTab(doc) {
  if (doc?.kind !== 'sequence') return;
  sequenceTabs.delete(doc.id);
  sequenceTabs.set(doc.id, { bases: doc.bases, topology: doc.topology, view: Object.fromEntries(sequenceViewKeys.map(key => [key, ui[key]])) });
  if (sequenceTabs.size > 30) sequenceTabs.delete(sequenceTabs.keys().next().value);
}

function openSequenceTab(doc) {
  resetSequenceView();
  Object.assign(ui, { pane: doc.topology === 'linear' ? 'linear' : 'map', rotationBases: 0,
    orfLayers:{sequence:false,linear:false,circular:false},plasmidPan:{x:0,y:0},linearPanY:0,biochem:null,biochemOpen:false,mobileView:'sequence',mobileDrawer:false,
    plasmidZoom: 0, linearZoom: 0, find: '', showFind: false,
    enzymeMode: 'two', enzymeScope: 'any', enzymeQuery: '', selectedEnzymes: [], focusEnzyme: '', showCompatible: false,
    enzymeList: 'commercial', digestInspector: 'new', annotationOpen: false, annotationTab: 'annotations', annotationQuery: '', annotationExpanded: [], hiddenAnnotations: [], hiddenAnnotationKinds: [],
    annotationGridOpen: false, annotationGridPicks: [], annotationGridScope: 'annotations', annotationGridQuery: '', annotationGridRegion: null, annotationGridSort: 'start', annotationGridDirection: 1 });
  const cached = sequenceTabs.get(doc.id);
  if (cached && cached.bases === doc.bases && cached.topology === doc.topology) Object.assign(ui, cached.view);
}

function configureSequenceViewport() {
  const body = byId('bases');
  const doc = active();
  if (!body || doc?.kind !== 'sequence') return;
  body.style.fontSize = ui.zoom + 'px';
  const measure = document.createElement('span');
  measure.className = 'character-measure';
  measure.textContent = '0';
  measure.style.width = '1ch';
  body.append(measure);
  const character = Math.max(4, measure.getBoundingClientRect().width);
  measure.remove();
  body.style.setProperty('--base-width', character + 'px');
  const step = Math.max(8, Math.min(160, Math.floor((body.clientWidth - 20) / character)));
  const allFeatures = mapFeatures(doc);
  const tracks = featureTracks(allFeatures.filter(({feature})=>feature.kind!=='primer_bind')).map(item=>({...item,height:item.feature.kind==='CDS'||item.feature.kind==='ORF'&&ui.orfOptions?.amino?30:16}));
  const forwardPrimers = featureTracks(allFeatures.filter(({feature})=>feature.kind==='primer_bind'&&feature.strand>0));
  const reversePrimers = featureTracks(allFeatures.filter(({feature})=>feature.kind==='primer_bind'&&feature.strand<0));
  const forwardPrimerLanes = Math.max(0,...forwardPrimers.map(item=>item.lane+1)), reversePrimerLanes = Math.max(0,...reversePrimers.map(item=>item.lane+1));
  const lineHeight=Math.max(19,Math.ceil(ui.zoom*1.35));
  const hasTails=allFeatures.some(({feature})=>feature.primer?.overhang);
  const primerHeight=14+(ui.visibility.primerBases?lineHeight:0)+(hasTails?14:0)+4;
  body.style.setProperty('--base-line-height',lineHeight+'px');
  body.style.setProperty('--sequence-font-size',ui.zoom+'px');
  body.style.setProperty('--primer-tail-top',(14+(ui.visibility.primerBases?lineHeight:0))+'px');
  const base = seqView.body === body && seqView.rows?.length ? SequenceLayout.at(seqView.rows,body.scrollTop) * seqView.step + 1 : ui.scrollBase || 1;
  const total = Math.ceil(doc.bases.length / step);
  const cuts=ui.visibility.enzymes&&doc.type==='DNA'?sequenceCuts(doc):[];
  const layout=SequenceLayout.rows({length:doc.bases.length,step,groups:[forwardPrimers,reversePrimers,tracks],cuts,character,lineHeight,primerHeight,
    complement:ui.visibility.complement&&doc.type!=='AA',indices:ui.visibility.indices,enzymes:ui.visibility.enzymes&&doc.type==='DNA'});
  Object.assign(seqView, { body, step, total, first: -1, last: -1, character, featureTracks: tracks,
    forwardPrimers,reversePrimers,forwardPrimerLanes,reversePrimerLanes,primerHeight,rows:layout.rows });
  body.innerHTML = '<div class="sequence-spacer"><div id="sequence-window"></div></div>';
  body.firstElementChild.style.height = (layout.height + 12) + 'px';
  body.scrollTop = layout.rows[Math.min(total-1,Math.floor((base-1)/step))].top;
  body.onscroll = () => {
    ui.scrollBase = SequenceLayout.at(seqView.rows,body.scrollTop) * seqView.step + 1;
    drawVisibleBases();
  };
  drawVisibleBases();
}

function drawVisibleBases() {
  const doc = active();
  const { body, step, total } = seqView;
  const target = byId('sequence-window');
  if (!target || !body?.isConnected || doc?.kind !== 'sequence') return;
  const first = Math.max(0, SequenceLayout.at(seqView.rows,body.scrollTop) - 2);
  const last = Math.min(total, SequenceLayout.at(seqView.rows,body.scrollTop+body.clientHeight) + 4);
  if (first === seqView.first && last === seqView.last) return;
  Object.assign(seqView, { first, last });
  target.style.top = seqView.rows[first].top + 8 + 'px';
  const search = ui.find.replace(/\s/g, '').toUpperCase();
  const matches = new Set();
  if (search) {
    const text = doc.topology === 'circular' ? doc.bases + doc.bases.slice(0, search.length - 1) : doc.bases;
    for (let index = text.indexOf(search, Math.max(0, first * step - search.length + 1)); index >= 0 && index < last * step && index < doc.bases.length;
      index = text.indexOf(search, index + 1)) {
      for (let i = index; i < index + search.length; i++) matches.add(i % doc.bases.length);
    }
    if (first === 0 && doc.topology === 'circular') {
      for (let index = text.indexOf(search, Math.max(0, doc.bases.length - search.length + 1));
        index >= 0 && index < doc.bases.length; index = text.indexOf(search, index + 1)) {
        for (let i = doc.bases.length; i < index + search.length; i++) matches.add(i % doc.bases.length);
      }
    }
  }
  const rows = [];
  for (let line = first; line < last; line++) {
    const offset = line * step;
    const bases = doc.bases.slice(offset, offset + step);
    const layout=seqView.rows[line];
    const features=SequenceLayout.compactTracks(seqView.featureTracks,offset,bases.length);
    const forward=SequenceLayout.compactTracks(seqView.forwardPrimers,offset,bases.length);
    const reversePrimers=SequenceLayout.compactTracks(seqView.reversePrimers,offset,bases.length);
    const glyphs = (sequence, complement) => [...sequence].map((base, i) => {
      const position = offset + i + 1;
      const text = baseAtCase(doc, base, position);
      return '<span class="base' + (matches.has(position - 1) ? ' match' : '') +
        '" data-base="' + position + '" title="' + displayBase(doc, position) + ' · ' + text + '"' +
        (complement ? ' aria-hidden="true"' : '') + '>' + text + '</span>';
    }).join('');
    const direct = '<div class="base-line">' + glyphs(bases, false) + '</div>';
    const reverse = ui.visibility.complement && doc.type !== 'AA' ? '<div class="base-line complement">' + glyphs(Lab.complement(bases, doc.type), true) + '</div>' : '';
    const ticks = ui.visibility.indices ? '<div class="sequence-ticks">' + [...bases].map((_, i) => {
      const pos = offset + i + 1;
      const index = displayBase(doc, pos);
      return index % 5 === 0 || pos === doc.bases.length ? '<span class="tick mark"><span>' + index + '</span></span>' : '<span class="tick"></span>';
    }).join('') + '</div>' : '';
    rows.push('<div class="sequence-row" data-row-start="' + offset + '" data-row-length="' + bases.length + '" style="width:' +
      'calc(var(--base-width) * ' + bases.length + ');height:' + layout.height + 'px">' +
      '<div class="selection-layer"></div>' + cutTrack(layout.cut) +
      primerSequenceTrack(doc,offset,bases.length,1,forward) + direct + reverse + primerSequenceTrack(doc,offset,bases.length,-1,reversePrimers) + ticks + featureTrack(doc, offset, bases.length,features) + '</div>');
  }
  target.innerHTML = rows.join('');
  paintSequenceSelection();
}

function baseAtCase(doc, letter, position) {
  return doc.lowercase?.some(([a, b]) => position >= a && position <= b) ? letter.toLowerCase() : letter;
}

function paintSequenceSelection() {
  const doc = active();
  if (!byId('bases') || doc?.kind !== 'sequence') return;
  const ranges = ui.selection?.ranges || [];
  const from = ui.selection?.start - 1;
  const to = ui.selection?.end;
  for (const row of byId('bases').querySelectorAll('.sequence-row')) {
    const start = Number(row.dataset.rowStart);
    const end = start + Number(row.dataset.rowLength);
    const layer = row.firstElementChild;
    const markup = [];
    for (const [a, b] of ranges) {
      const low = Math.max(a - 1, start);
      const high = Math.min(b, end);
      if (high > low) markup.push('<span class="selected-band" style="left:calc(var(--base-width) * ' + (low - start) + ');width:calc(var(--base-width) * ' + (high - low) + ')"></span>');
    }
    const markers = ui.selection ? [[from, 'start'], [to, 'end']] : [[ui.caret, 'caret']];
    for (const [boundary, type] of markers) {
      if (boundary === null || boundary === undefined || !Number.isFinite(boundary)) continue;
      const inRow = type === 'end' ? boundary > start && boundary <= end :
        boundary >= start && (boundary < end || boundary === doc.bases.length && boundary === end);
      if (inRow) markup.push('<span class="selection-handle ' + type + '" style="left:calc(var(--base-width) * ' + (boundary - start) + ')"></span>');
    }
    layer.innerHTML = markup.join('');
  }
}

function revealBase(position, center = false) {
  const body = byId('bases');
  if (!body || body !== seqView.body) return;
  const row = Math.floor((Regions.clamp(position, 1, active().bases.length) - 1) / seqView.step);
  const top = seqView.rows[row].top;
  if (center || top < body.scrollTop || top + 90 > body.scrollTop + body.clientHeight) {
    body.scrollTop = Math.max(0, center ? top - body.clientHeight / 3 : top - 4);
    ui.scrollBase = SequenceLayout.at(seqView.rows,body.scrollTop) * seqView.step + 1;
    drawVisibleBases();
  }
}

function updateSequenceSelection(reveal, focus = false) {
  const body = byId('bases');
  if (!body) return;
  if (Number.isFinite(reveal)) revealBase(reveal);
  if (focus) body.focus({ preventScroll: true });
  for (const button of byId('editor').querySelectorAll('.sequence-primary')) button.disabled = !ui.selection;
  const primerUse = document.querySelector('[data-primer-use-selection]');
  if (primerUse) primerUse.disabled = !ui.selection;
  paintSequenceSelection();
  paintMapSelection();
  renderStatus();
  if (!drag && ui.annotationOpen) refreshAnnotationInspector();
  if (!drag && ui.pane==='biochemical') refreshBiochemical();
  if (!drag && ui.enzymeScope && ui.enzymeScope !== 'any') refreshScopedCuts();
}

function refreshScopedCuts() {
  if (!ui.enzymeScope || ui.enzymeScope === 'any') return;
  seqView.first = -1;
  drawVisibleBases();
  refreshMapGraphic();
  refreshEnzymeInspector();
}

function selectRange(start, end = start, options = {}) {
  const length = active().bases.length;
  const circular = active().topology === 'circular';
  ui.selection = Regions.positions(start, end, length, options.wrap !== false && circular);
  ui.anchor = ui.selection.start - 1;
  ui.head = ui.selection.end + (ui.selection.start > ui.selection.end ? length : 0);
  ui.caret = null;
  ui.selectionSource = options.source || 'sequence';
  updateSequenceSelection(options.reveal ?? start, options.focus && !dialog.open);
  if (options.focus && dialog.open) dialog.addEventListener('close', () => byId('bases')?.focus({ preventScroll: true }), { once: true });
}

function selectAnnotation(index) {
  const feature = active().features[Number(index)];
  if (!feature) return;
  ui.selection = Regions.fromRanges(feature.ranges);
  ui.anchor = ui.selection.start - 1;
  ui.head = ui.anchor + ui.selection.length;
  ui.caret = null;
  ui.selectionSource = 'sequence';
  updateSequenceSelection(ui.selection.start);
}

function setCaret(boundary, surface = 'sequence', reveal = false) {
  const length = active().bases.length;
  ui.caret = Regions.clamp(boundary, 0, length);
  ui.anchor = ui.caret;
  ui.head = ui.caret;
  ui.selection = null;
  ui.selectionSource = surface;
  updateSequenceSelection(reveal ? ui.caret + 1 : undefined);
}

function setBoundaries(anchor, head, surface, circular, reveal) {
  const length = active().bases.length;
  ui.anchor = anchor;
  ui.head = head;
  ui.selection = Regions.boundaries(anchor, head, length, circular);
  ui.caret = ui.selection ? null : circular ? Regions.modulo(head, length) : head;
  ui.selectionSource = surface;
  updateSequenceSelection(reveal);
}

function relativePoint(svg, x, y) {
  const matrix = svg.getScreenCTM();
  return matrix ? new DOMPoint(x, y).matrixTransform(matrix.inverse()) : null;
}

function sequenceBoundary(x, y, allowOutside) {
  const body = byId('bases');
  if (!body) return null;
  const nodes = [...body.querySelectorAll('.sequence-row')];
  const surface = body.getBoundingClientRect();
  if (!allowOutside && (x < surface.left || x > surface.right || y < surface.top || y > surface.bottom)) return null;
  const row = nodes.map(node => ({ node, rect: node.getBoundingClientRect() }))
    .filter(item => item.rect.bottom >= surface.top && item.rect.top <= surface.bottom)
    .reduce((nearest, item) => {
      const distance = Math.max(item.rect.top - y, 0, y - item.rect.bottom);
      return !nearest || nearest.distance > distance ? { ...item, distance } : nearest;
    }, null);
  if (!row) return null;
  const length = Number(row.node.dataset.rowLength);
  const inside = Math.round((x - row.rect.left) / (row.rect.width / length));
  return Number(row.node.dataset.rowStart) + Regions.clamp(inside, 0, length);
}

function hitSurface(target, x, y, previous) {
  const svg = previous?.svg || target.closest?.('svg[data-sequence-map]');
  if (svg) {
    const point = relativePoint(svg, x, y);
    if (!point) return null;
    const length = active().bases.length;
    if (svg.dataset.sequenceMap === 'linear') {
      const [left, width] = [Number(svg.dataset.trackLeft), Number(svg.dataset.trackWidth)];
      if (!previous && (point.x < left - 6 || point.x > left + width + 6 || point.y < 25 || point.y > Number(svg.dataset.mapBottom))) return null;
      return { surface: 'linear', svg, boundary: Regions.clamp(Math.round((point.x - left) / width * length), 0, length) };
    }
    const dx = point.x - Number(svg.dataset.centerX);
    const dy = point.y - Number(svg.dataset.centerY);
    const r = Number(svg.dataset.radius);
    const distance = Math.hypot(dx, dy);
    if (!previous && (distance < r * .39 || distance > r * 1.29)) return null;
    if (distance < 8 && previous) return { ...previous, boundary: previous.boundary };
    const theta = Math.atan2(dy, dx) + Math.PI / 2;
    const boundary = Regions.modulo(Math.round(theta / (2 * Math.PI) * length + (ui.rotationBases || 0)), length);
    return { surface: 'circular', svg, boundary };
  }
  if (!previous && !target.closest?.('#bases')) return null;
  const boundary = sequenceBoundary(x, y, Boolean(previous));
  return boundary === null ? null : { surface: 'sequence', boundary };
}

function shortestDelta(next, current, length) {
  return Regions.modulo(next - current + length / 2, length) - length / 2;
}

function extendCircular(next, head, length) {
  return head + shortestDelta(next, Regions.modulo(head, length), length);
}

function resizeHandle(hit, event) {
  const touch=event.pointerType==='touch';
  const region = ui.selection;
  if (!region) return null;
  const length = active().bases.length;
  const wraps = region.ranges.length === 2 && region.ranges[0][1] === length && region.ranges[1][0] === 1;
  if (region.ranges.length !== 1 && !wraps) return null;
  const start = region.start - 1;
  const end = region.end + (wraps ? length : 0);
  let side;
  if (hit.svg) {
    const point = relativePoint(hit.svg, event.clientX, event.clientY);
    if (hit.surface === 'circular') {
      const radius = Number(hit.svg.dataset.radius);
      const distance = Math.hypot(point.x - Number(hit.svg.dataset.centerX), point.y - Number(hit.svg.dataset.centerY));
      if (distance < radius-(touch?12:0) || distance > radius + (touch?32:18)) return null;
      const left = Math.abs(shortestDelta(hit.boundary, start, length));
      const right = Math.abs(shortestDelta(hit.boundary, end % length, length));
      if (Math.min(left, right) > Math.max(.6, length * (touch?22:8) / (2 * Math.PI * radius))) return null;
      side = left <= right ? 'start' : 'end';
    } else {
      if (point.y < (touch?10:22) || point.y > (touch?54:40)) return null;
      const left = Math.abs(hit.boundary - start);
      const right = Math.abs(hit.boundary - region.end);
      if (Math.min(left, right) > Math.max(1, length / 75)) return null;
      side = left <= right ? 'start' : 'end';
    }
  } else {
    const handle = [...byId('bases').querySelectorAll('.selection-handle.start, .selection-handle.end')].find(node => {
      const rect = node.getBoundingClientRect();
      return Math.abs(rect.left - event.clientX) < (touch?20:6) && event.clientY >= rect.top - (touch?16:2) && event.clientY <= rect.top + (touch?30:11);
    });
    if (!handle) return null;
    side = handle.classList.contains('start') ? 'start' : 'end';
  }
  return side === 'start' ? { anchor: end, head: start, wraps } : { anchor: start, head: end, wraps };
}

function startDrag(event) {
  if (event.button !== 0 || active()?.kind !== 'sequence' || dialog.open) return;
  const target = event.target;
  if (target.closest?.('[data-action="map-cut"], [data-action="map-label-group"], [data-action="select-orf"], [data-action="primer-jump"], .map-feature-label')) return;
  const hit = hitSurface(target, event.clientX, event.clientY);
  const feature = target.closest?.('[data-action="select-feature"]');
  if (feature && active().features[Number(feature.dataset.value)]?.primer) return;
  if (!hit || feature && !hit.svg) return;
  const resize = !event.shiftKey ? resizeHandle(hit, event) : null;
  const start = resize?.anchor ?? (event.shiftKey && Number.isFinite(ui.anchor) ? ui.anchor : hit.boundary);
  const head = resize?.head ?? (event.shiftKey && hit.surface === 'circular' ?
    extendCircular(hit.boundary, ui.head ?? start, active().bases.length) : hit.boundary);
  drag = { ...hit, id: event.pointerId, start, head, moved: false, shift: event.shiftKey, resize: Boolean(resize),
    circular: hit.surface === 'circular' || Boolean(resize?.wraps),
    x: event.clientX, y: event.clientY, lastX: event.clientX, lastY: event.clientY,
    feature: feature ? Number(feature.dataset.value) : null };
  event.preventDefault();
  closePopup();
  (hit.svg || byId('bases')).focus({ preventScroll: true });
  byId('editor').setPointerCapture(event.pointerId);
  if (drag.shift) setBoundaries(start, head, hit.surface, hit.surface === 'circular');
}

function moveDrag(event) {
  if (drag?.id !== event.pointerId) return;
  drag.lastX = event.clientX;
  drag.lastY = event.clientY;
  if (Math.hypot(drag.lastX - drag.x, drag.lastY - drag.y) >= 3) drag.moved = true;
  if (!dragFrame && drag.moved) dragFrame = requestAnimationFrame(dragStep);
}

function dragStep() {
  dragFrame = 0;
  if (!drag?.moved) return;
  let auto = 0;
  if (drag.surface === 'sequence') {
    const body = byId('bases');
    const box = body.getBoundingClientRect();
    if (drag.lastY > box.bottom - 22) auto = Math.min(50, 3 + (drag.lastY - box.bottom + 22) / 2);
    if (drag.lastY < box.top + 22) auto = -Math.min(50, 3 + (box.top + 22 - drag.lastY) / 2);
    if (auto) { body.scrollTop += auto; drawVisibleBases(); }
  }
  const hit = hitSurface(byId('bases'), drag.lastX, drag.lastY, drag);
  if (hit) {
    const n = active().bases.length;
    const circular = drag.circular;
    const next = circular ? drag.head + shortestDelta(hit.boundary, drag.boundary, n) : hit.boundary;
    drag.boundary = hit.boundary;
    drag.head = circular ? Regions.clamp(next, drag.start - n, drag.start + n) : next;
    setBoundaries(drag.start, drag.head, drag.surface, circular, drag.svg ? Regions.modulo(drag.head, n) + 1 : undefined);
  }
  if (auto && drag) dragFrame = requestAnimationFrame(dragStep);
}

function endDrag(event) {
  if (drag?.id !== event.pointerId) return;
  if (dragFrame) { cancelAnimationFrame(dragFrame); dragFrame = 0; }
  if (event.type === 'pointerup') {
    drag.lastX = event.clientX;
    drag.lastY = event.clientY;
    if (Math.hypot(drag.lastX - drag.x, drag.lastY - drag.y) >= 3) drag.moved = true;
    if (drag.moved) {
      dragStep();
      if (dragFrame) { cancelAnimationFrame(dragFrame); dragFrame = 0; }
    } else if (!drag.shift && !drag.resize) {
      if (drag.feature !== null) selectAnnotation(drag.feature);
      else setCaret(drag.boundary, drag.surface, Boolean(drag.svg));
    }
  }
  drag = null;
  refreshScopedCuts();
  if(ui.pane==='biochemical')refreshBiochemical();
}

document.addEventListener('pointerdown', startDrag);
document.addEventListener('pointermove', moveDrag);
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

function invertSelection() {
  ui.selection = Regions.inverted(selectedRegion(), active().bases.length, active().topology === 'circular');
  ui.caret = null;
  ui.anchor = ui.selection ? ui.selection.start - 1 : null;
  ui.head = ui.selection ? ui.selection.end : null;
  updateSequenceSelection(ui.selection?.start);
}

function sequenceKey(event) {
  const target = event.target;
  if (!target.closest?.('#bases, svg[data-sequence-map]') || active()?.kind !== 'sequence' || dialog.open) return;
  const doc = active();
  const length = doc.bases.length;
  const circular = target.closest('svg[data-sequence-map="circular"]') !== null;
  const key = event.key;
  if ((event.ctrlKey || event.metaKey) && key.toLowerCase() === 'a') {
    event.preventDefault();
    selectRange(1, length);
    return;
  }
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  if (key === 'Escape') {
    ui.selection = null;
    ui.caret = null;
    ui.anchor = null;
    ui.head = null;
    updateSequenceSelection();
    return;
  }
  if (['Delete', 'Backspace'].includes(key) && ui.selection && canEditSequence()) {
    event.preventDefault();
    editRegion('delete');
    return;
  }
  if (/^[a-z]$/i.test(key) && canEditSequence() && (ui.caret !== null && ui.caret !== undefined || ui.selection)) {
    try { Lab.basesOf(key, doc.type); }
    catch { return; }
    event.preventDefault();
    editRegion('insert', key.toUpperCase());
    return;
  }
  const moves = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -seqView.step, ArrowDown: seqView.step };
  if (!Object.hasOwn(moves, key) && !['Home', 'End'].includes(key)) return;
  event.preventDefault();
  const cursor = ui.head ?? ui.caret ?? 0;
  const next = key === 'Home' ? 0 : key === 'End' ? length : cursor + moves[key];
  if (event.shiftKey) {
    const anchor = ui.anchor ?? cursor;
    const head = circular ? Regions.clamp(next, anchor - length, anchor + length) : Regions.clamp(next, 0, length);
    setBoundaries(anchor, head, circular ? 'circular' : 'sequence', circular,
      (circular ? Regions.modulo(head, length) : head) + 1);
  } else {
    const edge = ui.selection && (key === 'ArrowLeft' || key === 'ArrowRight') ?

function resizePanes(value) {

document.addEventListener('pointerdown', event => {
  if (event.target.id !== 'sequence-divider' || event.button !== 0) return;
  const divider = event.target;
  const container = divider.parentElement.getBoundingClientRect();
  let frame = 0;
  let position = ui.splitWidth || 50;
  const move = event => {
    position = (event.clientX - container.left) / container.width * 100;
    if (!frame) frame = requestAnimationFrame(() => { frame = 0; resizePanes(position); });
  };
  const finish = () => {
    if (frame) cancelAnimationFrame(frame);
    resizePanes(position);
    divider.removeEventListener('pointermove', move);
  };
  divider.focus();
  divider.setPointerCapture(event.pointerId);
  divider.addEventListener('pointermove', move);
  divider.addEventListener('lostpointercapture', finish, { once: true });
});

function editRegion(mode, initial = '', copied = null) {
  const doc = active();
  if (!canEditSequence()) { toast('Esta secuencia está bloqueada o es de solo lectura.'); return; }
  const region = ui.selection;
  const remove = region?.ranges || [];
  const boundary = region ? region.start - 1 : ui.caret ?? 0;
  if (mode === 'delete' && !region) return;
  const affected = doc.features.filter(feature =>
    feature.ranges.some(([a, b]) => remove.some(([c, d]) => a <= d && b >= c)));
  show(mode === 'delete' ? 'Delete bases' : region ? 'Replace bases' : 'Insert bases',
    '<p>' + (region ? 'Selected: ' + displayBase(doc, region.start) + ' → ' + displayBase(doc, region.end) +
      ' (' + region.length + ' ' + units(doc) + ')' : 'Insert at ' + displayBase(doc, boundary + 1)) + '</p>' +
    (mode === 'delete' ? '' : field('Bases', area('bases', initial, 'rows="6" class="mono" required autofocus spellcheck="false"'))) +
    (copied?.features.length ? '<label class="check-row"><input name="features" type="checkbox" checked> Paste ' +
      copied.features.length + ' annotations, translations or primers</label>' : '') +
    (affected.length ? '<label class="check-row"><input name="remove-features" type="checkbox" required> Remove ' +
      affected.length + ' features that overlap the replaced bases</label>' : ''),
    data => {
      if (!canEditSequence()) throw Error('Esta secuencia está bloqueada o es de solo lectura.');
      const inserted = mode === 'delete' ? '' : Lab.basesOf(textOf(data, 'bases'), doc.type);
      const features = data.has('features') && inserted === copied?.bases ? copied.features.map(item =>
        item.primer ? { ...item, primer: { ...item.primer, id: uuid() } } : item) : [];
      const newCase = mode === 'delete' ? [] : inserted === copied?.bases && copied.lowercase ?
        copied.lowercase : Regions.lowercaseOf(textOf(data, 'bases'));
      const result = Regions.edit(doc, remove, boundary, inserted, features);
      if (result.affected.length && !data.has('remove-features')) throw Error('Confirma qué hacer con las anotaciones afectadas.');
      remember(doc, mode === 'delete' ? 'Before deleting bases' : 'Before inserting bases');
      const oldCase = doc.lowercase || [];
      doc.lowercase = moveCaseIntervals(oldCase, remove, boundary, inserted.length)
        .concat(newCase.map(([a, b]) => [a + result.boundary, b + result.boundary]));
      doc.bases = result.bases;
      doc.features = result.features;
      resetSequenceView();
      ui.caret = result.boundary + inserted.length;
      ui.anchor = ui.head = ui.caret;
      ui.scrollBase = Math.max(1, ui.caret);
      touch(doc, renderEditor);
    }, mode === 'delete' ? 'Delete bases' : 'Save', '');
}

function moveCaseIntervals(intervals, removed, boundary, added) {
  const sorted = removed.slice().sort((a, b) => a[0] - b[0]);
  const countBefore = position => sorted.reduce((sum, [a, b]) => sum + Math.max(0, Math.min(position, b) - a + 1), 0);
  const nextBoundary = boundary - countBefore(boundary);
  return intervals.flatMap(([start, end]) => {
    const surviving = [];
    let begin = start;
    for (const [a, b] of sorted) {
      if (b < begin || a > end) continue;
      if (a > begin) surviving.push([begin, a - 1]);
      begin = Math.max(begin, b + 1);
    }
    if (begin <= end) surviving.push([begin, end]);
    return surviving.flatMap(([a, b]) => {
      const first = a - countBefore(a);
      const last = b - countBefore(b);
      if (first > nextBoundary) return [[first + added, last + added]];
      if (last > nextBoundary) return [[first, nextBoundary], [nextBoundary + added + 1, last + added]];
      return [[first, last]];
    });
  });
}

function changeCase(kind) {
  if (!canEditSequence() || !ui.selection) return;
  const doc = active();
  const intervals = doc.lowercase || [];
  const ranges = ui.selection.ranges;
  remember(doc, 'Before changing display case');
  if (kind === 'lower') {
    const sorted = [...intervals, ...ranges].sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const [a, b] of sorted) {
      if (merged.length && merged.at(-1)[1] + 1 >= a) merged.at(-1)[1] = Math.max(merged.at(-1)[1], b);
      else merged.push([a, b]);
    }
    doc.lowercase = merged;
  } else {
    let remaining = intervals;
    for (const [a, b] of ranges) {
      remaining = remaining.flatMap(([x, y]) => {
        if (x > b || y < a) return [[x, y]];
        return [...(x < a ? [[x, a - 1]] : []), ...(y > b ? [[b + 1, y]] : [])];
      });
    }
    doc.lowercase = remaining;
  }
  touch(doc, renderBases);
}

function reindexSequence() {
  const doc = active();
  if (!canEditSequence()) return;
  const circular = doc.topology === 'circular';
  const initial = circular ? Math.min(doc.bases.length, (ui.caret ?? 0) + 1) : doc.startIndex || 1;
  show('Re-index sequence', field(circular ? 'Current base that becomes base 1' : 'Start index',
    input('index', initial, 'type="number" min="1" max="' + (circular ? doc.bases.length : 1000000000) + '" required')) +
    '<p class="muted">' + (circular ? 'The sequence and annotations are renumbered from the selected origin.' :
      'Updates the coordinates on the ruler.') + '</p>', data => {
    const value = Number(data.get('index'));
    if (!canEditSequence()) throw Error('Esta secuencia está bloqueada o es de solo lectura.');
    remember(doc, 'Before reindexing sequence');
    if (circular) {
      const rotated = Regions.reindex(doc, value - 1);
      if (doc.lowercase?.length) doc.lowercase = doc.lowercase.flatMap(([a, b]) => {
        const from = Regions.modulo(a - value, doc.bases.length) + 1;
        const end = from + b - a;
        return end <= doc.bases.length ? [[from, end]] : [[from, doc.bases.length], [1, end - doc.bases.length]];
      });
      Object.assign(doc, rotated);
      delete doc.startIndex;
      ui.rotationBases = 0;
    } else doc.startIndex = value;
    resetSequenceView();
    ui.caret = ui.anchor = ui.head = 0;
    touch(doc);
  }, 'Re-index', '');
}

const Team = (() => {
  const enabled = Boolean(document.querySelector('meta[name="mesa-mode"][content="shared"]'));
  let user;
  let spaces = [];
  let space;
  let modelAvailable = false;
  let blastAvailable = false;
  let modelJobs = [];
  let base = null;
  let revision = 0;
  let timer;
  let saving;
  let pulling = false;
  let waitingRemote = false;
  let conflict = null;
  let issue = '';
  let source;

  const roles = { read: 'Read · lectura', append: 'Append · añadir', write: 'Write · editar', admin: 'Admin · gestionar' };
  const roleOptions = Object.entries(roles);
  const writable = () => !enabled || ['write', 'admin'].includes(space?.role);
  const creatable = () => !enabled || ['append', 'write', 'admin'].includes(space?.role);
  const readableOnly = () => enabled && space?.role === 'read';

  async function api(route, data, query = {}) {
    const url = new URL('/api/' + route, location.origin);
    for (const [key, value] of Object.entries({ ...(space ? { space: space.id } : {}), ...query })) url.searchParams.set(key, value);
    const response = await fetch(url, data === undefined ? {} : {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
    });
    const result = await response.json();
    if (!response.ok) {
      const error = Error(result.error || 'El servidor no pudo completar la acción.');
      error.status = response.status;
      error.conflicts = result.conflicts;
      throw error;
    }
    return result;
  }

  async function start() {
    try {
      const info = await api('session');
      if (!info.user) { location.replace('/'); return false; }
      user = info.user;
      spaces = info.spaces;
      modelAvailable = info.models;
      blastAvailable = info.blast;
      const requested = new URL(location.href).searchParams.get('space');
      space = spaces.find(item => item.id === requested) || spaces.find(item => item.id === 'lab') || spaces[0];
      if (!space) throw Error('Tu cuenta todavía no pertenece a un espacio.');
      const packet = await api('state');
      revision = packet.revision;
      if (revision) {
        base = Sync.apply(null, packet.changes);
        validateBackup(base);
        db = structuredClone(base);
      } else db = Workspace.normalize(example());
      issue = '';
      source = new EventSource('/api/events?space=' + encodeURIComponent(space.id));
      source.onmessage = event => {
        const { kind } = JSON.parse(event.data);
        if (kind === 'models') { refreshModels().catch(report); return; }
        if (kind === 'membership') { refreshRole().catch(report); return; }
        waitingRemote = true;
        pull();
      };
      source.onerror = () => { if (!issue && !conflict) { issue = 'Reconectando…'; renderStatus(); } };
      source.onopen = () => { if (issue === 'Reconectando…') issue = ''; renderStatus(); };
      dialog.addEventListener('close', () => { if (waitingRemote) pull(); });
      refreshModels().catch(() => {});
      if (!revision && writable()) schedule();
      return true;
    } catch (error) {
      byId('editor').innerHTML = '<div class="placeholder"><div class="welcome"><h1>Espacio compartido</h1><p>' +
        esc(error.message || 'No se pudo cargar el espacio.') + '</p><a class="as-button" href="/">Volver al acceso</a> ' +
        btn('Cerrar sesión', 'team-logout') + '</div></div>';
      return false;
    }
  }

  async function refreshRole() {
    const result = await api('session');
    spaces = result.spaces || [];
    const next = spaces.find(item => item.id === space.id);
    if (!next) { issue = 'Acceso retirado'; source?.close(); renderStatus(); return; }
    if (next.role !== space.role) { space = next; render(); }
  }

  function report(error) {
    issue = error.status === 401 ? 'Sesión caducada' : error.message;
    toast(issue);
    renderStatus();
  }

  function status() {
    if (conflict) return 'Conflicto de edición';
    if (issue) return issue;
    if (saving || timer) return 'Sincronizando…';
    if (waitingRemote) return 'Cambios remotos pendientes';
    return space ? space.name + ' · ' + (user?.name || '') + (readableOnly() ? ' · lectura' : '') : 'Conectando…';
  }

  function schedule() {
    if (!space || conflict || readableOnly()) return;
    clearTimeout(timer);
    timer = setTimeout(() => { timer = null; flush().catch(report); }, 180);
    renderStatus();
  }

  async function flush() {
    clearTimeout(timer);
    timer = null;
    if (saving) { await saving; return flush(); }
    if (!space || readableOnly()) return;
    if (conflict) throw Error('Resuelve el conflicto antes de guardar.');
    const snapshot = structuredClone(db);
    const changes = Sync.diff(base, snapshot);
    if (!Sync.count(changes)) { if (waitingRemote) await pull(); return; }
    saving = (async () => {
      try {
        const result = await api('state', { base: revision, changes });
        const subsequent = Sync.diff(snapshot, db);
        const remote = Sync.apply(base, result.changes);
        const nonLocal = Sync.diff(snapshot, remote);
        revision = result.revision;
        base = remote;
        issue = '';
        if (Sync.count(nonLocal)) {
          const incoming = {};
          const overlapping = [];
          for (const [collection, rows] of Object.entries(nonLocal)) {
            const changedDuringSave = new Set((subsequent[collection] || []).map(([id]) => id));
            incoming[collection] = [];
            for (const [id, value] of rows) {
              if (changedDuringSave.has(id)) overlapping.push({ collection, id, name: value?.name || 'Elemento archivado' });
              else incoming[collection].push([id, structuredClone(value)]);
            }
          }
          db = Sync.apply(db, incoming);
          if (overlapping.length) {
            conflict = overlapping;
            toast('Otra persona editó un elemento de tu borrador. Abre Equipo para resolver el conflicto.');
          }
          refresh(incoming.docs?.some(([id]) => id === ui.active));
        }
      } catch (error) {
        if (error.status === 409) {
          conflict = error.conflicts || [];
          issue = '';
          toast('Otra persona editó el mismo elemento. Abre Equipo para guardar tu borrador o recargar.');
          return;
        }
        throw error;
      } finally {
        saving = null;
        renderStatus();
      }
    })();
    await saving;
    if (!conflict && Sync.count(Sync.diff(base, db))) schedule();
    else if (waitingRemote && !conflict) await pull();
  }

  function editing() {
    const element = document.activeElement;
    return Boolean(element?.closest('#rich-entry, #sequence-description, #note-content')||typeof NotebookDictation!=='undefined'&&NotebookDictation.listening());
  }

  async function pull() {
    if (!space || conflict || pulling || saving || timer || dialog.open || (!revision && writable())) return;
    if (Sync.count(Sync.diff(base || db, db))) return;
    pulling = true;
    const cursor = revision;
    try {
      const packet = await api('state', undefined, { since: cursor });
      if (saving || dialog.open || revision !== cursor || Sync.count(Sync.diff(base || db, db))) return;
      if (packet.revision === revision) { waitingRemote = false; return; }
      const changedCurrent = packet.changes.docs?.some(([id]) => id === ui.active);
      if (changedCurrent && editing()) { waitingRemote = true; return; }
      base = Sync.apply(base, packet.changes);
      db = Sync.apply(db, structuredClone(packet.changes));
      revision = packet.revision;
      waitingRemote = false;
      issue = '';
      refresh(changedCurrent);
    } catch (error) { report(error); }
    finally { pulling = false; renderStatus(); }
  }

  function refresh(changedCurrent) {
    if (!projectOf(ui.project)) ui.project = db.projects[0].id;
    if (!folderOf(ui.folder)) ui.folder = '';
    ui.tabs = ui.tabs.filter(id => docOf(id));
    if (ui.active && !docOf(ui.active)) {
      ui.active = ui.tabs.at(-1) || '';
      resetSequenceView();
      changedCurrent = true;
    }
    if (changedCurrent && active()?.kind === 'sequence') resetSequenceView();
    if (changedCurrent || ui.dashboard) render();
    else { renderSidebar(); renderTabs(); renderStatus(); }
  }

  document.addEventListener('focusout', event => {
    if (enabled && waitingRemote && event.target.closest?.('#rich-entry, #sequence-description, #note-content')) setTimeout(pull, 0);
  });
  window.addEventListener('beforeunload', event => {
    if (enabled && !readableOnly() && (saving || timer || conflict || (base && Sync.count(Sync.diff(base, db))))) {
      event.preventDefault();
      event.returnValue = '';
    }
  });

  const modifies = new Set(['edit-sequence', 'feature', 'remove-feature', 'translation-create', 'primer-remove', 'primer-save',
    'save-version', 'version-restore', 'move-doc', 'delete-doc', 'unlink-doc', 'link-doc', 'attach-file', 'asset-unlink',
    'edit-table', 'remove-table', 'rich-command', 'notebook-day', 'notebook-mention', 'new-project', 'rename-project',
    'star-project', 'schema-edit', 'new-schema', 'edit-entity', 'delete-doc', 'trash-restore', 'trash-purge', 'backup', 'restore',
    'place-new', 'place-edit', 'container-new', 'container-edit', 'container-move', 'container-adjust', 'save-search',
    'import-project-zip', 'import-model-server', 'team-model-run', 'asset-link', 'library-new', 'library-feature', 'feature-to-library', 'library-csv', 'auto-annotate',
    'sequence-reindex', 'sequence-insert', 'sequence-insert-part', 'sequence-delete', 'sequence-case', 'sequence-paste',
    'digest-save', 'digest-delete', 'molecular-setting-delete', 'primer-store', 'primer-link', 'primer-detach', 'primer-attach',
    'circuit-node-new', 'circuit-node-edit', 'circuit-node-delete', 'circuit-connect', 'circuit-edge', 'circuit-edge-delete',
    'circuit-part', 'circuit-part-new', 'circuit-part-delete', 'circuit-part-shift', 'circuit-compile', 'circuit-ucf',
    'circuit-from-sequence', 'circuit-undo', 'circuit-redo', 'circuit-simulation-settings', 'circuit-manage', 'circuit-delete',
    'annotation-bulk-edit', 'annotation-bulk-library', 'annotation-bulk-delete', 'annotation-bulk-undo','grammar-create','part-apply-model']);
  const creates = new Set(['blank-entry', 'template-entry', 'new-note', 'new-protocol', 'new-template', 'new-folder',
    'new-sequence', 'import', 'spreadsheet-import', 'import-trace', 'asset-add', 'team-import-link', 'copy-to', 'duplicate-doc',

  async function importResult(id) {
    const getJob = () => db.batches.flatMap(item => item.jobs).find(job => job.id === id);
    if (!getJob() || getJob().result) return;
    const result = await api('models/result', undefined, { job: id });
    Tools.pdbTrace(result.pdb);
    let confidence = {};
    if (result.confidence) { try { confidence = readConfidence(result.confidence); } catch { /* Older outputs may omit supported metrics. */ } }
    const file = new File([result.pdb], result.name, { type: 'chemical/x-pdb' });
    const asset = await makeAsset(file);
    const job = getJob();
    if (!job || job.result) return;
    db.assets.push(asset);
    Object.assign(job, { status: 'completed', result: asset.id, confidence });
    await flush();
    render();
    if (!conflict) structureView(asset);

      (conflict ? '<p class="callout block-gap">Cambios sin guardar. Descarga tu borrador antes de cargar la versión del equipo.</p>' +
        (conflict.length ? '<ul>' + conflict.map(item => '<li>' + esc(item.name) + '</li>').join('') + '</ul>' : '') +
        choices([['Descargar borrador', 'backup'], ['Recargar versión del equipo…', 'team-reset']]) : '');
    show('Equipo', content, null, '', 'Espacio compartido');
