function localDate(date = new Date()) {
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
}

function insertDay() {
  const doc = active();
  show('New day', field('Date', input('date', localDate(), 'type="date" required')), data => {
    const date = textOf(data, 'date');
    if (doc.content.split('\n').includes('## ' + date)) throw Error('This date is already in the entry.');
    remember(doc, 'Before inserting date');
    const heading = '## ' + date;
    const match = [...doc.content.matchAll(/^## (\d{4}-\d{2}-\d{2})$/gm)].find(item => item[1] > date);
    if (match) doc.content = doc.content.slice(0, match.index) + heading + '\n\n' + doc.content.slice(match.index);
    else doc.content = [doc.content, heading].filter(Boolean).join('\n\n');
    touch(doc);
  }, 'Insert', '');
}

function calendarPanel() {
  const current = new Date((ui.calendarDay || localDate()) + 'T12:00:00');
  const mode = ui.calendarMode || 'month';
  const first = new Date(current);
  if (mode === 'month') { first.setDate(1); first.setDate(first.getDate() - (first.getDay() + 6) % 7); }
  else if (mode === 'weeks') first.setDate(first.getDate() - (first.getDay() + 6) % 7);
  const days = mode === 'day' ? 1 : mode === 'weeks' ? 14 : 42;
  const indexed = new Map();
  for (const doc of db.docs.filter(item => item.kind === 'note')) {
    for (const match of doc.content.matchAll(/^## (\d{4}-\d{2}-\d{2})$/gm)) {
      if (!indexed.has(match[1])) indexed.set(match[1], []);
      indexed.get(match[1]).push(doc);
    }
  }
  const cells = Array.from({ length: days }, (_, i) => {
    const day = new Date(first);
    day.setDate(first.getDate() + i);
    const stamp = localDate(day);
    return '<div class="calendar-cell' + (mode === 'month' && day.getMonth() !== current.getMonth() ? ' off-month' : '') +
      '"><b>' + day.getDate() + '</b>' + (indexed.get(stamp) || []).map(doc =>
        btn(esc(doc.name), 'open', attr(doc.id, 'class="calendar-item"'))).join('') + '</div>';
  });
  return '<div class="expanded-browser"><div class="section-heading"><h2>Calendar</h2>' +
    btn('‹', 'calendar-step', attr(-1, 'aria-label="Previous period"')) + btn('Today', 'calendar-today') +
    btn('›', 'calendar-step', attr(1, 'aria-label="Next period"')) + btn('Collapse', 'expand-browser') + '</div>' +
    '<div class="section-heading"><h3>' + esc(new Intl.DateTimeFormat('en', { month: 'long', year: 'numeric' }).format(current)) + '</h3>' +
    [['Day', 'day'], ['2 Weeks', 'weeks'], ['Month', 'month']].map(([label, key]) => btn(label, 'calendar-mode', attr(key, 'aria-pressed="' + (key === mode) + '"'))).join('') +
    '</div><div class="calendar-grid' + (mode === 'day' ? ' day' : '') + '">' + cells.join('') + '</div></div>';
}

function calendarStep(value) {
  const current = new Date((ui.calendarDay || localDate()) + 'T12:00:00');
  const direction = Number(value);
  if (ui.calendarMode === 'day') current.setDate(current.getDate() + direction);
  else if (ui.calendarMode === 'weeks') current.setDate(current.getDate() + direction * 14);
  else { current.setDate(1); current.setMonth(current.getMonth() + direction); }
  ui.calendarDay = localDate(current);
  renderEditor();
}

    }, 'Save Feature', '');

function parseLibraryFeature(name, raw, type, kind, color) {
  const motif = Lab.basesOf(raw, type);
  if (!name || name.length > 160 || motif.length > 1500 || !/^[A-Za-z0-9_'-]{1,15}$/.test(kind)) {
    throw Error('Comprueba el nombre, el tipo y el motivo (hasta 1 500 posiciones).');
  }
  return { name, motif, type, kind, color: colorOf(color) };
}

function featureToLibrary(index) {
  const doc = active();
  const feature = doc.features[Number(index)];
  if (!feature) return;
  const bases = feature.ranges.map(([a, b]) => doc.bases.slice(a - 1, b)).join('');
  const motif = feature.strand < 0 && doc.type !== 'AA' ? Lab.reverseComplement(bases, doc.type) : bases;
  show('Add to Feature Library', field('Library', select('library', [['', 'New library'], ...db.libraries.map(item => [item.id, item.name])])) +
    field('Name of new library', input('newLibrary', '', 'maxlength="160"')) +
    '<p class="muted">' + esc(feature.name) + ' · ' + format(motif.length) + ' ' + units(doc) + '</p>', data => {
    const entry = parseLibraryFeature(feature.name, motif, doc.type, feature.kind, colorOf(feature.color));
    if(feature.biopart)entry.biopart=structuredClone(feature.biopart);
    let library = libraryOf(textOf(data, 'library'));
    if (!library) {
      const name = textOf(data, 'newLibrary');
      if (!name || name.length > 160 || db.libraries.some(item => item.name.toLowerCase() === name.toLowerCase())) {
        throw Error('Choose a library or enter a new name.');
      }
      library = { id: uuid(), name, features: [] };
      db.libraries.push(library);
    }
    if (library.features.length >= 500) throw Error('El límite es de 500 motivos por biblioteca.');
    library.features.push(entry);
    save();
    openLibrary(library.id);
    return false;
  }, 'Save Feature', '');
}

function libraryCsv(id) {
  const library = libraryOf(id);
  show('Import CSV into feature library', field('Archivo CSV', '<input type="file" name="file" accept=".csv,.txt">') +
    field('O pega la tabla', area('rows', '', 'rows="6" class="mono" placeholder="Name,Feature,Type,Color"')) +
    field('Alfabeto', select('type', [['DNA', 'DNA'], ['RNA', 'RNA'], ['AA', 'Protein']])),
    async data => {
      const file = data.get('file');
      if (file.size > 2_000_000) throw Error('El CSV supera 2 MB.');
      const rows = Notebook.parseDelimited(file.size ? await file.text() : String(data.get('rows')), ',');
      const keys = rows.shift().map(text => text.trim().toLowerCase());
      const get = (row, key) => (row[keys.indexOf(key)] || '').trim();
      if (!keys.includes('name') || !keys.includes('feature') || !rows.length) throw Error('Incluye las columnas Name y Feature.');
      if (library.features.length + rows.length > 500) throw Error('La biblioteca superaría 500 motivos.');
      const features = rows.map(row => parseLibraryFeature(get(row, 'name'), get(row, 'feature'),
        textOf(data, 'type'), get(row, 'type') || 'misc_feature', get(row, 'color')));
      library.features.push(...features);
      save();
      openLibrary(id);
      return false;
    }, 'Import', '');
}

function autoAnnotate() {
  const doc = active();
  const available = db.libraries.filter(item => item.features.some(feature => feature.type === doc.type));
  if (!available.length) {
    show('Auto annotate', '<p>Crea una biblioteca con motivos del mismo alfabeto que esta secuencia.</p>' + btn('Feature libraries', 'library-list'), null, '', '');

    field('Notas',select('noteMode',[['keep','Conservar'],['replace','Reemplazar'],['append','Añadir']])) + field('Texto de notas',area('notes','','rows="4" maxlength="10000"')),data=>{

const tau = 2 * Math.PI;
const plasmidZoom = () => Number(ui.plasmidZoom || 0);
const linearZoom = () => Number(ui.linearZoom || 0);

function setSequenceZoom(value) {
  ui.zoomPercent = Regions.clamp(value, 20, 300);
  ui.zoom = Math.max(7, 12 * Math.sqrt(ui.zoomPercent / 100));
  const slider = byId('zoom');
  if (slider) slider.value = ui.zoomPercent;
  renderBases();
}

function refreshMapGraphic() {
  const doc = active();
  const body = byId('map-pane')?.querySelector('.map-body');
  if (!body || doc?.kind !== 'sequence') return;
  const circular = ui.pane === 'map' && doc.topology === 'circular';
  const scroll = body.scrollLeft;
  const scrollY = body.scrollTop;
  const focused = document.activeElement === body.querySelector('svg');
  body.innerHTML = circular ? circularMapMarkup(doc) : linearMapMarkup(doc);
  if (!circular) { body.scrollLeft = scroll; body.scrollTop = scrollY; }
  if (focused) body.querySelector('svg').focus({ preventScroll: true });
  paintMapSelection();
  bindMapLabels();
}

function setMapZoom(value, anchor = null, fit = false) {
  const doc = active();
  if (doc?.kind !== 'sequence') return;
  const zoom = Math.round(Regions.clamp(value, 0, 1) * 10000) / 10000;
  const circular=ui.pane === 'map' && doc.topology === 'circular';
  const body=byId('map-pane')?.querySelector('.map-body'),svg=body?.querySelector('svg');
  const box=svg?.getBoundingClientRect();
  const viewport=body?.getBoundingClientRect();
  const cursor=anchor|| (box&&viewport?{x:viewport.left+body.clientWidth/2,y:viewport.top+Math.min(box.height,body.clientHeight)/2}:null);
  let point=svg&&cursor?relativePoint(svg,cursor.x,cursor.y):null;
  let linearAnchor;
  if(circular) {
    if(fit||zoom===0) ui.plasmidPan={x:0,y:0};
    else if(point) {
      const old=mapGeometry(doc,MapNavigation.radius(plasmidZoom())),nextRadius=MapNavigation.radius(zoom);
      if(!anchor){const target=old.point(ui.selection?ui.selection.start-1:ui.rotationBases||0,old.radius);point={x:target[0],y:target[1]};}
      const center=MapNavigation.circularCenter({x:old.cx,y:old.cy},old.radius,nextRadius,point);
      ui.plasmidPan={x:center.x-210,y:center.y-(216+(nextRadius>210?nextRadius+2:0))};
    }
    ui.plasmidZoom=zoom;
  } else {
    if(fit) { ui.linearPanY=0; if(body)body.scrollLeft=body.scrollTop=0; }
    else if(point)linearAnchor={fraction:(point.x-Number(svg.dataset.trackLeft))/Number(svg.dataset.trackWidth),deltaY:point.y-Number(svg.dataset.trackY)};
    ui.linearZoom = zoom;
  }
  if (byId('map-zoom')) byId('map-zoom').value = zoom;
  const readout = byId('map-zoom-readout');
  if (readout) readout.textContent = (circular ? MapNavigation.radius(zoom) / 104 : MapNavigation.linearScale(zoom)).toFixed(1) + '×';
  refreshMapGraphic();
  if(linearAnchor&&cursor&&body) {
    const next=body.querySelector('svg'),matrix=next.getScreenCTM();
    const target=new DOMPoint(Number(next.dataset.trackLeft)+linearAnchor.fraction*Number(next.dataset.trackWidth),Number(next.dataset.trackY)+linearAnchor.deltaY).matrixTransform(matrix);
    body.scrollLeft+=target.x-cursor.x;
    ui.linearPanY=(ui.linearPanY||0)+cursor.y-target.y;
    next.style.transform='translateY('+ui.linearPanY+'px)';
    paintLinearNames(body);
  }
}

function setMapRotation(value) {
  const doc = active();
  if (doc?.kind !== 'sequence') return;
  ui.rotationBases = MapNavigation.rotation(value, doc.bases.length);
  if (byId('map-rotation')) byId('map-rotation').value = ui.rotationBases;
  ui.selectionSource = 'sequence';
  refreshMapGraphic();
}

function mapGeometry(doc, radius, centerY, pan = true) {
  const n = doc.bases.length;
  const cx = 210 + (pan ? ui.plasmidPan?.x||0:0);
  const cy = (centerY ?? 216 + (radius > 210 ? radius + 2 : 0)) + (pan ? ui.plasmidPan?.y||0:0);
  const rotation = ui.rotationBases || 0;
  const angle = position => tau * (position - rotation) / n - Math.PI / 2;
  const point = (position, distance) => [cx + distance * Math.cos(angle(position)), cy + distance * Math.sin(angle(position))];
  const arc = (a, b, r, sweep = 1) => {
    const end = a + (b - a >= n ? n - .001 : b - a);
    return 'A' + r + ' ' + r + ' 0 ' + Number(end - a > n / 2) + ' ' + sweep + ' ' + point(end, r).join(' ');
  };
  const path = (a, b, r) => 'M' + point(a, r).join(' ') + arc(a, b, r);
  return { n, cx, cy, radius, point, angle, path, arc };
}

function isVisibleFeature(feature) {
  if (annotationHidden(feature)) return false;
  if (feature.kind === 'CDS') return ui.visibility.translations;
  if (feature.kind === 'primer_bind') return ui.visibility.primers;
  if (feature.kind === 'ORF') return ui.visibility.annotations;
  return ui.visibility.annotations;
}

let orfCache = { bases: '', key: '', items: [] };
function visibleORFs(doc) {
  if (doc.type === 'AA') return [];
  const options = ui.orfOptions || defaultORF;
  const key = [doc.type, doc.topology, options.minimum, options.frames, options.start].join(':');
  if (orfCache.bases === doc.bases && orfCache.key === key) return orfCache.items;
  const items = ORFs.find(doc, options);
  orfCache = { bases: doc.bases, key, items };
  return items;
}

function orfLayerVisible(surface='sequence') { return Boolean(ui.orfLayers?.[surface]); }
function toggleORFLayer(surface='sequence') {
  if(!['sequence','linear','circular'].includes(surface))return;
  ui.orfLayers={...(ui.orfLayers||{}),[surface]:!orfLayerVisible(surface)};
  renderBases(); refreshMapGraphic();
}
function mapFeatures(doc, surface='sequence') {
  return doc.features.map((feature, index) => ({ feature, index })).filter(({ feature }) => isVisibleFeature(feature))
    .concat(orfLayerVisible(surface)?visibleORFs(doc).map(feature => ({ feature, index: null })):[], draftPrimerFeatures(doc));
}

function mapItemAttrs(item, label = false) {
  if (item.index !== null) return handleAttrs(item.index, label);
  return ' class="map-feature' + (label ? ' map-feature-label' : '') + '" data-action="' + sequenceTrackAction(item) + '" ' + sequenceTrackAttrs(item);
}

function handleAttrs(index, label = false) {
  return index === null ? '' : ' class="map-feature' + (label ? ' map-feature-label' : '') + '" data-action="select-feature" data-value="' + index + '"';
}

function featureTracks(items) {
  const lanes = [];
  return items.map(item => {
    const { feature } = item;
    const kind = feature.kind === 'ORF' ? 'orf' + feature.orf?.frame : feature.kind === 'CDS' ? 'protein' : feature.kind === 'primer_bind' ? 'primer' : 'annotation';
    let lane = lanes.findIndex(group => group.kind === kind &&
      feature.ranges.every(([a, b]) => group.ranges.every(([start, end]) => b < start || end < a)));
    if (lane < 0) lane = lanes.push({ kind, ranges: [] }) - 1;
    lanes[lane].ranges.push(...feature.ranges);
    return { ...item, lane };
  });
}

function arcArrow(g, start, end, radius, width, strand, arrow = true) {
  const outer = radius + width / 2;
  const inner = radius - width / 2;
  const head = arrow ? Math.min((end - start) * .55, g.n * width / (tau * radius)) : 0;
  const first = strand < 0 ? start + head : start;
  const last = strand < 0 ? end : end - head;
  const reverseArc = 'A' + inner + ' ' + inner + ' 0 ' + Number(last - first > g.n / 2) + ' 0 ' + g.point(first, inner).join(' ');
  return 'M' + g.point(first, outer).join(' ') + g.arc(first, last, outer) +
    (strand < 0 ? '' : 'L' + g.point(end, radius).join(' ')) + 'L' + g.point(last, inner).join(' ') + reverseArc +
    (strand < 0 ? 'L' + g.point(start, radius).join(' ') : '') + 'Z';
}

function mapText(text, limit) {
  if (text.length <= limit) return text;
  if (limit < 5) return '';
  return text.slice(0, Math.ceil((limit - 1) / 2)) + '…' + text.slice(-Math.floor((limit - 1) / 2));
}
function featureInk(color){
  const rgb=colorOf(color).slice(1).match(/../g).map(v=>parseInt(v,16)/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));
  const luminance=rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722;return luminance>.179?'#000000':'#ffffff';
}

let mapLabelGroups = [];
function circleLabels(g, labels, zoom, interactive) {
  const { radius, point, cx, cy, angle } = g;
  const markup = [];
  if (interactive) mapLabelGroups = [];
  const spacing = 14.5;
  const outer = radius + 38;
  for (const side of [-1, 1]) {
    const bySlot = new Map();
    for (const item of labels) {
      const theta = angle(item.pos);
      const [x, y] = point(item.pos, radius);
      if ((Math.cos(theta) < 0 ? -1 : 1) !== side || (radius > 210 && (x < -10 || x > 430 || y > 450))) continue;
      const slot = Math.round((point(item.pos, outer)[1] - cy) / spacing);
      if (!bySlot.has(slot)) bySlot.set(slot, []);
      bySlot.get(slot).push(item);
    }
    for (const [slot, group] of bySlot) {
      const y = cy + slot * spacing;
      const x = Regions.clamp(cx + side * Math.max(26, Math.sqrt(Math.max(0, outer ** 2 - (y - cy) ** 2))), 28, 392);
      const room = (side < 0 ? x : 420 - x) - 5;
      const ordered = group.sort((a, b) => Number(Boolean(b.feature)) - Number(Boolean(a.feature)));
      const visible = [];
      let characters = Math.floor(room / 7.1);
      for (const item of ordered) {
        const reserved = ordered.length > visible.length + 1 ? String(ordered.length-visible.length).length+2 : 0;
        if (visible.length >= 3 || characters < 5) break;
        const label = mapText(item.text, characters - reserved);
        if (!label) break;
        visible.push({ ...item, label });
        characters -= label.length + 1;
      }
      const hidden = group.length - visible.length;
      const groupIndex = interactive && hidden ? mapLabelGroups.push(group) - 1 : -1;
      for (const item of group.slice(0, 12)) {
        const [p, q] = point(item.pos, radius + 1);
        const [u, v] = point(item.pos, radius + Math.min(10, Math.max(4, 18 - zoom * 20)));
        markup.push('<path d="M' + p + ' ' + q + 'L' + u + ' ' + v + 'L' + (x - side * 3) + ' ' + y +
          '" fill="none" stroke="#b1b1b1" stroke-width=".75" pointer-events="none"/>');
      }
      const text = visible.map(item => '<tspan' + (item.feature ? ' text-decoration="underline"' : '') +
        (item.index !== null && item.index !== undefined ? handleAttrs(item.index, true) : '') +
        (item.cut ? cutAttrs(item.cut) + ' fill="' + cutColor(item.cut, !interactive) + '"' : '') + '>' + esc(item.label) +
        '<title>' + esc(item.text) + '</title></tspan>');
      if (hidden) text.push('<tspan class="map-label-more"' + (groupIndex >= 0 ? ' data-action="map-label-group" data-value="' + groupIndex + '"' : '') +
        '>+' + hidden + '<title>' + esc(group.slice(0, 20).map(item => item.text).join(', ')) + '</title></tspan>');
      markup.push('<text x="' + x + '" y="' + (y + 3) + '" text-anchor="' + (side < 0 ? 'end' : 'start') +
        '" data-label-position="external" font-size="11.5">' + text.join('<tspan>,</tspan>') + '</text>');
    }
  }
  return markup.join('');
}

function cutAttrs(site) {
  return ' class="map-cut" data-action="map-cut" data-value="' + cutValue(site) + '"';
}

function circularMapMarkup(doc, { fit = false } = {}) {
  const zoom = fit ? 0 : plasmidZoom();
  const radius = MapNavigation.radius(zoom);
  const compact = radius > 210;
  const g = mapGeometry(doc, radius, undefined, !fit);
  const { n, point, angle, path, cx, cy } = g;
  const pieces = ['<circle cx="' + cx + '" cy="' + cy + '" r="' + radius +
    '" fill="none" stroke="#77777b" stroke-width="3"/><g id="map-selection"></g>'];
  const inlineNames=[];
  const titleAt = compact ? 123 : zoom > 0 ? cy - 2 : 15;
  pieces.push('<text class="plasmid-title" x="' + cx + '" y="' + titleAt + '" text-anchor="middle">' +
    esc(doc.name.length > 32 ? doc.name.slice(0, 31) + '…' : doc.name) + '</text><text x="' + cx + '" y="' + (titleAt + 21) +
    '" text-anchor="middle" font-size="13">' + n + ' ' + units(doc) + '</text>');
  if (ui.visibility.indices) {
    const raw = compact ? n * Math.asin(Math.min(1, 210 / radius)) / Math.PI / 8 : n / 13;
    const magnitude = Math.pow(10, Math.floor(Math.log10(Math.max(1, raw))));
    const stride = ([1, 2, 5, 10].find(step => step * magnitude >= raw) || 1) * magnitude;
    for (let index = stride; index < n; index += stride) {
      const [x, y] = point(index, radius - 1);
      const [u, v] = point(index, radius - 7);
      const [tx, ty] = point(index, radius - 15);
      if (x < -15 || x > 435 || y < -15 || y > 450) continue;
      const tilt = Regions.modulo(angle(index) * 180 / Math.PI + 180, 180) - 90;
      pieces.push('<path d="M' + x + ' ' + y + 'L' + u + ' ' + v + '" stroke="#636369"/><text x="' + tx +
        '" y="' + ty + '" transform="rotate(' + tilt + ' ' + tx + ' ' + ty + ')" text-anchor="middle" font-size="8.5">' + index + '</text>');
    }
  }
  if (!fit && tau * radius / n >= 6.1) {
    pieces.push(plasmidBaseDetail(doc, g));
  }
  const labels = [];
  const items = mapFeatures(doc,'circular');
  const tracks = featureTracks(items.sort((a, b) => Number(a.feature.kind === 'CDS') - Number(b.feature.kind === 'CDS')));
  const depth = Math.max(1, ...tracks.map(item => item.lane + 1));
  const stride = Math.min(14, (radius * .55 - 20) / depth);
  tracks.forEach((item, i) => {
    const {feature,index,lane} = item;
    const r = radius - 23 - lane * stride;
    const color = colorOf(feature.color);
    const spans = feature.ranges.map(span => [...span]);
    for (let j = 0; j + 1 < spans.length; j++) {
      if (spans[j][1] === n && spans[j + 1][0] === 1) spans.splice(j, 2, [spans[j][0], n + spans[j + 1][1]]);
    }
    let labeled = false;
    for (let segment=0;segment<spans.length;segment++) {
      const [a,b] = spans[segment];
      const start = a - 1;
      const end = b;
      const attrs = mapItemAttrs(item) + ' data-strand="' + feature.strand + '" data-head="' + (feature.strand<0?segment===0:segment===spans.length-1) + '"';
      const width = Math.min(feature.kind === 'primer_bind' ? 6 : 12, Math.max(2, stride - 1));
      pieces.push('<path d="' + arcArrow(g, start, end, r, width, feature.strand, feature.strand<0?segment===0:segment===spans.length-1) + '" fill="' + color +
        '"' + (feature.draft ? ' fill-opacity=".25" stroke-dasharray="3 2"' : '') + ' stroke="#77777b" stroke-width=".55"' + attrs + '><title>' + esc(feature.name) + ' · ' + (feature.strand<0?'Reverse ←':'Forward →') + '</title></path>');
      const pathLength = (end - start) / n * tau * r;
      if (!labeled && ui.visibility.inlineLabels && width>=11 && pathLength >= Math.max(32, feature.name.length * 5.8+18)) {
        const labelId = 'feature-arc-' + i + '-' + a;
        const name = compact?mapText(feature.name,60):feature.name;
        labeled = true;
        let labelPosition=(start+end)/2;
        if(compact){const visible=MapNavigation.visibleBasesAt(n,r-23,cx,cy,ui.rotationBases||0).flatMap(p=>[p,p+n]).filter(p=>p>=start&&p<=end);if(visible.length)labelPosition=visible.reduce((best,p)=>{const [x,y]=point(p,r),[bx,by]=point(best,r);return Math.hypot(x-210,y-213)<Math.hypot(bx-210,by-213)?p:best;},visible[0]);}
        const margin=(name.length*5.8/2+8)*n/(tau*r);labelPosition=Regions.clamp(labelPosition,start+margin,end-margin);
        const reverse=Math.sin(angle(labelPosition))>0,distance=r+(reverse?3:-3),last=start+Math.min(end-start,n-.001);
        const labelOffset=100*(reverse?end-labelPosition:labelPosition-start)/(end-start);
        const labelPath=reverse?'M'+point(last,distance).join(' ')+'A'+distance+' '+distance+' 0 '+Number(last-start>n/2)+' 0 '+point(start,distance).join(' '):path(start,end,distance);
        inlineNames.push('<defs><path id="' + labelId + '" d="' + labelPath + '"/></defs>' +
          '<text font-size="9" text-anchor="middle" data-label-position="inline" data-label-band-width="'+width+'" class="inline-label map-feature map-feature-label" style="fill:'+featureInk(color)+'"'+mapItemAttrs(item,true).replace(' class="map-feature map-feature-label"','')+'><textPath href="#' + labelId +
          '" startOffset="'+labelOffset+'%">' + esc(name) + '</textPath><title>'+esc(feature.name)+'</title></text>');
      }
    }
    const [a, b] = spans[0];
    if (!labeled && (feature.kind !== 'ORF'||index!==null)) labels.push({ text: feature.name, pos: (a - 1 + b) / 2, index, feature: true });
  });
  if (ui.visibility.enzymes) {
    const cutItems = sequenceCuts(doc);
    const stride = Math.max(1, Math.ceil(cutItems.length / 700));
    for (let i = 0; i < cutItems.length; i += stride) labels.push({ text: cutItems[i].name, pos: cutItems[i].cut, cut: cutItems[i] });
  }
  pieces.push(circleLabels(g, labels, zoom, !fit));
  pieces.push('<g class="map-annotation-labels">'+inlineNames.join('')+'</g>');
  pieces.push('<g id="map-selection-handles"></g>');
  return '<svg class="plasmid reference-plasmid interactive-map" tabindex="0" data-sequence-map="circular" data-center-x="' + cx +
    '" data-center-y="' + cy + '" data-radius="' + radius + '" role="img" aria-label="Plasmid map" viewBox="0 0 420 427">' +
    pieces.join('') + '</svg>';
}

function plasmidBaseDetail(doc, g) {
  const fragments = [];
  for (const index of MapNavigation.visibleBasesAt(g.n, g.radius, g.cx,g.cy,ui.rotationBases || 0)) {
    const position = Regions.modulo(index, g.n) + 1;
    const base = baseAtCase(doc, doc.bases[position - 1], position);
    const complement = Lab.complement(base.toUpperCase(), doc.type);
    const tilt = g.angle(index + .5) * 180 / Math.PI + 90;
    for (const [text, distance, strand] of [[base, 29, 'forward'], ...(ui.visibility.complement ? [[base === base.toLowerCase() ? complement.toLowerCase() : complement, 16, 'reverse']] : [])]) {
      const [x, y] = g.point(index + .5, g.radius + distance);
      if (x < -12 || x > 432 || y < -12 || y > 439) continue;
      fragments.push('<text class="plasmid-base nt-' + text.toUpperCase() + '" x="' + x + '" y="' + y + '" transform="rotate(' + tilt + ' ' + x + ' ' + y + ')" ' +
        'text-anchor="middle" font-size="9" data-map-base="' + position + '" aria-label="' + position + ' · ' + text + ' · ' + strand + '">' + esc(text) + '</text>');
    }
  }
  return '<g class="plasmid-base-detail" aria-label="Bases del plásmido ampliado">' + fragments.join('') + '</g>';
}

function linearMapMarkup(doc, { fit = false } = {}) {
  const n = doc.bases.length;
  const zoom = fit ? 0 : linearZoom();
  const left = 15;
  const scale=MapNavigation.linearScale(zoom);
  const track = 390 * scale;
  const viewWidth = track + 28;
  const x = boundary => left + track * boundary / n;
  const cuts = [];
  const levels = [];
  if (ui.visibility.enzymes) for (const item of sequenceCuts(doc).slice(0, 650)) {
    const pos = x(item.cut);
    const width = item.name.length * 6 + 9;
    const label = Math.min(pos + 2, viewWidth - width);
    let tier = levels.findIndex(end => label >= end);
    if (tier < 0) tier = levels.length;
    if (tier >= 19) continue;
    levels[tier] = label + width;

  }
  const y = Math.max(58, 52 + levels.length * 15);
  const paths = ['<g id="map-selection"></g><text x="' + (viewWidth / 2) + '" y="24" text-anchor="middle" class="linear-map-title">' +
    esc(doc.name) + ' (' + n + ' ' + units(doc) + ')</text>'];
  paths.push('<path d="M' + left + ' ' + (y - Math.max(12, levels.length * 15)) + 'V' + y + 'H' + (left + track) +
    'V' + (y - Math.max(12, levels.length * 15)) + '" fill="none" stroke="#a4a4a4" stroke-width=".85"/>');
  if (ui.visibility.indices) {
    paths.push('<path d="M' + left + ' ' + y + 'H' + (left + track) + '" stroke="#77777b"/>');
    const power = Math.pow(10, Math.floor(Math.log10(Math.max(1, n / 6))));
    const stride = ([1, 2, 5, 10].find(step => step * power >= n / 6) || 1) * power;
    for (let i = stride; i < n; i += stride) {
      paths.push('<path d="M' + x(i) + ' ' + y + 'v6" stroke="#85858a"/><text x="' + x(i) +
        '" y="' + (y + 19) + '" text-anchor="middle" font-size="9">' + format(displayBase(doc, i)) + '</text>');
    }
  }
  for (const { item, pos, label, tier } of cuts) {
    const top = y - 11 - tier * 15;
    paths.push('<path d="M' + pos + ' ' + y + 'V' + top + (label < pos ? 'H' + (label + 2) : '') + '" stroke="#b5b5bb" stroke-width=".65"/>' +
      '<text x="' + label + '" y="' + (top - 2) + '" fill="' + cutColor(item, fit) + '" font-size="10.5"' + cutAttrs(item) + '>' + esc(item.name) + '</text>');
  }
  const tracks = featureTracks(mapFeatures(doc,'linear'));
  const trackBottom=y+26+Math.max(1,...tracks.map(item=>item.lane+1))*20;
  const inlineNames=[],externalNames=[];
  tracks.forEach(item => {
    const {feature,index,lane} = item;
    let named=false;const origins=[];
    for (const [a, b] of feature.ranges) {
      const x1 = x(a - 1);
      const x2 = x(b);
      const row = y + 26 + lane * 20;
      const head = featureEnds(feature,a,b).head;
      const tip = head ? Math.min(8, (x2 - x1) / 2) : 0;
      const points = feature.strand < 0 ? [[x1,row+7],[x1+tip,row],[x2,row],[x2,row+14],[x1+tip,row+14]] :
        [[x1,row],[x2-tip,row],[x2,row+7],[x2-tip,row+14],[x1,row+14]];
      const attrs = mapItemAttrs(item) + ' data-strand="' + feature.strand + '" data-head="' + head + '"';
      paths.push('<polygon points="' + points.map(value => value.join(',')).join(' ') + '" fill="' + colorOf(feature.color) +
        '"' + (feature.draft ? ' fill-opacity=".25" stroke-dasharray="3 2"' : '') + ' stroke="#828288" stroke-width=".55"' + attrs + '><title>' + esc(feature.name) + ' · ' + (feature.strand<0?'Reverse ←':'Forward →') + '</title></polygon>');
      origins.push({x:(x1+x2)/2,y:row+14});
      if(!named&&ui.visibility.inlineLabels&&x2-x1>=feature.name.length*6.4+18){
        const labelMin=x1+(feature.strand<0?tip+3:4),labelMax=x2-(feature.strand>0?tip+3:4);
        named=true;inlineNames.push('<text x="'+labelMin+'" y="'+(row+10.5)+'" font-size="10.5" style="fill:'+featureInk(feature.color)+'" data-label-position="inline" data-label-min="'+labelMin+'" data-label-max="'+labelMax+'" data-label-name="'+esc(feature.name)+'"'+mapItemAttrs(item,true)+'>'+esc(feature.name)+'<title>'+esc(feature.name)+'</title></text>');
      }
    }
    if(!named&&(feature.kind!=='ORF'||index!==null))externalNames.push({text:feature.name,x:origins[0].x,origins,item});
  });
  const legend=MapNavigation.placeLabels(externalNames,viewWidth),legendTop=trackBottom+18;
  const background=fit||Theme.effective()!=='dark'?'#ffffff':'#171e2a';
  const leaders=legend.labels.map(label=>label.origins.map(origin=>'<path d="M'+origin.x+' '+origin.y+'V'+(legendTop+label.lane*18-7)+'H'+(label.left+4)+'" stroke="#8e98a6" stroke-width=".6" fill="none" pointer-events="none"/>').join('')).join('');
  paths.splice(1,0,leaders);
  const outside=legend.labels.map(label=>{const top=legendTop+label.lane*18,text=mapText(label.text,Math.floor((label.width-8)/6.4));return '<g><rect x="'+label.left+'" y="'+(top-12)+'" width="'+label.width+'" height="16" fill="'+background+'"/><text x="'+(label.left+4)+'" y="'+top+'" font-size="10.5" data-label-position="external"'+mapItemAttrs(label.item,true)+'>'+esc(text)+'<title>'+esc(label.text)+'</title></text></g>';}).join('');
  paths.push('<g class="map-annotation-labels">'+outside+inlineNames.join('')+'</g>');
  const mapBottom=trackBottom+ (legend.labels.length?legend.height+22:6);
  paths.push('<g id="map-selection-handles"></g>');
  return '<svg class="linear-map-svg interactive-map" tabindex="0" data-sequence-map="linear" data-track-left="' + left +
    '" data-track-width="' + track + '" data-track-y="'+y+'" data-map-bottom="' + mapBottom + '" style="min-width:' + (100 * scale) +
    '%;transform:translateY('+(fit?0:ui.linearPanY||0)+'px)" role="img" aria-label="Linear map" viewBox="0 0 ' + viewWidth + ' ' + (mapBottom + 8) + '">' + paths.join('') + '</svg>';
}

function circleWedge(g, first, count) {
  const { point, n, radius } = g;
  const end = first + Math.min(count, n - .001);
  const out = radius + 9;
  const inside = radius * .38;
  const large = Number(count > n / 2);
  return 'M' + point(first, out).join(' ') + 'A' + out + ' ' + out + ' 0 ' + large + ' 1 ' + point(end, out).join(' ') +
    'L' + point(end, inside).join(' ') + 'A' + inside + ' ' + inside + ' 0 ' + large + ' 0 ' + point(first, inside).join(' ') + 'Z';
}

function paintMapSelection() {
  const doc = active();
  const svg = byId('map-pane')?.querySelector('svg[data-sequence-map]');
  if (!svg || !doc) return;
  const overlay = svg.querySelector('#map-selection');
  const handles = svg.querySelector('#map-selection-handles');
  if (!overlay || !handles) return;
  const region = ui.selection;
  const ranges = region?.ranges || [];
  const marks = region ? [region.start - 1, region.end] :
    Number.isFinite(ui.caret) ? [ui.caret] : [];
  if (svg.dataset.sequenceMap === 'linear') {
    const left = Number(svg.dataset.trackLeft);
    const width = Number(svg.dataset.trackWidth);
    const bottom = Number(svg.dataset.mapBottom);
    const x = boundary => left + width * boundary / doc.bases.length;
    overlay.innerHTML = ranges.map(([a, b]) => '<rect x="' + x(a - 1) + '" width="' + Math.max(1.5, x(b) - x(a - 1)) +
      '" y="28" height="' + (bottom - 28) + '" fill="#dcdcdf"/>').join('');
    handles.innerHTML = marks.map(mark => {
      const px = x(mark);
      return '<path d="M' + px + ' 28V' + bottom + '" stroke="#232327" stroke-width="1.3"/><path d="M' + (px-4) + ' 28h8l-4 9Z" fill="#222"/>';
    }).join('');
    return;
  }
  const g = mapGeometry(doc, Number(svg.dataset.radius));
  const wrapped = ranges.length === 2 && ranges[0][1] === doc.bases.length && ranges[1][0] === 1;
  const sections = wrapped ? [[region.start - 1, region.length]] : ranges.map(([a, b]) => [a - 1, b - a + 1]);
  const fill = ui.selectionSource === 'circular' ? '#f2b52e' : '#b5b6bc';
  overlay.innerHTML = sections.map(([first, count]) => '<path d="' + circleWedge(g, first, count) +
    '" fill="' + fill + '" opacity=".57"/>').join('');
  handles.innerHTML = marks.map(mark => {
    const [x, y] = g.point(mark, g.radius * .43);
    const [u, v] = g.point(mark, g.radius + 8);
    const halfWidth = g.n * 6 / (tau * (g.radius + 13));
    const triangle = [g.point(mark, g.radius + 4), g.point(mark - halfWidth, g.radius + 13), g.point(mark + halfWidth, g.radius + 13)];
    return '<path d="M' + x + ' ' + y + 'L' + u + ' ' + v + '" stroke="#222" stroke-width="1.5"/><polygon points="' +
      triangle.map(value => value.join(',')).join(' ') + '" fill="#222"/>';
  }).join('');
}

const enzymeModes = [['single', 'Single cutters'], ['double', 'Double cutters'],
  ['two', 'Single and double cutters'], ['all', 'All enzymes'], ['none', 'Selected enzymes only']];
const enzymeScopes = [['any', 'Anywhere in the sequence'], ['inside', 'In the current selection'],
  ['only', 'Only in the current selection'], ['outside', 'Anywhere except the current selection']];
const enzymeNames = Object.keys(Lab.enzymes).sort((a, b) => a.localeCompare(b));
let cutCache = { bases: '', topology: '', items: [], grouped: new Map() };

function enzymeIndex(doc) {
  if (cutCache.bases !== doc.bases || cutCache.topology !== doc.topology) {
    const items = Lab.restrictionSites(doc, enzymeNames);
    const grouped = new Map(enzymeNames.map(name => [name, []]));
    for (const item of items) grouped.get(item.name).push(item);
    cutCache = { bases: doc.bases, topology: doc.topology, items, grouped };
  }
  return cutCache;
}

function enzymeInScope(items) {
  if (!ui.selection || !ui.enzymeScope || ui.enzymeScope === 'any') return true;
  const inRange = item => ui.selection.ranges.some(([a, b]) => item.cut >= a - 1 && item.cut < b);
  if (ui.enzymeScope === 'inside') return items.some(inRange);
  if (ui.enzymeScope === 'only') return items.length > 0 && items.every(inRange);
  return items.some(item => !inRange(item));
}

function sequenceCuts(doc) {
  if (doc.type !== 'DNA') return [];
  const { items, grouped } = enzymeIndex(doc);
  const selected = new Set(ui.selectedEnzymes || []);
  const mode = ui.enzymeMode || 'two';
  const cohesive = compatibleEnds(grouped);
  const catalog = new Set(catalogEnzymes());
  for (const name of catalog) {
    const sites = grouped.get(name);
    const count = sites.length;
    if (count > 0 && (mode === 'all' || mode === 'two' && count <= 2 || mode === 'single' && count === 1 || mode === 'double' && count === 2) &&
      enzymeInScope(sites)) selected.add(name);
  }
  return items.filter(site => selected.has(site.name) || catalog.has(site.name) && matchesEnd(site, cohesive));
}

let cohesiveCache;
function compatibleEnds(grouped) {
  if (!ui.showCompatible || !ui.selectedEnzymes?.length) return null;
  const names = ui.selectedEnzymes;
  if (cohesiveCache?.grouped === grouped && cohesiveCache.names === names) return cohesiveCache.ends;
  const ends = new Set();
  for (const name of names) for (const site of grouped.get(name) || []) {
    if (!/^[ACGT]+$/.test(site.overhang)) continue;
    ends.add(site.end + ':' + site.overhang);
    ends.add(site.end + ':' + Lab.reverseComplement(site.overhang));
  }
  cohesiveCache = { grouped, names, ends };
  return ends;
}

const matchesEnd = (site, ends) => Boolean(ends?.has(site.end + ':' + site.overhang));

const cutValue = site => site.name + ':' + site.cut;
function cutColor(site, paper = false) {
  const dark = !paper && Theme.effective() === 'dark';
  const index = (ui.selectedEnzymes || []).indexOf(site.name);
  if (index >= 0) return (dark ? ['#89b7f4', '#e998c8', '#9fcd88', '#e8ad79', '#b7a0e4'] : ['#1057a4', '#a22673', '#347721', '#91430a', '#66339f'])[index % 5];
  return matchesEnd(site, compatibleEnds(cutCache.grouped)) ? dark ? '#87d7bc' : '#15806b' : dark ? '#b9c4d5' : '#49494e';
}

function jumpToCut(value, surface = 'sequence', extend = false) {
  const [name, boundary] = value.split(':');
  if (!enzymeNames.includes(name) || !/^\d+$/.test(boundary)) return;
  const doc = active();
  const from = ui.anchor;
  let to = Number(boundary);
  if (extend && Number.isFinite(from) && from !== to) {
    const circular = doc.topology === 'circular';
    if (circular && to < from) to += doc.bases.length;
    setBoundaries(from, to, surface, circular, Number(boundary) + 1);
  } else setCaret(to, surface, true);
}

const translationCache = new WeakMap();
function codonStrip(doc, feature, left, width) {
  let cached = translationCache.get(feature);
  const options=Protein.featureOptions(feature),key=JSON.stringify(options);
  if (!cached || cached.bases !== doc.bases || cached.key!==key) {
    const fragment = feature.ranges.map(([a, b]) => doc.bases.slice(a - 1, b)).join('');
    let protein='';try{protein=Protein.translate(fragment,options);}catch{}
    cached = { bases: doc.bases, protein, length: fragment.length, key };
    translationCache.set(feature, cached);
  }
  const positions = [];
  let offset = 0;
  for (const [a, b] of feature.ranges) {
    for (let pos = Math.max(left, a); pos <= Math.min(left + width - 1, b); pos++) {
      const index = offset + pos - a;
      const proteinIndex = (feature.strand > 0 ? index : cached.length - index - 1)-options.offset;
      const aa = proteinIndex>=0?cached.protein[Math.floor(proteinIndex / 3)]:null;
      positions.push(aa ? '<span style="background:' + aminoColor(aa) + '">' + (proteinIndex % 3 === 1 ? esc(aa) : '&nbsp;') + '</span>' : '<span></span>');
    }
    offset += b - a + 1;
  }
  return '<span class="codon-strip">' + positions.join('') + '</span>';
}

  for (const attr of ['class', 'style', 'tabindex', ...svg.getAttributeNames().filter(name => name.startsWith('data-'))]) svg.removeAttribute(attr);

async function mapImage(map) {
  const source = URL.createObjectURL(new Blob([map.text], { type: 'image/svg+xml' }));
  try {
    const image = new Image();
    image.src = source;
    await image.decode();
    const canvas = document.createElement('canvas');
    const scale = Math.min(3, 4200 / Math.max(map.width, map.height));
    canvas.width = Math.round(map.width * scale);
    canvas.height = Math.round(map.height * scale);
    const context = canvas.getContext('2d');
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    return canvas;
  } finally { URL.revokeObjectURL(source); }
}

function mapPDFFile(jpeg, imageWidth, imageHeight) {
  const pageWidth = 595;
  const pageHeight = 842;
  const ratio = Math.min((pageWidth - 56) / imageWidth, (pageHeight - 56) / imageHeight);
  const w = (imageWidth * ratio).toFixed(3);
  const h = (imageHeight * ratio).toFixed(3);
  const stream = 'q\n' + w + ' 0 0 ' + h + ' ' + ((pageWidth - w) / 2).toFixed(3) + ' ' + ((pageHeight - h) / 2).toFixed(3) + ' cm\n/Map Do\nQ\n';
  const objects = [
    ['<< /Type /Catalog /Pages 2 0 R >>'],
    ['<< /Type /Pages /Count 1 /Kids [3 0 R] >>'],
    ['<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Map 4 0 R >> >> /Contents 5 0 R >>'],
    ['<< /Type /XObject /Subtype /Image /Width ' + imageWidth + ' /Height ' + imageHeight +
      ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpeg.length + ' >>\nstream\n', jpeg, '\nendstream'],
    ['<< /Length ' + stream.length + ' >>\nstream\n', stream, 'endstream'],
  ];
  const chunks = [];
  let cursor = 0;
  const append = chunk => { chunks.push(chunk); cursor += chunk.length; };
  append('%PDF-1.4\n');
  const offsets = [0];
  for (const [index, parts] of objects.entries()) {
    offsets.push(cursor);
    append((index + 1) + ' 0 obj\n');
    parts.forEach(append);
    append('\nendobj\n');
  }
  const xref = cursor;
  append('xref\n0 ' + offsets.length + '\n0000000000 65535 f \n');
  for (const offset of offsets.slice(1)) append(String(offset).padStart(10, '0') + ' 00000 n \n');
  append('trailer\n<< /Size ' + offsets.length + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  return new Blob(chunks, { type: 'application/pdf' });
}

async function mapPDFPreview() {
  const map = exportMapSource();
  show('PDF Preview', '<p class="muted" id="map-pdf-status">Preparing PDF…</p><div class="map-pdf-preview" id="map-pdf-preview"></div>', null, '', '');
  const preview = byId('map-pdf-preview');
  try {
    const canvas = await mapImage(map);
    if (!dialog.open || !preview.isConnected) return;
    const jpeg = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', .96));
    if (!dialog.open || !preview.isConnected) return;
    if (!jpeg) throw Error('No se pudo generar la imagen del mapa.');
    const pdf = mapPDFFile(new Uint8Array(await jpeg.arrayBuffer()), canvas.width, canvas.height);
    if (!dialog.open || !preview.isConnected) return;
    byId('map-pdf-status').textContent = 'Page 1 of 1';
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', 'Preview of ' + map.name);
    preview.append(canvas);
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'primary';
    button.textContent = 'Download';
    button.addEventListener('click', () => download(map.name + '.pdf', pdf));
    byId('dialog-footer').append(button);
  } catch (error) {
    if (preview.isConnected) byId('map-pdf-status').textContent = error.message;
  }
}

const digestWorkspaces = new Map();
const digestKey = doc => Team.scope() + ':' + doc.id;

function digestWorkspace(doc) {
  const key = digestKey(doc);
  let state = digestWorkspaces.get(key);
  if (!state) {
    state = { tabs: [], drafts: new Map(), results: new Map(), bases: doc.bases, topology: doc.topology, highlight: '', ladder: 'life' };
    digestWorkspaces.set(key, state);
    if (digestWorkspaces.size > 30) digestWorkspaces.delete(digestWorkspaces.keys().next().value);
  }
  if (state.bases !== doc.bases || state.topology !== doc.topology) {
    state.results.clear();
    state.highlight = '';
    state.bases = doc.bases;
    state.topology = doc.topology;
  }
  return state;
}

function openDigests(doc) {
  if (doc.type !== 'DNA') return [];
  const state = digestWorkspaces.get(digestKey(doc));
  if (!state) return [];
  const saved = new Map((doc.digests || []).map(item => [item.id, item]));
  const entries = state.tabs.map(id => saved.get(id) || state.drafts.get(id)).filter(Boolean);
  state.tabs = entries.map(item => item.id);
  return entries;
}

function digestResult(doc, entry) {
  const state = digestWorkspace(doc);
  const key = entry.enzymes.join(':');
  let result = state.results.get(key);
  if (!result) {
    result = Lab.digest(doc, entry.enzymes);
    if (state.results.size >= 12) state.results.delete(state.results.keys().next().value);
    state.results.set(key, result);
  }
  return result;
}

function openDigest(doc, entry) {
  const state = digestWorkspace(doc);
  const tabs = openDigests(doc);
  if (!tabs.some(item => item.id === entry.id)) {
    if (tabs.length >= 12) throw Error('Close a digest tab before opening another lane.');
    state.tabs.push(entry.id);
    if (!doc.digests?.some(item => item.id === entry.id)) state.drafts.set(entry.id, entry);
  }
  const wasSplit = ui.split;
  ui.split = true;
  ui.pane = 'digest:' + entry.id;
  if (wasSplit) renderMap();
  else renderEditor();
}

function digestProductRows(doc, entry, result) {
  const highlight = digestWorkspace(doc).highlight;
  const ends = sites => [sites.map(site => site.name).join(', '),
    sites.map(site => site.overhang ? site.end + ' ' + site.overhang : 'Blunt').join(', ')];
  return result.products.slice(0, 500).map((product, index) => {
    const key = entry.id + ':' + index;
    const selected = highlight === key;
    const positions = [digestPosition(doc, product.start), digestPosition(doc, product.end), format(product.length)];
    return '<tr data-product="' + key + '" data-action="digest-fragment" data-value="' + key +
      '" class="digest-product' + (selected ? ' highlighted' : '') + '">' +
      '<td>' + btn(positions[0], 'digest-fragment', attr(key, 'aria-pressed="' + selected + '" aria-label="Select fragment ' +
        positions[0] + ' to ' + positions[1] + '"')) + '</td>' + [...positions.slice(1), ...ends(product.left), ...ends(product.right)].map(cell =>
        '<td>' + esc(cell || '—') + '</td>').join('') + '</tr>';
  }).join('');
}

function digestResultMarkup(doc, entry) {
  const result = digestResult(doc, entry);
  const counts = new Map(entry.enzymes.map(name => [name, 0]));
  for (const site of result.sites) counts.set(site.name, counts.get(site.name) + 1);
  const rows = entry.enzymes.map(name => [esc(name), format(counts.get(name)), '<code>' + esc(Lab.enzymes[name][0]) + '</code>']);
  const selected = digestWorkspace(doc).highlight.startsWith(entry.id + ':');

    btn('Create fragment', 'digest-create-fragment', attr(entry.id, 'id="digest-fragment-create"' + (!Team.writable() || !selected ? ' disabled' : ''))) + '</div>' +
    tableView(['Enzymes', 'Cuts', 'Recognition'], rows) +

    '</tr></thead><tbody>' + digestProductRows(doc, entry, result) + '</tbody></table></div>' +

    (result.sites.length ? digestCutTable(doc, result.sites) : '<p class="muted">No cuts found. The intact template is shown by length.' +
      (doc.topology === 'circular' ? ' Gel positions assume linear DNA.' : '') + '</p>') + '</div>';
}

function digestCutTable(doc, sites) {
  const coordinate = cut => digestPosition(doc, cut || (doc.topology === 'circular' ? doc.bases.length : 0));
  const rows = sites.slice(0, 500).map(site => [esc(site.name), digestPosition(doc, site.position),
    btn(coordinate(site.cut), 'map-cut', attr(cutValue(site))), coordinate(site.bottom), site.overhang ? site.end + ' ' + site.overhang : 'Blunt']);
  return '<details class="digest-cut-details"><summary>Cut sites (' + format(sites.length) + ')</summary>' +
    tableView(['Enzyme', 'Recognition start', '5′→3′ cut', '3′→5′ cut', 'Overhang'], rows) +
    (sites.length > 500 ? '<p class="muted">First 500 sites.</p>' : '') + '</details>';
}

function chosenLadder(doc) {
  return gelLadders().find(item => item.id === digestWorkspace(doc).ladder) || standardLadders[0];
}

const fragmentSize = bp => bp >= 1000 ? (bp / 1000).toFixed(1) + ' kb' : bp + ' bp';

function gelLadderLabels(bands, scale, height) {
  const stride = Math.ceil(bands.length / 35);
  const labels = bands.filter((_, index) => index % stride === 0 || index === bands.length - 1)
    .map(bp => ({ bp, y: scale(bp) }));
  const gap = 11;
  for (let i = 1; i < labels.length; i++) labels[i].y = Math.max(labels[i].y, labels[i - 1].y + gap);
  let bottom = height - 19;
  for (let i = labels.length - 1; i >= 0; i--) {
    labels[i].y = Math.min(labels[i].y, bottom);
    bottom = labels[i].y - gap;
  }
  return labels.map(({ bp, y }) => {
    const target = scale(bp);
    const leader = Math.abs(target - y) > 2 ? '<path d="M61 ' + y.toFixed(2) + 'L68 ' + target.toFixed(2) +
      '" class="gel-guide" stroke="' + gelPalette().guide + '" stroke-width=".55" fill="none"/>' : '';
    return '<text x="59" y="' + (y + 3).toFixed(2) + '" text-anchor="end">' + fragmentSize(bp) + '</text>' + leader;
  }).join('');
}

function gelPalette(theme = Theme.effective()) {
  return theme === 'dark' ? { background: '#111722', bed: '#080d15', ink: '#ffffff', band: '#ffffff', ladder: '#ffffff', selected: '#ffffff', guide: '#8894a7', highlight: '#e6bf69' } :
    { background: '#ffffff', bed: '#ededed', ink: '#202020', band: '#202020', ladder: '#636363', selected: '#b8750f', guide: '#aaaaaa', highlight: '#b8750f' };
}

function gelMarkup(doc, entries, interactive = true) {
  const palette = gelPalette();
  const ladder = chosenLadder(doc);
  const lanes = entries.map(entry => ({ entry, products: digestResult(doc, entry).products }));
  const width = 72 + (lanes.length + 1) * 92;
  const height = 478;
  let max = ladder.bands[0];
  let min = ladder.bands.at(-1);
  for (const { products } of lanes) for (const product of products) {
    max = Math.max(max, product.length);
    min = Math.min(min, product.length);
  }
  const scale = bp => 46 + (height - 76) * Math.log(max / bp) / Math.log(max / min);
  const band = (bp, lane, fill, thickness, title = '', type = 'sample') => '<line class="gel-' + type + '-band" x1="' + (88 + lane * 92) + '" x2="' +
    (144 + lane * 92) + '" y1="' + scale(bp).toFixed(2) + '" y2="' + scale(bp).toFixed(2) + '" stroke="' + fill +
    '" stroke-width="' + thickness + '"><title>' + esc(title || bp + ' bp') + '</title></line>';
  const reference = gelLadderLabels(ladder.bands, scale, height) + ladder.bands.map(bp => band(bp, 0, palette.ladder, 3.5, '', 'ladder')).join('');
  const highlight = digestWorkspace(doc).highlight;
  const samples = lanes.map(({ entry, products }, lane) => {
    const bands = new Map();
    products.forEach((product, index) => {
      const key = entry.id + ':' + index;
      if (!bands.has(product.length)) bands.set(product.length, []);
      bands.get(product.length).push(key);
    });
    return '<text x="' + (116 + (lane + 1) * 92) + '" y="22" text-anchor="middle">' + (lane + 1) + '</text>' +
      [...bands].sort(([a], [b]) => b - a).slice(0, 2000).map(([bp, keys], index, sorted) => {
        const active = keys.includes(highlight);
        const line = (active ? '<rect class="gel-band-outline" x="' + (84 + (lane + 1) * 92) + '" y="' + (scale(bp) - 7) +
          '" width="64" height="14" rx="2" fill="none" stroke="' + palette.highlight + '"/>' : '') +
          band(bp, lane + 1, active ? palette.selected : palette.band, Math.min(8, 2 + keys.length),
          digestLabel(doc, entry) + ' · ' + bp + ' bp' + (keys.length > 1 ? ' × ' + keys.length : ''), active ? 'selected' : 'sample');
        if (!interactive) return line;
        const y = scale(bp);
        const top = index ? Math.max(y - 5, (y + scale(sorted[index - 1][0])) / 2) : y - 5;
        const bottom = index + 1 < sorted.length ? Math.min(y + 5, (y + scale(sorted[index + 1][0])) / 2) : y + 5;
        return '<g class="gel-band" data-action="digest-band" data-value="' + entry.id + ':' + bp + '" role="button" tabindex="0" ' +
          'aria-label="Lane ' + (lane + 1) + ', ' + bp + ' bp"><rect x="' + (86 + (lane + 1) * 92) + '" y="' + top +
          '" width="60" height="' + (bottom - top) + '" fill="transparent"/>' + line + '</g>';
      }).join('');
  }).join('');
  return '<svg xmlns="http://www.w3.org/2000/svg" class="virtual-gel-svg" width="' + width + '" height="' + height + '" viewBox="0 0 ' + width + ' ' + height +
    '" role="' + (interactive ? 'group' : 'img') + '" aria-label="Virtual digest gel" fill="' + palette.ink + '" font-family="Arial, sans-serif" font-size="11"><rect class="gel-background" width="100%" height="100%" fill="' + palette.background + '"/>' +
    '<rect class="gel-bed" x="71" y="32" width="' + (width - 72) + '" height="' + (height - 43) + '" fill="' + palette.bed + '"/>' +
    '<text x="116" y="22" text-anchor="middle">Ladder</text>' + reference + samples + '</svg>';
}

function virtualDigestMarkup(doc, entries) {
  const ladder = chosenLadder(doc);
  const [id, index] = digestWorkspace(doc).highlight.split(':');
  const highlighted = entries.find(entry => entry.id === id);
  const product = highlighted && digestResult(doc, highlighted).products[Number(index)];
  const legend = [['Ladder', esc(ladder.name), ''], ...entries.map((entry, i) => [i + 1, esc(digestLabel(doc, entry)),
    btn('←', 'digest-shift', attr(entry.id + ':-1', 'aria-label="Move lane ' + (i + 1) + ' left"' + (i === 0 ? ' disabled' : ''))) +
    btn('→', 'digest-shift', attr(entry.id + ':1', 'aria-label="Move lane ' + (i + 1) + ' right"' + (i === entries.length - 1 ? ' disabled' : '')))])];
  return '<div class="digest-page"><div class="toolbar digest-gel-tools">' + field('Ladder', select('gel-ladder', gelLadders().map(item => [item.id, item.name]), ladder.id)) +
    btn('Download PNG', 'digest-png') + btn('Download SVG', 'digest-svg') + btn('Manage ladders', 'molecular-settings', attr('ladders')) + '</div>' +
    '<p class="gel-highlight"><b>Highlighted Fragment</b> ' + (product ? esc(digestLabel(doc, highlighted)) + ' · ' + format(product.length) +
      ' bp · ' + digestPosition(doc, product.start) + '–' + digestPosition(doc, product.end) : '—') + '</p>' +
    tableView(['Lane', 'Sample', 'Order'], legend) + '<div class="virtual-gel">' + gelMarkup(doc, entries) + '</div></div>';
}

function digestEntry(id) { return openDigests(active()).find(entry => entry.id === id); }

function digestSelection(value) {
  const [id, index] = value.split(':');
  const doc = active();
  const entry = digestEntry(id);
  const product = entry && digestResult(doc, entry).products[Number(index)];
  if (!product) return;
  digestWorkspace(doc).highlight = value;
  selectRange(product.start, product.end);
  if (ui.pane === 'virtual-digest') {
    const band = document.activeElement?.dataset.action === 'digest-band' ? document.activeElement.dataset.value : null;
    renderMap();
    if (band) document.querySelector('[data-action="digest-band"][data-value="' + CSS.escape(band) + '"]')?.focus({ preventScroll: true });
  }
  else {
    for (const row of document.querySelectorAll('[data-product]')) {
      const selected = row.dataset.product === value;
      row.classList.toggle('highlighted', selected);
      row.querySelector('button').setAttribute('aria-pressed', String(selected));
    }
    const create = byId('digest-fragment-create');
    if (create) create.disabled = !Team.writable();
  }
}

function digestSave(id) {
  const doc = active();
  const entry = digestEntry(id);
  const name = byId('digest-name')?.value.trim();
  if (!entry || !Team.writable()) return;
  if (!settingsName(name)) throw Error('Enter a digest name of up to 160 characters.');
  const records = doc.digests ||= [];
  if (records.some(item => item.id !== id && item.name.toLowerCase() === name.toLowerCase())) throw Error('This name is already in use.');
  const index = records.findIndex(item => item.id === id);
  if (index < 0 && records.length >= 100) throw Error('This sequence can store up to 100 digests.');
  const saved = { id, name, enzymes: [...entry.enzymes], at: Date.now() };
  remember(doc, 'Before saving digest');
  if (index < 0) records.push(saved);
  else records[index] = saved;
  digestWorkspace(doc).drafts.delete(id);
  touch(doc);
  toast('Digest saved.');
}

function digestClose(id, refresh = true) {
  const doc = active();
  const state = digestWorkspace(doc);
  const index = state.tabs.indexOf(id);
  if (index >= 0) state.tabs.splice(index, 1);
  state.drafts.delete(id);
  if (state.highlight.startsWith(id + ':')) state.highlight = '';
  if (ui.pane === 'digest:' + id) ui.pane = state.tabs.length ? 'digest:' + state.tabs[Math.min(index, state.tabs.length - 1)] : doc.topology === 'circular' ? 'map' : 'linear';
  if (ui.pane === 'virtual-digest' && !state.tabs.length) ui.pane = doc.topology === 'circular' ? 'map' : 'linear';
  if (refresh) renderMap();
}

function digestDelete(id) {
  const doc = active();
  const entry = doc.digests?.find(item => item.id === id);
  if (!entry || !Team.writable()) return;
  show('Delete digest', '<p>Remove the saved digest «' + esc(entry.name) + '» from this sequence?</p>', () => {
    remember(doc, 'Before deleting digest');
    doc.digests = doc.digests.filter(item => item.id !== id);
    digestClose(id, false);
    touch(doc);
  }, 'Delete', '');
}

function createDigestFragment(id) {
  const doc = active();
  const [current, index] = digestWorkspace(doc).highlight.split(':');
  const entry = current === id && digestEntry(id);
  const product = entry && digestResult(doc, entry).products[Number(index)];
  if (!product) return;
  show('Create digest fragment', field('Name', input('name', doc.name + ' – ' + product.length + ' bp', 'maxlength="160" required')) +
    destinationField(), data => {
    const [project, folder] = textOf(data, 'location').split('|');
    const fragment = Regions.fragment(doc, Regions.fromRanges(product.ranges));
    commitDoc(newDoc('sequence', { ...fragment, name: nameOf(data), project, folder, type: 'DNA', topology: 'linear',
      description: 'Virtual digest of ' + doc.name + ' with ' + entry.enzymes.join(', ') + '.', sourceIds: [doc.id] }));
  }, 'Create', '');
}

function reorderDigest(id, destination) {
  const state = digestWorkspace(active());
  const from = state.tabs.indexOf(id);
  if (from < 0 || destination < 0 || destination >= state.tabs.length || destination === from) return;
  state.tabs.splice(from, 1);
  state.tabs.splice(destination, 0, id);
  renderMap();
}

async function downloadGel() {
  const doc = active();
  const entries = openDigests(doc);
  if (!entries.length) return;
  const canvas = await mapImage({ text: gelMarkup(doc, entries, false), width: 72 + (entries.length + 1) * 92, height: 478 });
  const png = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  if (!png) throw Error('Could not generate the gel image.');
  download(doc.name + '-virtual-digest.png', png);
}

document.addEventListener('change', event => {
  if (event.target.name !== 'gel-ladder' || active()?.type !== 'DNA') return;
  digestWorkspace(active()).ladder = event.target.value;
  renderMap();
  document.querySelector('select[name="gel-ladder"]')?.focus();
});

document.addEventListener('keydown', event => {
  if (event.key === 'Enter' && event.target.id === 'digest-name') {
    event.preventDefault();
    runAction('digest-save', ui.pane.slice(7), event);
  }
  if (['Enter', ' '].includes(event.key) && event.target.dataset.action === 'digest-band') {
    event.preventDefault();
    runAction('digest-band', event.target.dataset.value, event);
  }
});

let draggedDigest;
document.addEventListener('dragstart', event => {
  const tab = event.target.closest?.('[data-digest-tab]');
  if (!tab) return;
  draggedDigest = tab.dataset.digestTab;
  event.dataTransfer.setData('text/plain', draggedDigest);
  event.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragover', event => {
  if (draggedDigest && event.target.closest?.('[data-digest-tab]')) event.preventDefault();
});
document.addEventListener('drop', event => {
  const tab = event.target.closest?.('[data-digest-tab]');
  if (!draggedDigest || !tab) return;
  event.preventDefault();
  reorderDigest(draggedDigest, digestWorkspace(active()).tabs.indexOf(tab.dataset.digestTab));
  draggedDigest = null;
});
document.addEventListener('dragend', () => { draggedDigest = null; });

const digestActions = {
  'digest-open': id => {
    const doc = active();
    const entry = doc.digests?.find(item => item.id === id);
    if (entry) openDigest(doc, entry);
  },
  'digest-close': digestClose,
  'digest-save': digestSave,
  'digest-delete': digestDelete,
  'digest-fragment': digestSelection,
  'digest-create-fragment': createDigestFragment,
  'digest-band': value => {
    const [id, bp] = value.split(':');
    const doc = active();
    const entry = digestEntry(id);
    const matches = entry && digestResult(doc, entry).products.flatMap((item, i) => item.length === Number(bp) ? [i] : []);
    if (!matches?.length) return;
    const current = matches.findIndex(i => id + ':' + i === digestWorkspace(doc).highlight);
    digestSelection(id + ':' + matches[(current + 1) % matches.length]);
  },
  'digest-shift': value => {
    const [id, delta] = value.split(':');
    reorderDigest(id, digestWorkspace(active()).tabs.indexOf(id) + Number(delta));
  },
  'digest-png': downloadGel,
  'digest-svg': () => {
    const doc = active(), entries = openDigests(doc);
    if (entries.length) download(doc.name + '-virtual-digest.svg', gelMarkup(doc, entries, false), 'image/svg+xml');
  },
};

const Primer = (() => {
  const normalized = value => String(value || '').replace(/\s/g, '').toUpperCase();
  const alphabet = type => type === 'RNA' ? /^[ACGU]+$/ : /^[ACGT]+$/;
  const asDNA = value => value.replaceAll('U', 'T');
  const toType = (value, type) => type === 'RNA' ? value.replaceAll('T', 'U') : asDNA(value);

  function binding(doc, primer) {
    const bases = normalized(primer.bases);
    const { overhang, strand, position, type } = primer;
    const anneal = bases.length - overhang;
    if (!alphabet(type).test(bases) || bases.length > 200 || !Number.isInteger(overhang) || overhang < 0 || anneal < 6 ||
      !Number.isInteger(position) || position < 1 || position > doc.bases.length || anneal > doc.bases.length) return null;
    const n = doc.bases.length;
    const circular = doc.topology === 'circular';
    const left = strand > 0 ? position - anneal : position - 1;
    const right = left + anneal;
    if (!circular && (left < 0 || right > n)) return null;
    const region = Regions.boundaries(left, right, n, circular);
    const forward = region.ranges.map(([a, b]) => doc.bases.slice(a - 1, b)).join('');
    const reference = toType(strand > 0 ? forward : Lab.reverseComplement(forward), type);
    const matches = [...bases.slice(overhang)].map((base, i) => base === reference[i]);
    const count = matches.filter(Boolean).length;
    return { ...region, reference, matches, count, anneal, position };
  }

  function fromSelection(doc, region, type, strand) {
    if (!region || region.length < 6 || region.length > 200) return null;
    const wrapped = region.ranges.length === 2 && region.ranges[0][1] === doc.bases.length && region.ranges[1][0] === 1;
    if (region.ranges.length !== 1 && !wrapped) return null;
    const forward = region.ranges.map(([a, b]) => doc.bases.slice(a - 1, b)).join('');
    const bases = toType(strand > 0 ? forward : Lab.reverseComplement(forward), type);
    if (!alphabet(type).test(bases)) return null;
    return { bases, strand, type, overhang: 0, position: strand > 0 ? region.end : region.start };
  }

  function search(doc, source, options) {
    const { bases, type } = source;
    if (!alphabet(type).test(bases) || bases.length > 200 || bases.length < options.minimum) return [];
    const primer = asDNA(bases);
    const n = doc.bases.length;
    const circular = doc.topology === 'circular';
    const hits = [];
    const inside = position => options.first <= options.last ? position >= options.first && position <= options.last :
      position >= options.first || position <= options.last;
    for (const strand of [1, -1]) {
      const sequence = strand > 0 ? doc.bases : Lab.reverseComplement(doc.bases);
      const terminal = primer.at(-1);
      for (let end = sequence.indexOf(terminal); end !== -1; end = sequence.indexOf(terminal, end + 1)) {
        const position = strand > 0 ? end + 1 : n - end;
        if (!options.unique && !inside(position)) continue;
        const maxLength = Math.min(primer.length, circular ? n : end + 1);
        let count = 0;
        let errors = 0;
        let gap = 0;
        let anneal = 0;
        for (let i = 0; i < maxLength; i++) {
          if (primer[primer.length - i - 1] === sequence[(end - i + n) % n]) {
            gap = 0;
            count++;
            anneal = i + 1;
          } else if (++gap > options.gap || ++errors > options.mismatches) break;
        }
        if (count < options.minimum || options.entire && count !== primer.length) continue;
        const candidate = { ...source, strand, position, overhang: primer.length - anneal };
        const temperature = type === 'DNA' ? Regions.melting(bases.slice(candidate.overhang), options.salt, options.concentration) : null;
        if (temperature !== null && (temperature < options.minTm || temperature > options.maxTm)) continue;
        hits.push({ ...candidate, count, anneal, temperature });
        if (hits.length > 1000) throw Error('The oligo has more than 1,000 possible sites. Narrow the search.');
      }
    }
    return options.unique ? hits.length === 1 && inside(hits[0].position) ? hits : [] : hits;
  }

  function pairRegion(doc, forward, reverse) {
    const f = binding(doc, forward);
    const r = binding(doc, reverse);
    if (!f || !r || !f.matches.at(-1) || !r.matches.at(-1) || f.count < 6 || r.count < 6 ||
      forward.strand !== 1 || reverse.strand !== -1 || forward.type !== 'DNA' || reverse.type !== 'DNA') return null;
    const circular = doc.topology === 'circular';
    const n = doc.bases.length;
    const length = circular ? Regions.modulo(r.end - f.start, n) + 1 : r.end - f.start + 1;
    const productLength = length + forward.overhang + reverse.overhang;
    if (length < f.anneal + r.anneal || productLength > 250000) return null;
    const region = Regions.positions(f.start, r.end, n, circular);
    return { f, r, region, length, productLength };
  }

  function pairedProduct(doc, forward, reverse, { annotations = true, primers = true } = {}) {
    const pair = pairRegion(doc, forward, reverse);
    if (!pair) return null;
    const { f, r, region, length } = pair;
    const fragment = Regions.fragment(doc, region, { annotations, translations: annotations, primers: false });
    const shift = forward.overhang;
    const middle = fragment.bases.slice(f.anneal, length - r.anneal);
    const bases = forward.bases + middle + Lab.reverseComplement(reverse.bases);
    const features = fragment.features.map(item => ({ ...item, ranges: item.ranges.map(([a, b]) => [a + shift, b + shift]) }));
    if (primers) features.push({ name: forward.name, kind: 'primer_bind', strand: 1, color: forward.color,
      ranges: [[1, forward.bases.length]] }, { name: reverse.name, kind: 'primer_bind', strand: -1, color: reverse.color,
      ranges: [[bases.length - reverse.bases.length + 1, bases.length]] });
    const lowercase = fragment.lowercase.flatMap(([a, b]) => {
      const left = Math.max(a, f.anneal + 1);
      const right = Math.min(b, length - r.anneal);
      return left <= right ? [[left + shift, right + shift]] : [];
    });
    return { bases, features, lowercase, region };
  }

  return { normalized, alphabet, toType, binding, fromSelection, search, pairRegion, pairedProduct };
})();

const primerViews = new Map();
const primerWorkspaceKey = doc => Team.scope() + ':' + doc.id;
const primerStrands = [[1, 'Forward'], [-1, 'Reverse']];

function primerWorkspace(doc) {
  const key = primerWorkspaceKey(doc);
  if (!primerViews.has(key)) {
    primerViews.set(key, { panel: 'primers', chosen: [], draft: null, find: null, wizard: null });
    if (primerViews.size > 25) primerViews.delete(primerViews.keys().next().value);
  }
  return primerViews.get(key);
}

function blankPrimer(strand, position = 1) {
  return { strand, position, name: '', bases: '', overhang: 0, enzyme: '', color: strand > 0 ? '#a2c8ef' : '#bfade7' };
}

function revealPrimerPane(pane) {
  ui.pane = pane;
  ui.split = true;
  ui.primerOpen = false;
  renderEditor();
}

function openPrimerDesigner(value = '') {
  const doc = active();
  if (doc?.type !== 'DNA') return;
  const strand = Number(value) === -1 ? -1 : 1;
  const initial = value && Primer.fromSelection(doc, ui.selection, 'DNA', strand);
  primerWorkspace(doc).draft = { pair: false, strand, type: 'DNA', location: doc.project + '|' + doc.folder,
    rows: { 1: blankPrimer(1, Math.min(doc.bases.length, (ui.caret ?? 0) + 1)),
      '-1': blankPrimer(-1, Math.min(doc.bases.length, (ui.caret ?? 0) + 1)) } };
  if (initial) Object.assign(primerWorkspace(doc).draft.rows[strand], initial);
  revealPrimerPane('primer-designer');
}

function primerDraftRows(draft) {
  return draft.pair ? [draft.rows[1], draft.rows[-1]] : [draft.rows[draft.strand]];
}

function primerRadio(name, options, selected) {
  return '<div class="primer-radio">' + options.map(([value, label]) => '<label><input type="radio" name="' + name +
    '" value="' + value + '"' + (String(value) === String(selected) ? ' checked' : '') + '> ' + label + '</label>').join('') + '</div>';
}

const primerField = (key, strand, control) => control.replace('<input ', '<input data-primer-field="' + key + '" data-strand="' + strand + '" ')
  .replace('<textarea ', '<textarea data-primer-field="' + key + '" data-strand="' + strand + '" ')
  .replace('<select ', '<select data-primer-field="' + key + '" data-strand="' + strand + '" ');

function primerDesignFields(doc, row, pair) {
  const direction = row.strand > 0 ? 'Forward' : 'Reverse';
  const coordinate = row.position === '' ? '' : displayBase(doc, row.position);
  const number = 'type="number" min="' + displayBase(doc, 1) + '" max="' + displayBase(doc, doc.bases.length) + '"';
  const named = label => pair ? direction + ' ' + label : label;
  const fieldFor = (label, key, control) => field(named(label), primerField(key, row.strand, control));
  return '<div class="primer-design-row" data-primer-row="' + row.strand + '">' + (pair ? '<h4>' + direction + '</h4>' : '') +
    fieldFor('Bases (5′→3′)', 'bases', area('bases', row.bases, 'rows="2" maxlength="350" spellcheck="false" class="mono"')) +
    '<div class="primer-bases-preview" data-primer-preview></div><div class="dialog-grid">' +
    fieldFor('3′ Location', 'position', input('position', coordinate, number)) +
    fieldFor('Overhang (bp)', 'overhang', input('overhang', row.overhang, 'type="number" min="0" max="194"')) + '</div>' +
    '<div class="primer-cut-lookup">' + fieldFor('Cut Site', 'enzyme', select('enzyme', [['', 'Enzyme'], ...enzymeNames.map(name => [name, name])], row.enzyme)) +
    '<code data-primer-motif>' + esc(Lab.enzymes[row.enzyme]?.[0] || '') + '</code></div><div class="primer-binding-status" data-primer-binding></div></div>';
}

function primerDesignerMarkup(doc) {
  const draft = primerWorkspace(doc).draft;
  if (!draft) return empty('Open the primer designer from the Primers panel.');
  const rows = primerDraftRows(draft);
  return '<div class="primer-designer"><div class="toolbar primer-design-toolbar">' +
    '<select id="primer-design-mode" aria-label="Primer design mode">' + option('single', 'Single Primer', draft.pair ? 'pair' : 'single') +
    option('pair', 'Primer Pair', draft.pair ? 'pair' : 'single') + '</select><span class="toolbar-gap"></span>' +
    btn('Jump to Primer' + (draft.pair ? ' ⌄' : ''), 'primer-jump-menu') +
    btn('Set from Selection ⌄', 'primer-selection-menu', 'class="primary" data-primer-use-selection') + '</div>' +
    '<div class="primer-designer-body"><fieldset><legend>Design</legend><div class="primer-option"><b>Nucleotide Type</b>' +
    primerRadio('primer-type', [['DNA', 'DNA'], ['RNA', 'RNA']], draft.type) + '</div>' +
    (draft.pair ? '' : '<div class="primer-option"><b>Strand</b>' + primerRadio('primer-strand', primerStrands, draft.strand) + '</div>') +
    rows.map(row => primerDesignFields(doc, row, draft.pair)).join('') + '</fieldset>' +
    '<fieldset><legend>Verify</legend><div class="toolbar">' + btn('Check Secondary Structure', 'primer-structure') +
    btn('Tm parameters', 'melting-options') + '</div><div id="primer-design-metrics"></div></fieldset>' +
    '<fieldset><legend>Save</legend>' + rows.map(row => '<div class="primer-name-row">' +
      field(draft.pair ? (row.strand > 0 ? 'Forward' : 'Reverse') + ' name' : 'Name', primerField('name', row.strand,
        input('name', row.name, 'placeholder="Enter a short name" maxlength="160"'))) +
      '<label class="field"><span>Color</span>' + primerField('color', row.strand, '<input type="color" value="' + colorOf(row.color) + '">') + '</label></div>').join('') +
    field('Save To', '<select id="primer-destination" aria-label="Save To">' + destinations().map(([value, label]) => option(value, label, draft.location)).join('') + '</select>') +
    btn(draft.pair ? 'Save Primer Pair' : 'Save Primer', 'primer-store', 'class="primary" id="save-designed-primer"') + '</fieldset></div></div>';
}

function primerMetrics(row, type) {
  const bases = Primer.normalized(row.bases);
  if (!Primer.alphabet(type).test(bases)) return ['—', '—', bases.length + ' bp'];
  const anneal = bases.slice(row.overhang);
  const tm = type === 'DNA' ? Regions.melting(anneal, ui.tmSalt, ui.tmConcentration) : null;
  return [Number.isFinite(tm) ? tm.toFixed(1) + ' °C' : '—', Lab.gc(bases) + '%', bases.length + ' bp'];
}

function paintPrimerDesigner() {
  const metrics = byId('primer-design-metrics');
  if (!metrics) return;
  const doc = active();
  const draft = primerWorkspace(doc).draft;
  const rows = primerDraftRows(draft);
  let valid = canEditSequence();
  for (const row of rows) {
    const node = document.querySelector('[data-primer-row="' + row.strand + '"]');
    const bases = Primer.normalized(row.bases);
    const bind = Primer.binding(doc, { ...row, type: draft.type });
    valid &&= Boolean(bind && bind.count >= 6 && bind.matches.at(-1) && settingsName(row.name));
    node.querySelector('[data-primer-preview]').innerHTML = [...bases.slice(0, 200)].map((base, i) => '<span class="' +
      (i < row.overhang ? 'primer-tail' : bind?.matches[i - row.overhang] ? 'primer-match' : 'primer-mismatch') + '">' + esc(base) + '</span>').join('');
    node.querySelector('[data-primer-motif]').textContent = Lab.enzymes[row.enzyme]?.[0] || '';
    node.querySelector('[data-primer-binding]').textContent = bind ? bind.count + ' / ' + bind.anneal + ' matched · ' +
      bind.ranges.map(([a, b]) => displayBase(doc, a) + '–' + displayBase(doc, b)).join(', ') +
      (bind.matches.at(-1) ? '' : ' · 3′ mismatch') : 'Enter at least 6 binding bases and a valid 3′ location.';
  }
  metrics.innerHTML = tableView([draft.pair ? 'Strand' : 'Primer', 'Tm', 'GC Content', 'Length'], rows.map(row =>
    [row.strand > 0 ? 'Forward' : 'Reverse', ...primerMetrics(row, draft.type)].map(esc))) +
    '<p class="muted small">' + (draft.type === 'DNA' ? 'Tm estimates DNA binding from the annealing segment.' : 'RNA primer Tm requires an RNA/DNA thermodynamic model.') + '</p>';
  byId('save-designed-primer').disabled = !valid;
  document.querySelector('[data-primer-use-selection]').disabled = !ui.selection;
}

function readPrimerRow(target) {
  const doc = active();
  const draft = primerWorkspace(doc).draft;
  const key = target.dataset.primerField;
  const row = draft.rows[target.dataset.strand];
  row[key] = key === 'position' ? (target.value === '' ? '' : Number(target.value) - displayBase(doc, 1) + 1) :
    key === 'overhang' ? Number(target.value) : target.value;
  paintPrimerDesigner();
  renderBases();
}

function primerFromSelection(value) {
  const doc = active();
  const draft = primerWorkspace(doc).draft;
  const strand = Number(value);
  const primer = Primer.fromSelection(doc, ui.selection, draft.type, strand);
  if (!primer) throw Error('Select 6–200 contiguous unambiguous bases.');
  const row = draft.rows[strand];
  const tail = Primer.normalized(row.bases).slice(0, row.overhang);
  if (tail.length + primer.bases.length > 200) throw Error('The primer and its 5′ tail exceed 200 bases.');
  Object.assign(row, primer, { bases: tail + primer.bases, overhang: tail.length });
  draft.strand = strand;
  renderMap();
  renderBases();
}

function jumpToPrimer(value) {
  const doc = active();
  const draft = primerWorkspace(doc).draft;
  const bind = Primer.binding(doc, { ...draft.rows[Number(value)], type: draft.type });
  if (!bind) throw Error('Set the bases and 3′ location first.');
  selectRange(bind.start, bind.end);
}

function primerStructureScreen() {
  const draft = primerWorkspace(active()).draft;
  const rows = primerDraftRows(draft);
  const strandBases = rows.map(row => Primer.normalized(row.bases));
  if (!strandBases.every(bases => Primer.alphabet(draft.type).test(bases) && bases.length >= 6 && bases.length <= 200)) {
    throw Error('Enter valid primer bases first.');
  }
  const dna = value => Primer.toType(value, 'DNA');
  const longest = (a, b, self = false) => {
    const complement = Lab.complement(dna(b));
    a = dna(a);
    let best = 0;
    for (let i = 0; i < a.length; i++) for (let j = b.length - 1; j >= 0; j--) {
      let k = 0;
      while (i + k < a.length && j - k >= 0 && (!self || i + k + 3 < j - k) && a[i + k] === complement[j - k]) k++;
      best = Math.max(best, k);
    }
    return best;
  };
  const report = strandBases.map((bases, i) => [rows[i].strand > 0 ? 'Forward' : 'Reverse', longest(bases, bases, true) + ' bp', longest(bases, bases) + ' bp']);
  show('Secondary Structure Screening', tableView(['Primer', 'Hairpin stem', 'Self-dimer stretch'], report) +
    (strandBases.length === 2 ? '<p>Pair complementarity: ' + longest(...strandBases) + ' bp</p>' : '') +
    '<p class="muted">Longest uninterrupted complementary stretches. This screen does not estimate ΔG.</p>', null, '', '');
}

function makePrimerFeature(row, bind, oligo) {
  return { name: row.name, kind: 'primer_bind', strand: row.strand, ranges: bind.ranges, color: colorOf(row.color),
    primer: { id: uuid(), type: row.type, bases: row.bases, overhang: row.overhang, oligo: oligo.id } };
}

function makePrimerOligo(doc, row, project, folder) {
  return newDoc('sequence', { name: row.name, type: row.type, subtype: 'oligo', bases: row.bases, topology: 'linear',
    features: [], description: 'Primer for ' + doc.name, sourceIds: [doc.id], project, folder });
}

function storeDesignedPrimers() {
  const doc = active();
  if (!canEditSequence()) return;
  const state = primerWorkspace(doc);
  const draft = state.draft;
  const [project, folder] = draft.location.split('|');
  if (!projectOf(project) || folder && folderOf(folder)?.project !== project) throw Error('Choose a valid destination.');
  const rows = primerDraftRows(draft).map(row => ({ ...row, name: row.name.trim(), type: draft.type, bases: Primer.normalized(row.bases) }));
  const sites = rows.map(row => Primer.binding(doc, row));
  if (rows.some((row, i) => !settingsName(row.name) || !sites[i] || sites[i].count < 6 || !sites[i].matches.at(-1))) {
    throw Error('Enter a name and a valid binding site for each primer.');
  }
  if (doc.features.length + rows.length > 2000) throw Error('This sequence has too many features.');
  const oligos = rows.map(row => makePrimerOligo(doc, row, project, folder));
  const features = rows.map((row, i) => makePrimerFeature(row, sites[i], oligos[i]));
  if (rows.length === 2 && (doc.primerPairs?.length || 0) >= 100) throw Error('This sequence can store up to 100 primer pairs.');
  remember(doc, 'Before attaching primers');
  doc.features.push(...features);
  db.docs.push(...oligos);
  state.chosen = features.map(feature => feature.primer.id);
  if (features.length === 2) addPrimerLink(doc, features, (rows[0].name + ' / ' + rows[1].name).slice(0, 160));
  state.draft = null;
  state.panel = features.length === 2 ? 'pairs' : 'primers';
  ui.primerOpen = true;
  ui.pane = doc.topology === 'circular' ? 'map' : 'linear';
  touch(doc, render);
  toast(features.length === 2 ? 'Primer pair saved and attached.' : 'Primer saved and attached.');
}

function openPrimerWizard() {
  const doc = active();
  if (doc?.type !== 'DNA') return;
  const region = selectedRegion();
  primerWorkspace(doc).wizard = { first: displayBase(doc, region.start), last: displayBase(doc, region.end),
