const Sync = (() => {
  const collections = ['projects', 'folders', 'schemas', 'docs', 'assets', 'trash', 'places', 'containers', 'movements',
    'batches', 'savedSearches', 'libraries', 'enzymeLists', 'gelLadders', 'circuits','grammars'];

  function equal(a, b, collection) {
    if (a === b) return true;
    if (!a || !b) return false;
    if (collection === 'assets') {
      const keys = Object.keys(a);
      return keys.length === Object.keys(b).length && keys.every(key => a[key] === b[key]);
    }
    return JSON.stringify(a) === JSON.stringify(b);
  }

  function diff(before, after) {
    const changes = {};
    for (const collection of collections) {
      const old = new Map((before?.[collection] || []).map(item => [item.id, item]));
      const changed = [];
      for (const item of after?.[collection] || []) {
        if (!equal(old.get(item.id), item, collection)) changed.push([item.id, item]);
        old.delete(item.id);
      }
      for (const id of old.keys()) changed.push([id, null]);
      if (changed.length) changes[collection] = changed;
    }
    return changes;
  }

  function apply(base, changes) {
    const next = { version: 1 };
    for (const collection of collections) {
      const values = base?.[collection] || [];
      const changed = changes[collection];
      if (!changed?.length) { next[collection] = values; continue; }
      const records = new Map(values.map(item => [item.id, item]));
      for (const [id, value] of changed) {
        if (value === null) records.delete(id);
        else records.set(id, value);
      }
      next[collection] = [...records.values()];
    }
    return next;
  }

  function count(changes) {
    return Object.values(changes).reduce((total, rows) => total + rows.length, 0);
  }

  return { collections, diff, apply, count };
})();
if (typeof module !== 'undefined') module.exports = Sync;

function example() {
  const bases = Array.from({ length: 5968 }, (_, i) => 'ACGT'[Math.floor(Math.abs(Math.sin(i * 7919 + 197) * 1000000)) % 4]).join('');
  const sequence = bases.slice(0, 30) + 'GCGGCCGC' + bases.slice(38, 275) + 'GGATCC' + bases.slice(281, 570) + 'AAGCTT' + bases.slice(576);
  const features = [
    ['Demo promoter', 'promoter', 388, 622, 1], ['Reporter CDS', 'CDS', 735, 2203, 1],
    ['Selection marker', 'CDS', 3550, 4682, -1], ['Replication origin', 'rep_origin', 4751, 5560, -1],
    ['Forward primer', 'primer_bind', 5650, 5700, 1],
  ].map(([name, kind, start, end, strand], i) => ({
    name, kind, ranges: [[start, end]], strand, color: Lab.colors[i],
  }));
  return {
    version: 1,
    projects: [{ id: 'demo', name: 'Example Project' }], folders: [],
    schemas: [{ id: 'sample', name: 'Muestra', fields: [{ name: 'Lote', type: 'text' }, { name: 'Fecha', type: 'date' }] }],
    docs: [
      { id: 'demo-seq', project: 'demo', folder: '', kind: 'sequence', name: 'pDemo_5968',
        type: 'DNA', bases: sequence, topology: 'circular', features, description: 'Secuencia sintética de ejemplo para probar el editor, las anotaciones y el mapa circular.' },
      { id: 'demo-note', project: 'demo', folder: '', kind: 'note', name: 'Diario de laboratorio',
        content: 'Objetivo\nExplorar las funciones del espacio de trabajo.\n\nObservaciones\nEl vector de práctica contiene anotaciones de demostración.', links: ['demo-seq'] },

        content: 'Objetivo\n\nMateriales\n\nProcedimiento\n\nResultados\n\nConclusión', links: [] },
    ],
  };
}

function documentView(doc) {

    const schema = schemaOf(doc.schema);

      '</tbody></table></div></div>';
  }
  if (doc.kind === 'alignment') return '<div>' + (doc.multi ? multiView(doc) : alignmentView(doc)) + '</div>';
  const links = (doc.links || []).map(docOf).filter(Boolean);
  return '<div>' + Notebook.view(doc, ui.preview) + '<h3 class="block-gap">Archivos vinculados</h3>' +
    (links.length ? links.map(link =>
      '<div class="folder-row">' + fileButton(link) + btn('×', 'unlink-doc', 'class="icon-button" data-value="' + esc(link.id) + '" aria-label="Quitar vínculo a ' + esc(link.name) + '"') + '</div>'
    ).join('') : '<p class="muted">Todavía no hay archivos vinculados.</p>') + '</div>';
}

function alignmentView(doc) {
  const { first, second, marks, identity, score } = doc.result;
  let report = '';
  for (let offset = 0; offset < first.length; offset += 65) {
    report += first.slice(offset, offset + 65) + '\n' + marks.slice(offset, offset + 65) + '\n' +
      second.slice(offset, offset + 65) + '\n\n';
  }
  return '<p><b>' + esc(doc.names[0]) + '</b> frente a <b>' + esc(doc.names[1]) + '</b></p><p class="muted">Identidad ' +
    identity.toFixed(1) + '% · Puntuación ' + score + ' · Alineamiento global (+2, −1, −2)</p>' +
    '<pre class="readout alignment">' + esc(report.trimEnd()) + '</pre>';
}

const Workspace = (() => {
  let connection;
  let revision = 0;
  let pending = false;
  let queued = false;
  let conflict = false;
  let lastFallback = null;
  let persistedAssets = new Map();

  function normalize(data) {
    for (const collection of ['assets', 'trash', 'places', 'containers', 'movements', 'batches', 'libraries', 'enzymeLists', 'gelLadders', 'circuits','grammars']) {
      data[collection] ??= [];
    }
    return data;
  }

  function readStore() {
    return new Promise((resolve, reject) => {
      const tx = connection.transaction(['workspace', 'assetBytes'], 'readonly');
      const request = tx.objectStore('workspace').get('current');
      const assetRequest = tx.objectStore('assetBytes').getAll();
      tx.oncomplete = () => {
        const stored = request.result;
        persistedAssets = new Map(assetRequest.result.map(item => [item.id, item.data]));
        if (stored) for (const asset of stored.data.assets || []) {
          if (persistedAssets.has(asset.id)) asset.data = persistedAssets.get(asset.id);
        }
        resolve(stored);
      };
      tx.onabort = () => reject(tx.error);
    });
  }

  function openStore() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open('mesa-molecular', 2);
      request.onupgradeneeded = event => {
        if (event.oldVersion < 1) request.result.createObjectStore('workspace');
        request.result.createObjectStore('assetBytes', { keyPath: 'id' });
      };
      request.onerror = () => reject(request.error);
      request.onblocked = () => reject(Error('El almacenamiento local está bloqueado por otra pestaña.'));
      request.onsuccess = () => resolve(request.result);
    });
  }

  function writeStore(snapshot) {
    const { assets, ...other } = snapshot;
    const contents = new Map();
    const metadata = assets.map(({ data, ...asset }) => {
      if (data !== undefined) contents.set(asset.id, data);
      return asset;
    });
    const data = structuredClone({ ...other, assets: metadata });
    return new Promise((resolve, reject) => {
      const tx = connection.transaction(['workspace', 'assetBytes'], 'readwrite');
      const store = tx.objectStore('workspace');
      const files = tx.objectStore('assetBytes');
      const read = store.get('current');
      read.onsuccess = () => {
        if ((read.result?.revision || 0) !== revision) {
          conflict = true;
          tx.abort();
          return;
        }
        for (const id of persistedAssets.keys()) if (!contents.has(id)) files.delete(id);
        for (const [id, bytes] of contents) {
          if (persistedAssets.get(id) !== bytes) files.put({ id, data: bytes });
        }
        store.put({ revision: revision + 1, data }, 'current');
      };
      tx.oncomplete = () => { revision += 1; persistedAssets = contents; resolve(); };
      tx.onabort = () => reject(tx.error || Error('Conflicto entre pestañas.'));
    });
  }

  function report(error) {
    storageIssue = true;
    toast(conflict ?
      'Otra pestaña guardó cambios. Descarga una copia de esta pestaña antes de recargar.' :
      (error?.name === 'QuotaExceededError' ? 'El navegador se quedó sin espacio. Descarga una copia en Ajustes.' :
        'El navegador no pudo guardar los cambios. Descarga una copia desde Ajustes.'));
  }

  function save() {
    if (Team.enabled) { Team.schedule(); return; }
    if (conflict) return;
    if (!connection) {
      try {
        const raw = localStorage.getItem(storageKey);
        if (raw !== lastFallback) {
          conflict = true;
          throw Error('Conflicto entre pestañas.');
        }
        const next = JSON.stringify(db);
        localStorage.setItem(storageKey, next);
        lastFallback = next;
        storageIssue = false;
      } catch (error) { report(error); }
      renderStatus();
      return;
    }
    if (pending) { queued = true; return; }
    pending = true;
    renderStatus();
    writeStore(db).then(() => { storageIssue = false; }, report).finally(() => {
      pending = false;
      renderStatus();
      if (queued) { queued = false; save(); }
    });
  }

  async function start() {
    if (Team.enabled) {
      if (await Team.start()) startEditor();
      return;
    }
    try { lastFallback = localStorage.getItem(storageKey); } catch { storageIssue = true; }
    db = normalize(db);
    try {
      connection = await openStore();
      const stored = await readStore();
      if (stored) {
        validateBackup(stored.data);
        db = normalize(stored.data);
        revision = stored.revision;
      }
      storageIssue = false;
      connection.onversionchange = () => {
        connection.close();
        conflict = true;
        report();
        renderStatus();
      };
    } catch {
      if (connection) {
        connection.close();
        conflict = true;
        storageIssue = true;
      }
      connection = undefined;
    }
    startEditor();
  }

  function startEditor() {
    const savedUI = restoreTabs();
    const first = db.docs.find(doc => doc.id === 'demo-seq') || db.docs[0];
    const linked = Team.enabled ? docOf(new URL(location.href).searchParams.get('file')) : null;
    Object.assign(ui, {
      project: linked?.project || db.projects[0].id,
      folder: linked?.folder || '',
      active: linked?.id || savedUI?.active || first?.id || '',
      tabs: linked ? [...new Set([...(savedUI?.tabs || []), linked.id])] : savedUI?.tabs || (first ? [first.id] : []),
    });
    if (active()?.topology === 'linear') ui.pane = 'linear';
    render();
  }

  function restoreTabs() {
    try {
      const value = JSON.parse(sessionStorage.getItem(storageKey + '-tabs-' + Team.scope()) ||
        (!Team.enabled ? sessionStorage.getItem(storageKey + '-tabs') : null));
      if (!value || !Array.isArray(value.tabs)) return null;
      const tabs = value.tabs.filter(id => docOf(id));
      return { tabs, active: tabs.includes(value.active) ? value.active : tabs.at(-1) };
    } catch { return null; }
  }

  function storeTabs() {
    try { sessionStorage.setItem(storageKey + '-tabs-' + Team.scope(), JSON.stringify({ tabs: ui.tabs, active: ui.active })); }
    catch { /* Optional session preference. */ }
  }

  function message() {
    if (Team.enabled) return Team.status();
    if (conflict) return 'Conflicto entre pestañas';
    if (storageIssue) return 'Cambios sin guardar';
    return pending ? 'Guardando…' : typeof GitHubSync!=='undefined'&&GitHubSync.connected()?GitHubSync.status():'Espacio local';
  }

  async function flush(){if(Team.enabled){await Team.flush();return;}save();while(pending||queued)await new Promise(resolve=>setTimeout(resolve,10));if(storageIssue||conflict)throw Error('No se pudo confirmar el guardado local. Conserva una copia de seguridad.');}
  return { start, save,flush, storeTabs, normalize, message };
})();

const NotebookMath=(()=>{
  const fail=code=>{throw Error(code);};
  const coordinate=s=>{const m=/^\$?([A-Z]{1,2})\$?([1-9]\d{0,2})$/.exec(s);if(!m)fail('#REF!');return[Number(m[2])-1,[...m[1]].reduce((a,c)=>a*26+c.charCodeAt(0)-64,0)-1];};
  const column=i=>{let s='';for(let n=i+1;n>0;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s;};
  const number=v=>{if(v===undefined||v==='')return 0;if(typeof v==='boolean')return Number(v);const n=Number(v);if(!Number.isFinite(n))fail('#VALOR!');return n;};

    let pos=0,m;while(pos<text.trimEnd().length){rx.lastIndex=pos;m=rx.exec(text);if(!m)fail('#FÓRMULA!');tokens.push(m[1][0]==='"'?m[1]:m[1].toUpperCase());pos=rx.lastIndex;}
    let i=0;const take=v=>tokens[i]===v?(i++,true):false,need=v=>{if(!take(v))fail('#FÓRMULA!');};
    const atom=()=>{if(take('+'))return{op:'u+',a:atom()};if(take('-'))return{op:'u-',a:atom()};if(take('(')){const a=compare();need(')');return a;}const t=tokens[i++];if(!t)fail('#FÓRMULA!');if(t.startsWith('"'))return{value:t.slice(1,-1).replaceAll('""','"')};if(/^(?:\d|\.)/.test(t))return{value:Number(t)};if(t==='TRUE'||t==='FALSE')return{value:t==='TRUE'};if(take('(')){const args=[];if(!take(')')){do{args.push(compare());}while(take(',')||take(';'));need(')');}return{fn:t,args};}const p=coordinate(t);if(take(':'))return{range:[p,coordinate(tokens[i++])]};return{ref:p};};
    const power=()=>{let a=atom();while(take('%'))a={op:'/',a,b:{value:100}};if(take('^'))a={op:'^',a,b:power()};return a;};
    const product=()=>{let a=power();while(['*','/'].includes(tokens[i])){const op=tokens[i++];a={op,a,b:power()};}return a;};
    const sum=()=>{let a=product();while(['+','-'].includes(tokens[i])){const op=tokens[i++];a={op,a,b:product()};}return a;};
    const compare=()=>{let a=sum();while(['=','<>','<','>','<=','>='].includes(tokens[i])){const op=tokens[i++];a={op,a,b:sum()};}return a;};
    const tree=compare();if(i!==tokens.length)fail('#FÓRMULA!');return tree;
  }
  function calculate(rows){
    const cache=new Map(),stack=new Set();
    const resolve=(r,c)=>{if(r<0||c<0||r>=rows.length||c>=rows[0].length)fail('#REF!');const key=r+':'+c;if(cache.has(key))return cache.get(key);if(stack.has(key)||stack.size>250)fail('#CICLO!');const text=String(rows[r][c]??'');if(!text.startsWith('=')){const raw=text.trim();return raw===''?undefined:/^[+-]?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?$/i.test(raw)?Number(raw):text;}stack.add(key);try{const v=run(parse(text.slice(1)));if(typeof v==='number'&&!Number.isFinite(v))fail('#NUM!');cache.set(key,v);return v;}finally{stack.delete(key);}};
    const flatten=nodes=>nodes.flatMap(n=>{if(!n.range)return[run(n)];const [[a,b],[c,d]]=n.range,values=[];for(let r=Math.min(a,c);r<=Math.max(a,c);r++)for(let j=Math.min(b,d);j<=Math.max(b,d);j++)values.push(resolve(r,j));return values;});
    const run=n=>{
      if('value'in n)return n.value;if(n.ref)return resolve(...n.ref);if(n.range)fail('#VALOR!');
      if(n.op){const a=run(n.a);if(n.op==='u+')return number(a);if(n.op==='u-')return-number(a);const b=run(n.b);if(n.op==='=')return a===b;if(n.op==='<>')return a!==b;if(n.op==='<')return a<b;if(n.op==='>')return a>b;if(n.op==='<=')return a<=b;if(n.op==='>=')return a>=b;const x=number(a),y=number(b);if(n.op==='+')return x+y;if(n.op==='-')return x-y;if(n.op==='*')return x*y;if(n.op==='/'){if(y===0)fail('#DIV/0!');return x/y;}return x**y;}
      const name=({SUMA:'SUM',PROMEDIO:'AVERAGE',CONTAR:'COUNT',SI:'IF',REDONDEAR:'ROUND',RAIZ:'SQRT',POTENCIA:'POWER',MEDIANA:'MEDIAN',DESVEST:'STDEV.S',VAR:'VAR.S'})[n.fn]||n.fn;

      if(name==='IFERROR'){if(n.args.length!==2)fail('#FÓRMULA!');try{return run(n.args[0]);}catch{return run(n.args[1]);}}

      if(name==='SUM')return total;if(name==='COUNT')return numeric.length;if(name==='COUNTA')return values.filter(v=>v!==undefined&&v!=='').length;

      if(name==='AND')return values.every(v=>Boolean(v));if(name==='OR')return values.some(v=>Boolean(v));if(name==='NOT'&&values.length===1)return!values[0];
      const x=number(values[0]),y=number(values[1]);
      if(name==='ABS'&&values.length===1)return Math.abs(x);if(name==='SQRT'&&values.length===1){if(x<0)fail('#NUM!');return Math.sqrt(x);}if(name==='POWER'&&values.length===2)return x**y;

      if(name==='EXP'&&values.length===1)return Math.exp(x);if(name==='LN'&&values.length===1){if(x<=0)fail('#NUM!');return Math.log(x);}if(name==='LOG10'&&values.length===1){if(x<=0)fail('#NUM!');return Math.log10(x);}if(name==='LOG'&&values.length>=1&&values.length<=2){const base=values.length===2?y:10;if(x<=0||base<=0||base===1)fail('#NUM!');return Math.log(x)/Math.log(base);}
      fail('#NOMBRE?');
    };
    return rows.map((row,r)=>row.map((cell,c)=>{if(!String(cell).startsWith('='))return String(cell??'');try{const v=resolve(r,c);return typeof v==='number'?String(Number(v.toPrecision(12))):typeof v==='boolean'?v?'TRUE':'FALSE':String(v??'');}catch(e){return e.message.startsWith('#')?e.message:'#FÓRMULA!';}}));
  }

})();

const Notebook = (() => {
  function inline(text) {
    const token = /\[\[@[\w-]{1,100}\|[^\]\n]+\]\]|\*\*[^*]+\*\*|\*[^*]+\*|__[^_]+__|~~[^~]+~~|`[^`]+`/g;
    let last = 0;
    let html = '';
    for (const match of text.matchAll(token)) {
      html += esc(text.slice(last, match.index));
      const value = match[0];
      if (value.startsWith('[[@')) {
        const [id, encoded] = value.slice(3, -2).split('|');
        let label;
        try { label = decodeURIComponent(encoded); } catch { label = encoded; }
        html += mentionChip(id, label);
      } else if (value.startsWith('**')) html += '<strong>' + esc(value.slice(2, -2)) + '</strong>';
      else if (value.startsWith('*')) html += '<em>' + esc(value.slice(1, -1)) + '</em>';
      else if (value.startsWith('__')) html += '<u>' + esc(value.slice(2, -2)) + '</u>';
      else if (value.startsWith('~~')) html += '<s>' + esc(value.slice(2, -2)) + '</s>';
      else html += '<code>' + esc(value.slice(1, -1)) + '</code>';
      last = match.index + value.length;
    }
    return html + esc(text.slice(last));
  }

  function markup(text, options={}) {
    if (!text) return '<p class="muted">Sin contenido.</p>';
    let list = '';
    let html = '';
    const closeList = () => {
      if (list) html += '</' + list + '>';
      list = '';
    };
    for (const raw of text.split('\n')) {
      const table=/^\s*\[\[table:([\w-]{1,100})\]\]\s*$/.exec(raw);
      if(table&&options.table){closeList();html+=options.table(table[1]);continue;}
      const heading = /^(#{1,3})\s+(.+)$/.exec(raw);
      const item = /^\s*(?:([-*])|(\d+)\.)\s+(.*)$/.exec(raw);
      if (item) {
        const type = item[1] ? 'ul' : 'ol';
        if (type !== list) { closeList(); list = type; html += '<' + list + '>'; }
        const task = /^\[([ xX])\]\s+(.*)$/.exec(item[3]);
        html += '<li>' + (task ? '<span class="check-indicator" aria-label="' + (task[1] === ' ' ? 'Pendiente' : 'Completado') +
          '">' + (task[1] === ' ' ? '☐' : '☑') + '</span> ' + inline(task[2]) : inline(item[3])) + '</li>';
        continue;
      }
      closeList();
      if (heading) {
        const level = heading[1].length + 1;
        html += '<h' + level + '>' + inline(heading[2]) + '</h' + level + '>';
      } else if (/^>\s?/.test(raw)) html += '<blockquote>' + inline(raw.replace(/^>\s?/, '')) + '</blockquote>';
      else if (raw.trim()) html += '<p>' + inline(raw) + '</p>';
      else html += '<div class="note-gap" aria-hidden="true"></div>';
    }
    closeList();
    return html;
  }

  function parseDelimited(raw, separator) {
    const text = raw.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
    let row = [];
    const rows = [];
    let cell = '';
    let quoted = false;
    let closed = false;
    const pushCell = () => {
      if (cell.length > 10000) throw Error('Cada celda admite hasta 10 000 caracteres.');
      row.push(cell);
      if (row.length > 30) throw Error('La tabla admite hasta 30 columnas.');
      cell = '';
      closed = false;
    };
    const pushRow = () => {
      pushCell();
      rows.push(row);
      if (rows.length > 201) throw Error('La tabla admite una cabecera y hasta 200 filas de datos.');
      row = [];
    };
    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      if (quoted) {
        if (char === '"' && text[i + 1] === '"') { cell += '"'; i += 1; }
        else if (char === '"') { quoted = false; closed = true; }
        else cell += char;
      } else if (char === separator) pushCell();
      else if (char === '\n') pushRow();
      else if (!cell && !closed && char === '"') quoted = true;
      else if (closed) {
        if (!/\s/.test(char)) throw Error('Hay texto después del cierre de una celda entre comillas.');
      } else cell += char;
    }
    if (quoted) throw Error('Falta cerrar una celda entre comillas.');
    if (row.length || cell || closed) pushRow();
    if (!rows.length) throw Error('Añade al menos una fila.');
    const width = Math.max(...rows.map(item => item.length));
    for (const item of rows) while (item.length < width) item.push('');
    return rows;
  }

  function csv(rows) {
    return rows.map(row => row.map(value => '"' + String(value ?? '').replaceAll('"', '""') + '"').join(',')).join('\r\n');
  }

  function coordinate(token) {
    const match = /^([A-Z]{1,2})([1-9]\d{0,2})$/.exec(token || '');
    if (!match) throw Error('#REF!');
    const col = [...match[1]].reduce((total, ch) => total * 26 + ch.charCodeAt(0) - 64, 0);
    return [Number(match[2]) - 1, col - 1];
  }

  function math(rows) {
    if(typeof NotebookMath!=='undefined')return NotebookMath.calculate(rows);
    const cache = new Map();
    const stack = new Set();
    const resolve = (row, col, inRange = false) => {
      if (row < 0 || row >= rows.length || col < 0 || col >= rows[0].length) throw Error('#REF!');
      const key = row + ':' + col;
      if (stack.has(key) || stack.size > 300) throw Error('#CICLO!');
      if (cache.has(key)) return cache.get(key);
      const raw = rows[row][col];
      if (!raw?.startsWith('=')) {
        const value = raw?.trim() || '';
        if (!value) return inRange ? undefined : 0;
        if (!/^[+-]?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?$/i.test(value)) {
          if (inRange) return undefined;
          throw Error('#VALOR!');
        }
        return Number(value);
      }
      stack.add(key);
      try {
        const result = evaluate(raw.slice(1).toUpperCase(), resolve);
        cache.set(key, result);
        return result;
      } finally { stack.delete(key); }
    };
    return rows.map((row, i) => row.map((cell, j) => {
      if (!cell.startsWith('=')) return cell;
      try { return String(Number(resolve(i, j).toPrecision(12))); }
      catch (error) { return /^#/.test(error.message) ? error.message : '#FÓRMULA!'; }
    }));
  }

  function evaluate(expression, resolve) {
    if (expression.length > 512) throw Error('#FÓRMULA!');
    const rx = /\s*(\d+(?:\.\d*)?(?:E[+-]?\d+)?|\.\d+(?:E[+-]?\d+)?|[A-Z]+[0-9]*|[()+*/,:-])/gy;
    const tokens = [];
    const text = expression.trim();
    for (let match; (match = rx.exec(text));) tokens.push(match[1]);
    if (tokens.join('') !== text.replace(/\s/g, '')) throw Error('#FÓRMULA!');
    let index = 0;
    const take = value => {
      if (tokens[index] !== value) return false;
      index += 1;
      return true;
    };
    const require = value => { if (!take(value)) throw Error('#FÓRMULA!'); };
    const primary = () => {
      if (take('+')) return primary();
      if (take('-')) return -primary();
      if (take('(')) { const value = add(); require(')'); return value; }
      const token = tokens[index++];
      if (/^(?:\d|\.\d)/.test(token || '')) return Number(token);
      if (['SUM', 'AVERAGE', 'MIN', 'MAX', 'COUNT'].includes(token)) {
        const args = [];
        require('(');
        do {
          if (tokens[index + 1] === ':') {
            const [a, b] = coordinate(tokens[index]);
            const [c, d] = coordinate(tokens[index + 2]);
            index += 3;
            for (let i = Math.min(a, c); i <= Math.max(a, c); i++) {
              for (let j = Math.min(b, d); j <= Math.max(b, d); j++) {
                const value = resolve(i, j, true);
                if (value !== undefined) args.push(value);
              }
            }
          } else args.push(add());
        } while (take(','));
        require(')');
        if (token === 'MIN') return args.length ? Math.min(...args) : 0;
        if (token === 'MAX') return args.length ? Math.max(...args) : 0;
        if (token === 'COUNT') return args.length;
        const sum = args.reduce((a, b) => a + b, 0);
        if (token === 'SUM') return sum;
        if (!args.length) throw Error('#DIV/0!');
        return sum / args.length;
      }
      return resolve(...coordinate(token));
    };
    const multiply = () => {
      let value = primary();
      while (true) {
        if (take('*')) value *= primary();
        else if (take('/')) {
          const divisor = primary();
          if (!divisor) throw Error('#DIV/0!');
          value /= divisor;
        } else return value;
      }
    };
    const add = () => {
      let value = multiply();
      while (true) {
        if (take('+')) value += multiply();
        else if (take('-')) value -= multiply();
        else return value;
      }
    };
    const result = add();
    if (index !== tokens.length || !Number.isFinite(result)) throw Error('#FÓRMULA!');
    return result;
  }

  function view(doc, preview) {
    const toolbar = [['Título', 'h'], ['Negrita', 'b'], ['Cursiva', 'i'], ['Lista', 'li'], ['Tarea', 'todo'], ['Código', 'code']]
      .map(([title, value]) => btn(title, 'format-note', 'data-value="' + value + '"')).join('');
    const text = preview ? '<div class="note-paper">' + markup(doc.content) + '</div>' :
      '<div class="toolbar rich-tools" aria-label="Formato de texto">' + toolbar + '</div>' +
      '<label class="field"><span class="sr-only">Contenido</span><textarea id="note-content" class="document-text" placeholder="Escribe tus observaciones…">' +
      esc(doc.content) + '</textarea></label><p class="muted small">Markdown · guardado automático</p>';
    const tables = (doc.tables || []).map((table, index) => {
      const values = math(table.rows);
      const body = values.map(row => '<tr>' + row.map(cell => '<td>' + esc(cell) + '</td>').join('') + '</tr>').join('');
      return '<section class="notebook-table"><div class="toolbar section-heading"><h3>' + esc(table.name) + '</h3>' +
        btn('Editar', 'edit-table', 'data-value="' + index + '"') + btn('CSV', 'export-table', 'data-value="' + index + '"') +
        '</div><div class="table-wrap"><table><thead><tr>' +
        table.headers.map(header => '<th scope="col">' + esc(header) + '</th>').join('') + '</tr></thead><tbody>' +
        body + '</tbody></table></div></section>';
    }).join('');
    const assets = (doc.attachments || []).map(assetOf).filter(Boolean);
    return text + tables + '<div class="toolbar notebook-insert">' +
      btn('+ Tabla', 'edit-table') + btn('+ Adjuntar archivo', 'attach-file') +
      btn('+ Vincular archivo del proyecto', 'link-doc') + '</div>' +
      (assets.length ? '<h3 class="block-gap">Adjuntos</h3>' + assets.map(asset => assetRow(asset, true)).join('') : '');
  }

  function formatSelection(value) {
    const node = byId('note-content');
    if (!node) return;
    const [start, end] = [node.selectionStart, node.selectionEnd];
    const selected = node.value.slice(start, end);
    const spec = {
      h: ['\n## ', '', 'Título'], b: ['**', '**', 'negrita'], i: ['*', '*', 'cursiva'],
      li: ['\n- ', '', 'Elemento'], todo: ['\n- [ ] ', '', 'Tarea'], code: ['`', '`', 'código'],
    }[value];
    if (!spec) return;
    const text = selected || spec[2];
    node.setRangeText(spec[0] + text + spec[1], start, end, 'end');
    node.dispatchEvent(new Event('input', { bubbles: true }));
    node.focus();
    node.setSelectionRange(start + spec[0].length, start + spec[0].length + text.length);
  }

  function tableDialog(value) {
    const doc = active();
    const index = value === '' ? -1 : Number(value);
    const old = doc.tables?.[index];
    show(old ? 'Editar tabla' : 'Añadir tabla',
      field('Nombre', input('name', old?.name || 'Tabla de resultados')) +
      field('Archivo CSV o TSV (opcional)', '<input type="file" name="file" accept=".csv,.tsv,.txt">') +
      field('Separador', select('separator', [[',', 'Coma (CSV)'], [';', 'Punto y coma'], ['\t', 'Tabulador (TSV)']])) +
      field('Datos', area('rows', old ? csv([old.headers, ...old.rows]) :
        'Muestra,Volumen,Factor,Resultado\nControl,20,2,=B1*C1', 'rows="8" class="mono" spellcheck="false"')) +
      '<p class="muted small">La primera fila contiene los encabezados. Fórmulas en inglés: =B1*C1 o =SUM(B1:B3). Los datos empiezan en la fila 1. Usa un punto para decimales.</p>' +
      (old ? btn('Quitar tabla…', 'remove-table', 'data-value="' + index + '"') : ''),
      async data => {
        const file = data.get('file');
        if (file.size > 1_000_000) throw Error('El archivo de la tabla supera 1 MB.');
        const rows = parseDelimited(file.size ? await file.text() : String(data.get('rows')), String(data.get('separator')));
        const headers = rows.shift();
        if(typeof noteTableInit!=='undefined')noteTableInit(doc);
        const table = { id:old?.id||uuid(), name: nameOf(data), headers, rows };
        remember(doc, old ? 'Antes de editar tabla' : 'Antes de añadir tabla');
        doc.tables ||= [];
        if (old) doc.tables[index] = table;
        else doc.tables.push(table);
        touch(doc);
      }, 'Guardar tabla', 'Cuaderno');
  }

  return { view, formatSelection, tableDialog, parseDelimited, csv, math, markup };
})();

const moduleNames = { home: 'Inicio', inventory: 'Inventario', models: 'Modelos', circuits: 'Modelado', assets: 'Archivos', trash: 'Papelera' };
const assetOf = id => db.assets.find(item => item.id === id);
const placeOf = id => db.places.find(item => item.id === id);
const containerOf = id => db.containers.find(item => item.id === id);
const batchOf = id => db.batches.find(item => item.id === id);
const dateLabel = time => time ? new Intl.DateTimeFormat('es', { dateStyle: 'medium', timeStyle: 'short' }).format(time) : '—';
const attr = (value, rest = '') => 'data-value="' + esc(value) + '" ' + rest;

function touch(doc, refresh = renderEditor) {
  doc.updated = Date.now();
  save();
  refresh();
}

function remember(doc, label, force = false) {
  const { id, project, folder, history, updated, ...fields } = doc;
  const list = doc.history ||= [];
  const data = structuredClone(fields);
  if (list.length && !force && JSON.stringify(list[0].data) === JSON.stringify(data)) return;
  list.unshift({ at: Date.now(), label, data });
  if (list.length > 20) list.length = 20;
}

function historyView(doc) {
  return '<div class="info-pane"><div class="section-heading"><h3>Historial de versiones</h3>' +
    btn('Crear punto de guardado', 'save-version') + '</div>' +
    (doc.history?.length ? '<div class="table-wrap"><table><thead><tr><th>Versión</th><th>Fecha</th><th></th></tr></thead><tbody>' +
      doc.history.map((item, i) => '<tr><td>' + esc(item.label) + '</td><td>' + dateLabel(item.at) + '</td><td>' +
        btn('Restaurar…', 'version-restore', attr(i)) + '</td></tr>').join('') + '</tbody></table></div>' :
      '<p class="muted">Aún no hay versiones guardadas.</p>') + '</div>';
}

function restoreVersion(value) {
  const doc = active();
  const version = doc.history?.[Number(value)];
  if (!version) return;
  show('Restaurar versión', '<p>Se recuperará el contenido de «' + esc(version.label) + '» del ' + dateLabel(version.at) +
    '. La versión actual quedará en el historial.</p>', () => {
    remember(doc, 'Antes de restaurar', true);
    const contentKeys = Object.keys(doc).filter(key => !['id', 'project', 'folder', 'history', 'updated'].includes(key));
    for (const key of contentKeys) delete doc[key];
    Object.assign(doc, structuredClone(version.data));
    resetSequenceView();
    touch(doc, render);
  }, 'Restaurar');
}

function assetRow(asset, attached = false) {
  const url = asset.url ? safeLink(asset.url) : '';
  const detail = asset.url ? new URL(url).hostname : Math.max(1, Math.ceil(asset.size / 1024)) + ' KB';
  return '<div class="asset-row"><span class="asset-glyph">' + icon('attachment') + '</span><span class="asset-title"><b>' +
    esc(asset.name) + '</b><small>' + esc(detail) + '</small></span>' +
    (url ? '<a class="as-button" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Abrir enlace</a>' :
      btn('Ver', 'asset-preview', attr(asset.id)) + btn('Descargar', 'asset-download', attr(asset.id))) +
    (attached ? btn('×', 'asset-unlink', attr(asset.id, 'class="icon-button" aria-label="Desvincular adjunto"')) : '') + '</div>';
}

function safeLink(value) {
  const url = new URL(value);
  if (url.protocol !== 'https:' || url.username || url.password) throw Error('Usa una URL HTTPS sin credenciales.');
  return url.href;
}

function encodeFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',', 2)[1]);
    reader.onerror = () => reject(Error('No se pudo leer el archivo.'));
    reader.readAsDataURL(file);
  });
}

function binaryOf(asset) {
  const string = atob(asset.data);
  return Uint8Array.from(string, char => char.charCodeAt(0));
}

async function makeAsset(file, name = file.name, project = ui.project) {
  if (!file.size || file.size > 8_000_000) throw Error('Selecciona un archivo de entre 1 byte y 8 MB.');
  const usage = db.assets.reduce((sum, asset) => sum + (asset.size || 0), 0);
  if (usage + file.size > 60_000_000) throw Error('Los archivos del espacio superan 60 MB.');
  return { id: uuid(), name, project, size: file.size, mime: file.type, data: await encodeFile(file), at: Date.now() };
}

function attachDialog(doc) {
  const library = db.assets.filter(asset => !doc?.attachments?.includes(asset.id));
  show(doc ? 'Adjuntar archivo a la entrada' : 'Añadir archivo a la biblioteca',
    field('Archivo local', '<input name="file" type="file"' + (doc ? '' : ' required') + '>') +
    (doc && library.length ? field('O reutiliza un archivo', select('asset', [['', 'Seleccionar…'], ...library.map(asset => [asset.id, asset.name])])) : '') +
    '<p class="muted small">Hasta 8 MB por archivo. Los adjuntos se incluyen en las copias del espacio.</p>',
    async data => {
      const file = data.get('file');
      const asset = file.size ? await makeAsset(file, file.name, doc?.project || ui.project) : assetOf(textOf(data, 'asset'));
      if (!asset) throw Error('Selecciona un archivo local o existente.');
      if (file.size) db.assets.push(asset);
      if (doc) {
        remember(doc, 'Antes de adjuntar archivo');
        doc.attachments = [...(doc.attachments || []), asset.id];
        touch(doc);
      } else { save(); render(); }
    }, 'Añadir', 'Archivos');
}

function linkAssetDialog() {
  show('Añadir enlace externo', field('Nombre', input('name')) + field('Dirección HTTPS', input('url', '', 'type="url" required')) +
    '<p class="muted small">Puedes guardar un enlace de OneDrive, Box, Dropbox u otro proveedor. Se abrirá con los permisos que ya tenga el enlace.</p>',
    data => {
      db.assets.push({ id: uuid(), name: nameOf(data), project: ui.project, url: safeLink(textOf(data, 'url')), at: Date.now() });
      save();
      render();
    }, 'Guardar enlace', 'Archivos');
}

function assetPreview(id) {
  const asset = assetOf(id);
  const image = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'].includes(asset.mime);
  let preview = '<p class="muted">Este tipo de archivo se puede descargar para abrirlo en su aplicación.</p>';
  if (image) preview = '<img class="attachment-image" alt="' + esc(asset.name) + '" src="data:' + asset.mime + ';base64,' + asset.data + '">';
  if (/^(text\/|application\/json)/.test(asset.mime) || /\.(txt|csv|tsv|fasta|gb|json|md|pdb)$/i.test(asset.name)) {
    const text = new TextDecoder().decode(binaryOf(asset).slice(0, 28000));
    preview = '<pre class="readout mono">' + esc(text) + '</pre>' + (asset.size > 28000 ? '<p class="muted small">Vista previa parcial.</p>' : '');
  }
  show(asset.name, preview + btn('Descargar archivo', 'asset-download', attr(id)), null, '', 'Archivos');
}

}

function validateDestination(data, item) {
  const place = textOf(data, 'place');
  const slot = textOf(data, 'slot');

  if (slot && db.containers.some(other => other !== item && other.place === place && other.slot.toLowerCase() === slot.toLowerCase())) {
    throw Error('Esa posición ya está ocupada.');

  return { place, slot };

    const from = placePath(item.place) + (item.slot ? ' · ' + item.slot : '');

}

function zipStored(entries) {
  const encoder = new TextEncoder();
  const table = Uint32Array.from({ length: 256 }, (_, i) => {
    let value = i;
    for (let bit = 0; bit < 8; bit++) value = (value & 1 ? 0xedb88320 : 0) ^ (value >>> 1);
    return value >>> 0;
  });
  const local = [];
  const directory = [];
  let offset = 0;
  let directorySize = 0;
  for (const [filename, content] of entries) {
    const name = encoder.encode(filename);
    const bytes = typeof content === 'string' ? encoder.encode(content) : content;
    let crc = 0xffffffff;
    for (const byte of bytes) crc = (crc >>> 8) ^ table[(crc ^ byte) & 0xff];
    crc = (crc ^ 0xffffffff) >>> 0;
    const header = new DataView(new ArrayBuffer(30));
    header.setUint32(0, 0x04034b50, true);
    header.setUint16(4, 20, true);
    header.setUint16(6, 0x0800, true);
    header.setUint32(14, crc, true);
    header.setUint32(18, bytes.length, true);
    header.setUint32(22, bytes.length, true);
    header.setUint16(26, name.length, true);
    const index = new DataView(new ArrayBuffer(46));
    index.setUint32(0, 0x02014b50, true);
    index.setUint16(4, 20, true);
    index.setUint16(6, 20, true);
    index.setUint16(8, 0x0800, true);
    index.setUint32(16, crc, true);
    index.setUint32(20, bytes.length, true);
    index.setUint32(24, bytes.length, true);
    index.setUint16(28, name.length, true);
    index.setUint32(42, offset, true);
    local.push(header.buffer, name, bytes);
    directory.push(index.buffer, name);
    offset += header.byteLength + name.length + bytes.length;
    directorySize += index.byteLength + name.length;
  }
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, entries.length, true);
  end.setUint16(10, entries.length, true);
  end.setUint32(12, directorySize, true);
  end.setUint32(16, offset, true);
  return new Blob([...local, ...directory, end.buffer], { type: 'application/zip' });
}

function readConfidence(raw) {
  let obj;
  try { obj = JSON.parse(raw); } catch { throw Error('El archivo de métricas no es un JSON válido.'); }
  const selected = {};
  for (const key of ['confidence_score', 'ptm', 'iptm', 'complex_plddt']) {
    const value = obj?.[key];
    if (typeof value === 'number' && Number.isFinite(value) && value >= 0 && value <= 1) selected[key] = value;
  }
  if (!Object.keys(selected).length) throw Error('No se encontraron métricas Boltz de confianza en la escala 0–1.');
  return selected;
}

let structure;
function structureView(asset) {
  const chains = Tools.pdbTrace(new TextDecoder().decode(binaryOf(asset)));
  const coords = chains.flatMap(chain => chain.points);
  const center = [0, 0, 0];
  for (const point of coords) for (let k = 0; k < 3; k++) center[k] += point[k] / coords.length;
  let radius = 1;
  for (const point of coords) radius = Math.max(radius, Math.hypot(...center.map((value, k) => point[k] - value)));
  structure = { chains, center, radius };
  const confidence = db.batches.flatMap(batch => batch.jobs).find(job => job.result === asset.id)?.confidence || {};
  const measures = Object.entries(confidence).map(([key, value]) => '<span class="status-pill">' + esc(key) + ' ' + value.toFixed(3) + '</span>').join(' ');
  show(asset.name,
    '<p class="muted">' + format(coords.length) + ' posiciones Cα · ' + format(chains.length) + ' cadenas · primer modelo</p>' +
    (measures ? '<p>' + measures + '</p>' : '') + '<div id="structure-frame"></div>' +
    '<div class="toolbar structure-controls"><label>Rotación horizontal <input id="structure-y" type="range" min="-180" max="180" value="23"></label>' +
    '<label>Rotación vertical <input id="structure-x" type="range" min="-180" max="180" value="-14"></label>' +
    btn('Descargar PDB', 'asset-download', attr(asset.id)) + '</div>', null, '', 'Estructura');
  drawStructure();
}

function drawStructure() {
  const frame = byId('structure-frame');
  if (!frame || !structure) return;
  const rad = Math.PI / 180;
  const ax = Number(byId('structure-x').value) * rad;
  const ay = Number(byId('structure-y').value) * rad;
  const sx = Math.sin(ax);
  const cx = Math.cos(ax);
  const sy = Math.sin(ay);
  const cy = Math.cos(ay);
  const scale = 132 / structure.radius;
  const pieces = [];
  const palette = ['#514dcc', '#008f85', '#bc5979', '#926717', '#3282ba', '#7b60a6'];
  for (const [index, chain] of structure.chains.entries()) {
    let previous;
    let pointBefore;
    for (const point of chain.points) {
      const [x, y, z] = structure.center.map((value, k) => point[k] - value);
      const a = x * cy + z * sy;
      const c = -x * sy + z * cy;
      const b = y * cx - c * sx;
      const depth = y * sx + c * cx;
      const here = [Math.round(260 + scale * a), Math.round(150 - scale * b)];
      const color = palette[index % palette.length];
      if (previous && Math.hypot(point[0] - pointBefore[0], point[1] - pointBefore[1], point[2] - pointBefore[2]) <= 5.5) {
        pieces.push([depth, '<path d="M' + previous.join(' ') + 'L' + here.join(' ') + '" stroke="' + color + '" stroke-width="2.2" stroke-linecap="round"/>']);
      } else pieces.push([depth, '<circle cx="' + here[0] + '" cy="' + here[1] + '" r="2.5" fill="' + color + '"/>']);
      previous = here;
      pointBefore = point;
    }
  }
  frame.innerHTML = '<svg viewBox="0 0 520 300" role="img" aria-label="Traza tridimensional de la proteína">' +
    pieces.sort((a, b) => a[0] - b[0]).map(([, markup]) => markup).join('') + '</svg>';
}

    '<p class="muted small">Se muestran los picos y llamadas del archivo original. Editar la secuencia importada conserva este cromatograma.</p>',
    null, '', 'Secuenciación Sanger');
  drawTrace();

function drawTrace() {
  const { trace, page } = tracePreview;
  const width = 630;
  const start = page * 28;
  const end = Math.min(start + 28, trace.peaks.length);
  const min = Math.max(0, trace.peaks[start] - 7);
  const max = Math.min(trace.traces.A.length - 1, trace.peaks[end - 1] + 9);
  const x = n => 24 + 582 * (n - min) / Math.max(1, max - min);
  const colors = { A: '#13764b', C: '#2466b5', G: '#384051', T: '#bd3751' };
  let height = 1;
  for (const channel of Object.values(trace.traces)) {
    for (let i = min; i <= max; i++) height = Math.max(height, channel[i]);
  }
  const paths = Object.entries(trace.traces).map(([base, channel]) => {
    const points = [];
    const step = Math.max(1, Math.floor((max - min) / 1200));
    for (let i = min; i <= max; i += step) points.push(x(i).toFixed(1) + ',' + (145 - Math.max(0, channel[i]) * 108 / height).toFixed(1));
    return '<polyline fill="none" stroke="' + colors[base] + '" stroke-width="1.2" points="' + points.join(' ') + '"/>';
  }).join('');
  const letters = trace.peaks.slice(start, end).map((peak, i) => {
    const base = trace.sequence[start + i];
    return '<text x="' + x(peak) + '" y="21" fill="' + (colors[base] || '#556076') + '" text-anchor="middle">' + base + '</text>';
  }).join('');
  byId('trace-frame').innerHTML = '<svg viewBox="0 0 ' + width + ' 160" role="img" aria-label="Cromatograma Sanger de cuatro canales">' +
    '<path d="M20 146H610" stroke="#bac3d4"/>' + paths + '<g font-family="monospace" font-size="12">' + letters + '</g></svg>';
  byId('trace-position').textContent = format(start + 1) + '–' + format(end) + ' de ' + format(trace.sequence.length);
  byId('trace-qualities').innerHTML = trace.qualities.length ? '<p class="mono small">Phred · ' + trace.qualities.slice(start, end).join(' ') + '</p>' :
    '<p class="muted small">Calidades Phred no disponibles en el archivo.</p>';
  byId('dialog-body').querySelector('[data-value="-1"]').disabled = !page;
  byId('dialog-body').querySelector('[data-value="1"]').disabled = end >= trace.sequence.length;
}

const versionKeys = new Set([
  'kind', 'name', 'type', 'subtype', 'bases', 'features', 'topology', 'description', 'trace', 'primerPairs', 'startIndex', 'locked', 'lowercase', 'digests',
  'content', 'tables', 'attachments', 'links', 'schema', 'registryId', 'values',
  'result', 'sourceIds', 'names', 'multi',
]);
const validDate = value => typeof value === 'number' && Number.isFinite(value) && value >= 0 && value <= 8.64e15;
const strings = value => Array.isArray(value) && value.every(item => typeof item === 'string');
const typedText = value => typeof value === 'string';
const cleanId = value => typedText(value) && /^[\w-]{1,100}$/.test(value);
const validEnzymes = names => strings(names) && names.length <= Object.keys(Lab.enzymes).length &&
  new Set(names).size === names.length && names.every(name => Object.hasOwn(Lab.enzymes, name));
const settingsName = name => typedText(name) && name.trim().length > 0 && name.length <= 160;
const storedPrimerBases = (value, type) => typedText(value) && (type === 'RNA' ? /^[ACGU]{6,200}$/ : /^[ACGT]{6,200}$/).test(value);

function validateDocumentExtensions(doc, data, documents, fail) {
  if (!typedText(doc.name) || (doc.updated !== undefined && !validDate(doc.updated)) ||
    (doc.deleted !== undefined && !validDate(doc.deleted))) fail();
  if (doc.startIndex !== undefined && (doc.kind !== 'sequence' || doc.topology !== 'linear' || !Number.isInteger(doc.startIndex) ||
      doc.startIndex < 1 || doc.startIndex > 1000000000)) fail();
  if (doc.locked !== undefined && (doc.kind !== 'sequence' || typeof doc.locked !== 'boolean')) fail();
  if (doc.lowercase !== undefined && (doc.kind !== 'sequence' || !Array.isArray(doc.lowercase) ||
    !doc.lowercase.every(r => Array.isArray(r) && r.length === 2 && r.every(Number.isInteger) &&
      r[0] >= 1 && r[0] <= r[1] && r[1] <= doc.bases.length))) fail();
  const files = Array.isArray(data.assets) ? data.assets : [];
  const hasFile = id => files.some(file => file?.id === id);
  if (doc.trace !== undefined && (doc.kind !== 'sequence' || !files.some(file => file?.id === doc.trace && !file.url))) fail();
  if (doc.subtype !== undefined && (doc.subtype !== 'oligo' || doc.kind !== 'sequence' || !['DNA', 'RNA'].includes(doc.type))) fail();
  if (doc.primerPairs !== undefined) {
    if (doc.kind !== 'sequence' || doc.type !== 'DNA' || !Array.isArray(doc.primerPairs) || !doc.primerPairs.every(pair => {
      if (!pair || !typedText(pair.name)) return false;
      if (pair.forwardId === undefined && pair.reverseId === undefined) {
        return [pair.forward, pair.reverse].every(value => typedText(value) && /^[ACGT]{12,60}$/.test(value));
      }
      return ['forward', 'reverse'].every(key => cleanId(pair[key + 'Id']) && ['DNA', 'RNA'].includes(pair[key + 'Type']) &&
        storedPrimerBases(pair[key], pair[key + 'Type'])) && pair.forwardId !== pair.reverseId;
    })) fail();
  }
  if (doc.digests !== undefined && (doc.kind !== 'sequence' || doc.type !== 'DNA' || !Array.isArray(doc.digests) ||
    doc.digests.length > 100 || !doc.digests.every(item => item && cleanId(item.id) && settingsName(item.name) &&
      validDate(item.at) && validEnzymes(item.enzymes) && item.enzymes.length) ||
    new Set(doc.digests.map(item => item.id)).size !== doc.digests.length)) fail();
  if (doc.attachments !== undefined && (!strings(doc.attachments) || !doc.attachments.every(hasFile))) fail();
  if (doc.tables !== undefined && (!Array.isArray(doc.tables) || !doc.tables.every(table => table &&
    typedText(table.name) && (table.id===undefined||cleanId(table.id)) && strings(table.headers) && table.headers.length >= 1 && table.headers.length <= 30 &&
    Array.isArray(table.rows) && table.rows.length <= 200 && table.rows.every(row =>
      strings(row) && row.length === table.headers.length && row.every(cell => cell.length <= 10000))))) fail();
  if (doc.sourceIds !== undefined && (!strings(doc.sourceIds) || !doc.sourceIds.every(cleanId))) fail();
  if (doc.multi !== undefined) {
    const { rows, consensus, type } = doc.multi || {};
    if (doc.kind !== 'alignment' || !strings(rows) || rows.length !== doc.names.length || !typedText(consensus) ||
      !consensus.length || !['DNA', 'RNA', 'AA'].includes(type) || !rows.every(row => row.length === consensus.length) ||
      rows.length * consensus.length > 200000) fail();
  }
  if (doc.links !== undefined && (!strings(doc.links) || !doc.links.every(id => documents.has(id)))) fail();
}

function validateWorkspaceExtensions(data, projects, documents, validList, fail) {
  for(const library of data.libraries||[])for(const f of library.features||[])if(f.biopart)try{PartData.validate(f.biopart);}catch{fail();}
  if(data.grammars!==undefined){if(!validList(data.grammars)||data.grammars.length>30)fail();for(const g of data.grammars)try{PartData.validateGrammar(g);}catch{fail();}}
  if (data.circuits !== undefined) {
    if (!validList(data.circuits) || data.circuits.length > 100) fail();
    let total = 0;
    for (const circuit of data.circuits) {
      if (!settingsName(circuit.name) || !projects.has(circuit.project) || !validDate(circuit.updated)) fail();
      try { Circuit.validate(circuit); } catch { fail(); }
      total += (circuit.ucf?.length || 0) + circuit.parts.reduce((sum, part) => sum + (part.bases?.length || 0), 0);
    }
    if (total > 30_000_000) fail();
  }
  const { assets = [], places = [], containers = [], movements = [], batches = [] } = data;
  if (![assets, places, containers, movements, batches].every(validList)) fail();
  if (data.savedSearches !== undefined && (!validList(data.savedSearches) || !data.savedSearches.every(item =>
    typedText(item.query) && (item.filter === '' || Object.hasOwn(displayKind, item.filter)) &&
    (item.folder === '' || data.folders.some(folder => folder.id === item.folder)) && ['name', 'modified'].includes(item.sort)))) fail();
  if (data.libraries !== undefined && (!validList(data.libraries) || !data.libraries.every(item =>
    Array.isArray(item.features) && item.features.length <= 500 && item.features.every(feature =>
      feature && typedText(feature.name) && typedText(feature.kind) && /^[A-Za-z0-9_'-]{1,15}$/.test(feature.kind) &&
      typedText(feature.color) && /^#[a-f0-9]{6}$/i.test(feature.color) && typedText(feature.motif) &&
      feature.motif.length <= 1500 && ['DNA', 'RNA', 'AA'].includes(feature.type) &&
      Lab.basesOf(feature.motif, feature.type) === feature.motif)))) fail();
  if (data.enzymeLists !== undefined && (!validList(data.enzymeLists) || data.enzymeLists.length > 100 ||
    !data.enzymeLists.every(item => settingsName(item.name) && typedText(item.description) && item.description.length <= 1000 &&
      validEnzymes(item.enzymes)))) fail();
  if (data.gelLadders !== undefined && (!validList(data.gelLadders) || data.gelLadders.length > 100 ||
    !data.gelLadders.every(item => settingsName(item.name) && Array.isArray(item.bands) && item.bands.length >= 2 &&
      item.bands.length <= 100 && item.bands.every((bp, index, bands) => Number.isInteger(bp) && bp > 0 &&
        bp <= 250000 && (index === 0 || bands[index - 1] > bp))))) fail();
  const docMap = new Map([...data.docs, ...(data.trash || [])].map(doc => [doc.id, doc]));
  const ids = new Set(assets.filter(asset => !asset.url).map(asset => asset.id));
  const placeMap = new Map(places.map(place => [place.id, place]));
  let size = 0;
  for (const file of assets) {
    if (!projects.has(file.project) || !validDate(file.at)) fail();
    if (file.url !== undefined) {
      try { if (!typedText(file.url) || safeLink(file.url) !== file.url || file.data !== undefined) fail(); }
      catch { fail(); }
    } else {
      if (!Number.isInteger(file.size) || file.size < 1 || file.size > 8_000_000 || !typedText(file.mime) ||
          !typedText(file.data) || file.data.length !== Math.ceil(file.size / 3) * 4 ||
          /[^A-Za-z0-9+/=]/.test(file.data) || !/^[^=]*={0,2}$/.test(file.data)) fail();
      size += file.size;
    }
  }
  if (size > 60_000_000) fail();
  for (const place of places) {
    if (!typedText(place.category) || (place.parent !== '' && !placeMap.has(place.parent))) fail();
    const seen = new Set([place.id]);
    for (let current = placeMap.get(place.parent); current; current = placeMap.get(current.parent)) {
      if (seen.has(current.id)) fail();
      seen.add(current.id);
    }
  }
  for (const item of containers) {
    if (!placeMap.has(item.place) || !typedText(item.slot) || !typedText(item.barcode) || !typedText(item.unit) ||
        !Number.isFinite(item.quantity) || item.quantity < 0 ||
        (item.entity !== '' && (!documents.has(item.entity) || docMap.get(item.entity)?.kind !== 'entity'))) fail();
  }
  for (const item of movements) {
    if (!validDate(item.at) || !typedText(item.action) || !typedText(item.details) || !cleanId(item.container)) fail();
  }
  for (const batch of batches) {
    if (!validDate(batch.at) || !validList(batch.jobs) || !batch.jobs.length || batch.jobs.length > 50) fail();
    for (const job of batch.jobs) {
      if (!cleanId(job.sourceId) || !typedText(job.sequence) || !proteinSymbols.test(job.sequence) || job.sequence.length > 3000 ||
        !Object.hasOwn(modelStatus, job.status) ||
        (job.status === 'completed' ? !ids.has(job.result) : job.result !== undefined)) fail();
      if (job.confidence !== undefined && (!job.confidence || Array.isArray(job.confidence) || typeof job.confidence !== 'object' ||
        Object.entries(job.confidence).some(([key, value]) => !['confidence_score', 'ptm', 'iptm', 'complex_plddt'].includes(key) ||
          typeof value !== 'number' || !Number.isFinite(value) || value < 0 || value > 1))) fail();
    }
  }
}

const schemaTypes = { texto: 'text', 'número': 'number', numero: 'number', fecha: 'date' };
const schemaTypeLabel = { text: 'Texto', number: 'Número', date: 'Fecha' };

function parseSchemaFields(raw) {
  return raw.split('\n').filter(line => line.trim()).map(line => {
    const [label, type = 'texto', extra] = line.split('|').map(part => part.trim());
    if (!Object.hasOwn(schemaTypes, type.toLowerCase()) || extra !== undefined) {
      throw Error('Cada línea debe tener un nombre y un tipo válido. Por ejemplo, Volumen | número.');
    }
    return { name: label, type: schemaTypes[type.toLowerCase()] };
  });
}

function validateSchemaFields(fields) {
  if (!fields.length || fields.length > 40 || fields.some(f => !f.name || f.name.length > 80) ||
      new Set(fields.map(f => f.name.toLowerCase())).size !== fields.length) {
    throw Error('Añade entre 1 y 40 campos con nombres distintos de hasta 80 caracteres.');
  }
}

function editSchema(id) {
  const schema = schemaOf(id);
  show('Editar esquema', field('Nombre del esquema', input('name', schema.name)) +
    '<div class="dialog-grid">' + schema.fields.map((item, i) =>
      field('Campo ' + (i + 1) + ' · ' + schemaTypeLabel[item.type], input('field' + i, item.name, 'required maxlength="80"'))).join('') +
    '</div>' + field('Nuevos campos (opcional)', area('new', '', 'rows="4" placeholder="Volumen | número"')) +
    '<p class="muted small">Puedes renombrar campos o añadirlos. Los valores anteriores conservan su campo y tipo.</p>', data => {
    const name = nameOf(data);
    if (db.schemas.some(item => item !== schema && item.name.toLowerCase() === name.toLowerCase())) throw Error('Ya existe un esquema con ese nombre.');
    const append = parseSchemaFields(textOf(data, 'new'));
    const fields = schema.fields.map((item, i) => ({ ...item, name: textOf(data, 'field' + i) })).concat(append);
    validateSchemaFields(fields);
    if (append.length) {
      for (const doc of [...db.docs, ...db.trash]) {
        if (doc.kind !== 'entity' || doc.schema !== id) continue;
        doc.values = doc.values.concat(append.map(() => ''));
        for (const version of doc.history || []) version.data.values = version.data.values.concat(append.map(() => ''));
      }
    }
    Object.assign(schema, { name, fields });
    save();
    render();
  }, 'Guardar esquema', 'Registros');
}

async function unzipProject(buffer) {
  const view = new DataView(buffer);
  const size = buffer.byteLength;
  const u16 = offset => view.getUint16(offset, true);
  const u32 = offset => view.getUint32(offset, true);
  let footer = size - 22;
  while (footer >= Math.max(0, size - 65557) && (u32(footer) !== 0x06054b50 || footer + 22 + u16(footer + 20) !== size)) footer--;
  if (footer < Math.max(0, size - 65557)) throw Error('No se encontró el directorio del ZIP.');
  if (u16(footer + 4) || u16(footer + 6)) throw Error('El ZIP debe estar en un único archivo.');
  const count = u16(footer + 10);
  let cursor = u32(footer + 16);
  if (count > 500 || cursor + u32(footer + 12) > footer) throw Error('El ZIP excede 500 archivos o su índice está dañado.');
  const out = [];
  let total = 0;
  const decoder = new TextDecoder();
  for (let i = 0; i < count; i++) {
    if (cursor + 46 > footer || u32(cursor) !== 0x02014b50) throw Error('El índice del ZIP está dañado.');
    const flags = u16(cursor + 8);
    const method = u16(cursor + 10);
    const packed = u32(cursor + 20);
    const length = u32(cursor + 24);
    const nameLength = u16(cursor + 28);
    const extraLength = u16(cursor + 30);
    const commentLength = u16(cursor + 32);
    const offset = u32(cursor + 42);
    if (cursor + 46 + nameLength + extraLength + commentLength > footer) throw Error('Nombre de archivo ZIP incompleto.');
    const name = decoder.decode(new Uint8Array(buffer, cursor + 46, nameLength)).replaceAll('\\', '/');
    cursor += 46 + nameLength + extraLength + commentLength;
    if (name.endsWith('/') || name.startsWith('__MACOSX/') || name.split('/').some(part => part.startsWith('.'))) continue;
    if (flags & 1 || ![0, 8].includes(method)) throw Error('El ZIP usa cifrado o un método de compresión incompatible.');
    if (name.startsWith('/') || name.includes('\0') || offset + 30 > footer || u32(offset) !== 0x04034b50) throw Error('El ZIP contiene una entrada inválida.');
    if (length > 8_000_000 || total + length > 50_000_000) throw Error('El ZIP supera 8 MB por archivo o 50 MB extraídos.');
    total += length;
    const start = offset + 30 + u16(offset + 26) + u16(offset + 28);
    if (start + packed > footer) throw Error('El ZIP contiene datos incompletos.');
    const packedBytes = new Uint8Array(buffer, start, packed);
    let bytes = packedBytes;
    if (method === 8) {
      const stream = new Blob([packedBytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader();
      bytes = new Uint8Array(length);
      let written = 0;
      for (;;) {
        const { value, done } = await stream.read();
        if (done) break;
        if (written + value.byteLength > length) { await stream.cancel(); throw Error('El tamaño de un archivo ZIP no coincide con su índice.'); }
        bytes.set(value, written);
        written += value.byteLength;
      }
      if (written !== length) throw Error('El tamaño de un archivo ZIP no coincide con su índice.');
    } else if (bytes.length !== length) throw Error('El tamaño de un archivo ZIP no coincide con su índice.');
    out.push({ name, bytes });
  }
  return out;
}

function importProjectZip() {
  show('Import project ZIP', field('Benchling ZIP export', '<input type="file" name="archive" accept=".zip" required>') +
    field('Project name', input('name', 'Imported project', 'maxlength="160" required')) +
    '<p class="muted">HTML entries become editable text. FASTA and GenBank become sequences. Other files are kept as attachments. Choose an HTML export to edit notebook contents.</p>', async data => {
    const file = data.get('archive');
    if (file.size > 50_000_000) throw Error('El archivo ZIP supera 50 MB.');
    const items = await unzipProject(await file.arrayBuffer());
    if (!items.length) throw Error('El ZIP está vacío.');
    const project = { id: uuid(), name: nameOf(data) };
    const folders = [];
    const docs = [];
    const assets = [];
    const seenFolders = new Map();
    const decoder = new TextDecoder();
    let bytesUsed = db.assets.reduce((total, asset) => total + (asset.size || 0), 0);
    for (const item of items) {
      const segments = item.name.split('/').filter(Boolean);
      if (!segments.length) continue;
      const filename = segments.pop().slice(0, 160);
      const name = filename.replace(/\.[^.]+$/, '') || filename;
      let folder = '';
      for (const segment of segments) {
        const key = folder + '/' + segment;
        if (!seenFolders.has(key)) {
          const entry = { id: uuid(), name: segment.slice(0, 160), project: project.id, parent: folder };
          seenFolders.set(key, entry.id);
          folders.push(entry);
        }
        folder = seenFolders.get(key);
      }
      const location = { project: project.id, folder };
      if (/\.(?:fa|fasta|fas|fna|faa|gb|gbk|gbff|genbank)$/i.test(filename)) {
        const records = Lab.readSequences(decoder.decode(item.bytes), name);
        docs.push(...records.map(({ omitted, ...record }) => newDoc('sequence', { ...record, ...location })));
      } else if (/\.html?$/i.test(filename)) {
        docs.push(newDoc('note', { name, ...location, content: importedNote(decoder.decode(item.bytes)), links: [], tables: [], attachments: [] }));
      } else if (item.bytes.length) {
        bytesUsed += item.bytes.length;
        if (bytesUsed > 60_000_000) throw Error('Los adjuntos del espacio superarían 60 MB.');
        const type = /\.pdf$/i.test(filename) ? 'application/pdf' : 'application/octet-stream';
        const asset = await makeAsset(new File([item.bytes], filename, { type }), filename, project.id);
        assets.push(asset);
        docs.push(newDoc('note', { name, ...location, content: '', links: [], tables: [], attachments: [asset.id] }));
      }
      if (docs.length > 700) throw Error('El ZIP contiene demasiados registros para un proyecto.');
    }
    db.projects.push(project);
    db.folders.push(...folders);
    db.docs.push(...docs);
    db.assets.push(...assets);
    Object.assign(ui, { module: 'projects', project: project.id, folder: '', projectRoot: false, query: '', filter: '', group: 'docs' });
    save();
    if (docs.length) openDoc(docs[0].id);
    else render();
    toast(docs.length + ' archivos importados.');
  }, 'Import project', '');
}

function exportProjectZip() {
  const project = projectOf(ui.project);
  const docs = db.docs.filter(doc => doc.project === project.id);
  if (!docs.length) { toast('This project has no files.'); return; }
  const filenames = new Set();
  const pathPart = name => name.replace(/[^\p{L}\p{N} ._-]/gu, '_').trim().replace(/^\.+/, '_').slice(0, 100) || 'item';
  const entries = docs.map(doc => {
    const folder = folderOf(doc.folder);
    const prefix = folder ? folderTrail(folder).split(' / ').map(pathPart).join('/') + '/' : '';
    const sequence = doc.kind === 'sequence';
    const ext = sequence ? '.gb' : doc.kind === 'alignment' ? '.fasta' : doc.kind === 'entity' ? '.json' : '.html';
    let path = prefix + pathPart(doc.name) + ext;
    for (let i = 2; filenames.has(path.toLowerCase()); i++) path = prefix + pathPart(doc.name) + '-' + i + ext;
    filenames.add(path.toLowerCase());
    const content = sequence ? Lab.toGenBank(doc) : doc.kind === 'alignment' ?
      (doc.multi?.rows || [doc.result.first, doc.result.second]).map((bases, i) => Lab.toFasta({ name: doc.names[i], bases })).join('') :
      doc.kind === 'entity' ? JSON.stringify({ id: doc.registryId, name: doc.name, fields: schemaOf(doc.schema).fields, values: doc.values }, null, 2) :
      '<!doctype html><meta charset="utf-8"><title>' + esc(doc.name) + '</title><main><h1>' + esc(doc.name) + '</h1>' + Notebook.markup(doc.content) + '</main>';
    return [path, content];
  });
  for (const asset of db.assets.filter(item => item.project === project.id && item.data)) {
    entries.push(['Attachments/' + asset.id + '-' + pathPart(asset.name), binaryOf(asset)]);
  }
  download(project.name + '.zip', zipStored(entries), 'application/zip');
}

function flyout(anchor, choices, options = {}) {
  const rect = anchor.getBoundingClientRect();
  closePopup();
  const node = document.createElement('div');
  node.className = 'flyout' + (options.global ? ' flyout-global' : '');
  node.style.left = Math.min(innerWidth - 235, Math.max(3, options.point?.x ?? (options.global ? rect.right : rect.left))) + 'px';
  node.style.top = Math.max(3, options.point?.y ?? (options.global ? rect.top : rect.bottom + 3)) + 'px';
  node.setAttribute('role', 'menu');
  if (options.search) node.innerHTML = '<div class="flyout-search"><input type="search" placeholder="Search" aria-label="' + esc(options.searchLabel || 'Search create menu') + '"></div>';
  const list = document.createElement('div');
  node.append(list);
  const showRows = query => {
    list.replaceChildren();
    const entries = options.back ? [['‹ Back', options.back], ...choices] : choices;
    for (const [title, action, value = '', glyph] of entries) {
      if (query && !title.toLowerCase().includes(query) &&
        !(Array.isArray(action) && action.some(([name]) => name.toLowerCase().includes(query)))) continue;
      const row = document.createElement('button');
      row.type = 'button';
      row.setAttribute('role', options.radio ? 'menuitemradio' : options.layerMenu || options.checkboxes ? 'menuitemcheckbox' : 'menuitem');
      row.setAttribute('aria-label', title);
      row.className = 'flyout-item';
      if (options.radio) { row.classList.add('flyout-radio'); row.setAttribute('aria-checked', String(value === options.selected)); }
      row.innerHTML = (glyph ? icon(glyph) : '') + '<span>' + esc(title) + '</span>' + (Array.isArray(action) ? '<b>›</b>' : '');
      if (options.layerMenu || options.checkboxes) {
        row.setAttribute('aria-checked', String(options.checkboxes ? options.checkboxes.checked(value) : value==='orfs'?orfLayerVisible(options.layerScope):ui.visibility[value]));
        row.insertAdjacentHTML('afterbegin', '<i class="layer-check" aria-hidden="true">✓</i>');
      }
      row.addEventListener('click', event => {
        event.stopPropagation();
        if (options.checkboxes) { options.checkboxes.toggle(value); row.setAttribute('aria-checked', String(options.checkboxes.checked(value))); return; }
        if (options.layerMenu) {
          if(value==='orfs') { toggleORFLayer(options.layerScope); row.setAttribute('aria-checked',String(orfLayerVisible(options.layerScope)));return; }
          ui.visibility[value] = !ui.visibility[value];
          row.setAttribute('aria-checked', String(ui.visibility[value]));
          renderBases();
          refreshMapGraphic();
          return;
        }
        if (Array.isArray(action)) {
          flyout(anchor, action, { ...options, search: false, back: () => flyout(anchor, choices, options) });
          return;
        }
        if (typeof action === 'function') { closePopup(); action(); return; }
        closePopup();
        runAction(action, value, event);
      });
      const setting = options.layerMenu && { orfs: ['orf-settings', 'ORF settings'], translations: ['translation-settings', 'Translation settings'] }[value];
      if (setting) {
        const group = document.createElement('div');
        group.className = 'layer-menu-row';
        group.append(row);
        group.insertAdjacentHTML('beforeend', compactIcon('settings', setting[0], setting[1]));
        list.append(group);
      } else list.append(row);
    }
    if (!list.childElementCount) list.textContent = 'No matching actions';
  };
  showRows('');
  (anchor.closest('dialog[open]')||document.body).append(node);
  popup = { node, anchor };
  const bottom = node.getBoundingClientRect().bottom;
  if (bottom > innerHeight - 6) node.style.top = Math.max(4, node.offsetTop - (bottom - innerHeight + 6)) + 'px';
  const query = node.querySelector('input');
  if (query) {
    query.addEventListener('input', () => showRows(query.value.toLowerCase().trim()));
    query.focus();
  } else list.querySelector('button')?.focus();
}

function runAction(name, value, event) {
  if (!Team.actionAllowed(name)) return;
  if (active()?.locked && lockedSequenceActions.has(name)) { toast('This sequence is locked.'); return; }
  try {
    const result = actions[name]?.(value, event);
    if (result && typeof result.catch === 'function') result.catch(error => toast(error.message || 'No se pudo completar la operación.'));
  } catch (error) { toast(error.message || 'No se pudo completar la operación.'); }
}

function matchingFiles() {
  let docs = db.docs;
  if (ui.module === 'home') return docs.slice().sort((a, b) => (b.updated || 0) - (a.updated || 0)).slice(0, 20);
  if (ui.module === 'projects') docs = docs.filter(doc => doc.project === ui.project &&
    (ui.group === 'templates' ? doc.kind === 'template' : doc.kind !== 'template' && (ui.query || doc.folder === ui.folder)));
  if (ui.module === 'search' && ui.searchFolder) docs = docs.filter(doc => doc.folder === ui.searchFolder);
  if (ui.filter) docs = docs.filter(doc => doc.kind === ui.filter);
  const query = ui.query.trim().toLowerCase();
  return docs.filter(doc => !query || [doc.name, doc.content, doc.description, doc.registryId, ...(doc.values || [])]
    .some(value => String(value || '').toLowerCase().includes(query)))
    .sort((a, b) => ui.searchSort === 'modified' ? (b.updated || 0) - (a.updated || 0) : a.name.localeCompare(b.name));
}

function browseRows(table = false) {
  const files = matchingFiles();
  const folders = ui.module === 'projects' && ui.group !== 'templates' && !ui.filter && !ui.query ?
    db.folders.filter(item => item.project === ui.project && item.parent === ui.folder) : [];
  if (ui.module === 'projects' && ui.projectRoot) {
    return db.projects.filter(item => item.name.toLowerCase().includes(ui.query.toLowerCase()))
      .sort((a, b) => Number(Boolean(b.star)) - Number(Boolean(a.star)) || a.name.localeCompare(b.name))

      '<p class="empty-side">No projects found</p>';
  }
  if (table && (files.length || folders.length)) return tableView(['Name', 'Type', 'Location', 'Modified'],
    folders.map(folder => [
      btn(icon('folder') + ' ' + esc(folder.name), 'folder-open', attr(folder.id, 'class="plain-link"')), 'Folder', esc(projectOf(folder.project)?.name), '—',
    ]).concat(files.map(doc => [
      btn(icon(doc.kind) + ' ' + esc(doc.name), 'open', attr(doc.id, 'class="plain-link"')), displayKind[doc.kind],
      esc(folderName(doc.folder) || projectOf(doc.project)?.name), dateLabel(doc.updated),
    ])));
  const rows = folders.map(folder => btn(icon('folder') + '<span class="item-name">' + esc(folder.name) + '</span>›',

    'open', attr(doc.id, 'class="list-item" aria-current="' + (ui.active === doc.id) + '"'))).join('');
  return rows + fileRows || '<p class="empty-side">No items found</p>';
}

function spreadsheetImport(mode) {
  const type = mode === 'oligo' ? 'DNA' : mode;
  show('Import sequences from spreadsheet', field('CSV or TSV file', '<input type="file" name="file" accept=".csv,.tsv,.txt">') +
    field('Or paste spreadsheet rows', area('rows', '', 'rows="6" placeholder="Name,Sequence" class="mono"')) +
    destinationField() + '<p class="muted small">Include Name and Sequence columns. An optional Topology column accepts circular or linear.</p>',
    async data => {
      const file = data.get('file');
      if (file.size > 5_000_000) throw Error('File exceeds 5 MB.');
      const raw = file.size ? await file.text() : String(data.get('rows'));
      const separator = raw.split(/\r?\n/, 1)[0].includes('\t') ? '\t' : ',';
      const rows = Notebook.parseDelimited(raw, separator);
      const columns = rows.shift().map(value => value.trim().toLowerCase());
      const name = columns.indexOf('name');
      const sequence = columns.findIndex(column => ['sequence', 'bases'].includes(column));
      const topology = columns.indexOf('topology');
      if (name < 0 || sequence < 0 || !rows.length) throw Error('Include Name and Sequence headers and at least one row.');
      const [project, folder] = textOf(data, 'location').split('|');
      const records = rows.map((row, i) => {
        const label = row[name].trim();
        if (!label || label.length > 160) throw Error('Invalid name on row ' + (i + 2) + '.');
        let bases;
        try { bases = Lab.basesOf(row[sequence], type); } catch { throw Error('Invalid sequence on row ' + (i + 2) + '.'); }
        return newDoc('sequence', { project, folder, name: label, type, bases,
          topology: type !== 'AA' && mode !== 'oligo' && row[topology]?.trim().toLowerCase() === 'circular' ? 'circular' : 'linear',
          features: [], description: '', ...(mode === 'oligo' ? { subtype: 'oligo' } : {}) });
      });
      db.docs.push(...records);
      Object.assign(ui, { project, folder, module: 'projects', group: 'docs', query: '', filter: '', projectRoot: false });
      save();
      openDoc(records[0].id);
    }, 'Import', '');
}

function featureTrack(doc, offset, length, layout) {
  const strips = [];
  for (const { index, feature: item, lane,top } of layout.tracks) {
    for (const [a, b] of item.ranges) {
      const from = Math.max(a, offset + 1);
      const to = Math.min(b, offset + length);
      if (from > to) continue;
      strips.push({ index, item, lane, top, from, to, left: from - offset - 1, width: to - from + 1 });
    }
  }
  return strips.length ? '<div class="feature-strips" style="height:' + (layout.height + 4) + 'px">' + strips.map(({ index, item, top, from, to, left, width }) => {
    let bases = item.name;
    if (item.kind === 'primer_bind' && ui.visibility.primerBases) {
      bases = item.primer ? displayedPrimerBases(item, offset + left + 1, width) : doc.bases.slice(offset + left, offset + left + width);
    }
    const translated = item.kind === 'CDS' || item.kind === 'ORF' && ui.orfOptions?.amino;
    const letters = item.kind === 'primer_bind' && ui.visibility.primerBases;
    const ends = featureEnds(item, from, to);
    const title = item.name + ' · ' + (item.strand < 0 ? '← Reverse (−)' : 'Forward (+) →') + ' · ' + displayBase(doc,from) + '–' + displayBase(doc,to);
    const attrs = 'title="' + esc(title) + '" aria-label="' + esc(title) + '" class="feature-strip' + (item.strand < 0 ? ' reverse' : '') + (translated ? ' translated-track' : '') + (translated || letters ? ' aligned-letters' : '') +
      (item.kind === 'ORF' ? ' orf-sequence-track' : '') + '" data-feature-start="' + from + '" data-feature-end="' + to + '" data-strand="' + item.strand + '" data-head="' + ends.head +
      '" data-continues-left="' + ends.continuesLeft + '" data-continues-right="' + ends.continuesRight + '" style="left:calc(var(--base-width) * ' + left + ');top:' + (4 + top) + 'px;width:calc(var(--base-width) * ' + width + ');--track-color:' + colorOf(item.color) + '"';
    const content = letters ? '<span class="codon-strip">' +
      [...bases].map(base => '<span>' + esc(base) + '</span>').join('') + '</span>' : esc(bases);
    const shape = item.kind === 'ORF' ? orfSequenceShape(item,from,to,width*seqView.character) : featureShape(item,from,to,width*seqView.character);
    return btn((translated?'<span class="feature-amino">'+codonStrip(doc,item,from,width)+'</span>':'') + shape + '<span class="feature-content"'+(item.kind!=='ORF'?' style="color:'+featureInk(item.color)+'"':'')+'>' + content + '</span>', sequenceTrackAction({index,feature:item}), sequenceTrackAttrs({index,feature:item}) + ' ' + attrs);
  }).join('') + '</div>' : '';
}

}

function serializeEntry(node) {
  const body = element => Array.from(element.childNodes).map(part).join('');
  const part = element => {
    if (element.nodeType === Node.TEXT_NODE) return element.textContent.replaceAll('\u00a0', ' ');
    if(/^[\w-]{1,100}$/.test(element.dataset?.noteTable||''))return '\n[[table:'+element.dataset.noteTable+']]\n';
    if (/^[\w-]{1,100}$/.test(element.dataset?.mention || '')) {
      return '[[@' + element.dataset.mention + '|' + encodeURIComponent(element.dataset.label || element.textContent) + ']]';
    }
    const value = body(element);
    const tag = element.tagName;
    if (tag === 'BR') return '\n';
    if (['STRONG', 'B'].includes(tag)) return value.trim() ? '**' + value + '**' : value;
    if (['EM', 'I'].includes(tag)) return value.trim() ? '*' + value + '*' : value;
    if (tag === 'U') return '__' + value + '__';
    if (['STRIKE', 'S'].includes(tag)) return '~~' + value + '~~';
    if (tag === 'CODE') return '`' + value + '`';
    if (/^H[1-6]$/.test(tag)) return '#'.repeat(Math.min(3, Number(tag[1]) - 1 || 1)) + ' ' + value.trim() + '\n';
    if (tag === 'BLOCKQUOTE') return '> ' + value.trim() + '\n';
    if (tag === 'UL' || tag === 'OL') return [...element.children].map((item, i) =>
      (tag === 'UL' ? '- ' : (i + 1) + '. ') + body(item).trim() + '\n').join('');
    if (element.classList?.contains('check-indicator')) return element.textContent === '☑' ? '[x]' : '[ ]';
    if (['P', 'DIV'].includes(tag)) return value.replace(/\n$/, '') + '\n';
    return value;
  };
  return body(node).replace(/\n$/, '');
}

let notebookSelection;
document.addEventListener('mousedown', event => {
  if (event.target.closest('[data-preserve-selection]')) event.preventDefault();
});
document.addEventListener('selectionchange', () => {
  const node = byId('rich-entry');
  const selection = window.getSelection();
  if (node && selection?.rangeCount && node.contains(selection.anchorNode) && node.contains(selection.focusNode)) {
    notebookSelection = selection.getRangeAt(0).cloneRange();
  }
});

function restoreEditorSelection() {
  const node = byId('rich-entry');
  if (!node) return null;
  node.focus();
  const selection = window.getSelection();
  if (notebookSelection && node.contains(notebookSelection.commonAncestorContainer)) {
    selection.removeAllRanges();
    selection.addRange(notebookSelection);
  } else {
    const range = document.createRange();
    range.selectNodeContents(node);
    range.collapse(false);
    selection.removeAllRanges();
    selection.addRange(range);
  }
  return node;
}

function richCommand(command) {
  const node = restoreEditorSelection();
  if (!node) return;
  if (command === 'heading' || command === 'paragraph') document.execCommand('formatBlock', false, command === 'heading' ? 'h2' : 'p');
  else document.execCommand(command, false);
  storeRichText(node);
}

function storeRichText(node) {
  const doc = active();
  if (!doc||!Team.writable()) return;
  const content = serializeEntry(node);
  if (content === doc.content) return;
  if (Date.now() - (doc.history?.[0]?.at || 0) > 300000) remember(doc, 'Before editing entry');
  doc.content = content;
  noteTableInit(doc);
  doc.updated = Date.now();
  save();
}

function insertNotebookText(text) {
  const node = restoreEditorSelection();
  if (!node) return;
  document.execCommand('insertText', false, text);
  storeRichText(node);
}
